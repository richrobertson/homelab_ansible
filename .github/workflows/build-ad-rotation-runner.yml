name: Build AD rotation runner image

# Builds docker/ad-rotation-runner on every PR that could change what the
# unattended AD rotation runs, smoke-tests it, and publishes to GHCR only from
# main. The prod CronJob (homelab_flux) consumes ghcr.io/<owner>/ad-rotation-runner.
on:
  pull_request:
    paths:
      - docker/ad-rotation-runner/**
      - ansible/domain/rotate_service_account_passwords.yml
      - ansible/domain/vars/**
      - inventory/runner/**
      - scripts/rotate_due_service_accounts.py
      - scripts/rotate_due_k8s_secrets.py
      - scripts/rotation_aws.py
      - scripts/rotation_unifi.py
      - scripts/rotation_b2.py
      - scripts/rotation_keycloak_oidc.py
      - scripts/rotation_nextcloud_admin.py
      - scripts/rotation_syncthing.py
      - scripts/rotation_synology.py
      - ansible/k8s/vars/**
      - ansible.cfg
      - .github/workflows/build-ad-rotation-runner.yml
  push:
    branches: [main]
    paths:
      - docker/ad-rotation-runner/**
      - ansible/domain/rotate_service_account_passwords.yml
      - ansible/domain/vars/**
      - inventory/runner/**
      - scripts/rotate_due_service_accounts.py
      - scripts/rotate_due_k8s_secrets.py
      - scripts/rotation_aws.py
      - scripts/rotation_unifi.py
      - scripts/rotation_b2.py
      - scripts/rotation_keycloak_oidc.py
      - scripts/rotation_nextcloud_admin.py
      - scripts/rotation_syncthing.py
      - scripts/rotation_synology.py
      - ansible/k8s/vars/**
      - ansible.cfg
      - .github/workflows/build-ad-rotation-runner.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ad-rotation-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ad-rotation-runner
    steps:
      - uses: actions/checkout@v7

      - name: Build image (local, not pushed)
        run: docker build -f docker/ad-rotation-runner/Dockerfile -t ad-rotation-runner:ci .

      - name: Smoke test the image
        run: |
          set -euo pipefail
          run() { docker run --rm --entrypoint "$1" ad-rotation-runner:ci "${@:2}"; }
          run vault version
          run kubectl version --client
          run ansible-playbook --version
          run ansible-galaxy collection list ansible.windows
          run ansible-galaxy collection list community.hashi_vault
          # The 03:00-04:00 maintenance-window check needs time-zone data.
          run python3 -c "from zoneinfo import ZoneInfo; ZoneInfo('America/Los_Angeles')"
          # The wrapper must import and parse its arguments without Vault access.
          docker run --rm ad-rotation-runner:ci --help >/dev/null
          # Same for the k8s_secret rotator, which also loads its consumer map.
          docker run --rm --entrypoint python3 ad-rotation-runner:ci /opt/homelab_ansible/scripts/rotate_due_k8s_secrets.py --help >/dev/null
          docker run --rm --workdir /opt/homelab_ansible/scripts --entrypoint python3 ad-rotation-runner:ci -c "import rotation_aws, rotation_b2, rotation_unifi, rotation_keycloak_oidc, rotation_nextcloud_admin, rotation_syncthing, rotation_synology, boto3, paramiko; print('aws + b2 + unifi + keycloak_oidc + nextcloud_admin + syncthing + synology kinds ok, boto3', boto3.__version__, 'paramiko', paramiko.__version__)"
          docker run --rm --entrypoint python3 ad-rotation-runner:ci -c "import yaml; m=yaml.safe_load(open('/opt/homelab_ansible/ansible/k8s/vars/k8s_secret_consumers.yml'))['k8s_secret_rotations']; assert m, 'empty map'; print(len(m), 'k8s secrets mapped')"
          # Synology kind: pinned host keys load, the replication-plan parser reads
          # real synodr output, and generated passwords meet DSM's policy.
          docker run --rm --workdir /opt/homelab_ansible/scripts --entrypoint python3 ad-rotation-runner:ci -c "
          import paramiko, rotation_synology as s
          assert len(paramiko.HostKeys(s.KNOWN_HOSTS)) == 2, 'synology_known_hosts'
          out = ' [share] [remote] [mainsite] \\nplanId: [ca81edca-0ed6-461b-bb25-43de28d457af]\\ntarget: [web](web)\\nstatus: [ready](1)\\nopstatus: [ready]\\nremote conn[0]: conn[192.168.1.141/5010/http]/ credId[3ba4eba6-5653-45be-afdd-f01c94dbc200]/ replicaConn[192.168.1.141/5566/2]\\n'
          p = s.parse_plans(out)
          assert p == [{'id': 'ca81edca-0ed6-461b-bb25-43de28d457af', 'target': 'web', 'status': 'ready', 'op': 'ready', 'conns': [{'addr': '192.168.1.141', 'port': '5010', 'protocol': 'http', 'replica_port': '5566'}]}], p
          pw = s.generate_password(); assert len(pw) == 32 and any(c in '-_' for c in pw)
          print('synology kind ok')"
          # The playbook must parse with exactly the core + collections in the image.
          docker run --rm --workdir /opt/homelab_ansible --entrypoint ansible-playbook \
            ad-rotation-runner:ci --syntax-check -i inventory/runner/rotation.ini \
            ansible/domain/rotate_service_account_passwords.yml
          # Non-root by construction.
          test "$(docker run --rm --entrypoint id ad-rotation-runner:ci -u)" = "10001"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          version="0.1.${{ github.run_number }}"
          short="${GITHUB_SHA::7}"
          for tag in "$version" "sha-$short"; do
            docker tag ad-rotation-runner:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "pushed $IMAGE:$version ($short)" >> "$GITHUB_STEP_SUMMARY"
