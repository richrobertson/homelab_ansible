---
# Per-secret consumer map for UNATTENDED rotation of k8s_secret-class Vault
# secrets (ansible/proxmox/vars/secret_rotation_classes.yml names this map as the
# prerequisite for automating that class). Read by scripts/rotate_due_k8s_secrets.py,
# which runs in the ad-rotation CronJob of each cluster (homelab_flux
# apps/{prod,staging}/ad-rotation) right after the AD account rotation.
#
# Only list a secret here when ALL of these hold - that is what "easily
# automatable" means:
#   - we generate the value ourselves (no external console, device or provider);
#   - every consumer is a workload in ONE cluster, fed by VSO;
#   - a restart picks the new value up, and `verify` can prove both that the new
#     value works and that the old one no longer does.
# Anything else (appliance passwords, provider API keys, database passwords)
# stays manual until it gets a dedicated propagation kind - as AWS IAM keys,
# B2 keys and Keycloak OIDC client secrets have (sections at the end).
#
# Each rotation: generate -> vault kv patch <field> -> force-sync every VSS ->
# confirm each k8s Secret holds the new value -> restart -> verify. On ANY
# failure: vault kv rollback to the previous version, resync, restart, and verify
# the OLD value works again. Everything the runner may touch is granted by name:
# keep this map, the runner RBAC (homelab_flux apps/*/ad-rotation/rbac.yaml) and
# the Vault policy (homelab_bootstrap terraform/kubernetes/ad_rotation_runner.tf)
# in step - a missing grant fails closed and rolls back.
#
# Schema:
#   <vault path under mount secret>:
#     kube_context: admin@prod | admin@staging   (selects the runner)
#     field: <key to rotate>                      generator: urlsafe32
#     vss:     [{namespace, name}]                (VaultStaticSecret = Secret name)
#     restart: [{namespace, deployment}]
#     verify:  {kind: collabora_admin, namespace, deployment, user_field}

k8s_secret_rotations:
  nextcloud/staging/collabora:
    description: Collabora Online admin-console login (staging). Nextcloud talks WOPI and never uses it.
    kube_context: admin@staging
    field: password
    generator: urlsafe32
    vss:
      - {namespace: default, name: collabora-secret}
    restart:
      - {namespace: default, deployment: nextcloud-collabora}
    verify:
      kind: collabora_admin
      namespace: default
      deployment: nextcloud-collabora
      user_field: username

  nextcloud/prod/collabora:
    description: >-
      Collabora Online admin-console login (prod, the live nextcloud-migration-ldap
      stack). default/collabora-secret has no workload (default/nextcloud is scaled
      to 0) but is synced too, so no copy keeps the old value.
    kube_context: admin@prod
    field: password
    generator: urlsafe32
    vss:
      - {namespace: nextcloud, name: collabora-secret}
      - {namespace: default, name: collabora-secret}
    restart:
      - {namespace: nextcloud, deployment: nextcloud-migration-ldap-collabora}
    verify:
      kind: collabora_admin
      namespace: nextcloud
      deployment: nextcloud-migration-ldap-collabora
      user_field: username

  # --- kind: aws_iam_access_key (scripts/rotation_aws.py) ---------------------
  # Two-key overlap, same design as ansible/proxmox/roles/pbs_s3_key_rotation:
  # a throwaway Vault-minted rotator (aws/roles/<rotator_role>) creates the new
  # key, STS proves it, every Vault copy is updated and read back, and only then
  # is the old key deleted. Consumers read Vault at runtime (terraform/tf-env.sh,
  # the aws-env shell function), so the Vault write IS their update.
  aws/user/homelab_terraform:
    description: >-
      IAM user homelab_terraform - Terraform's AWS provider + state backend.
      The hard-coded copy in ~/.bash_profile was replaced by aws-env() on
      2026-11-17; nothing outside Vault may hold this key.
    kind: aws_iam_access_key
    kube_context: admin@prod
    iam_user: homelab_terraform
    rotator_role: homelab-terraform-key-rotator
    fields: {id: access_key, secret: secret_access_key}
    console_password_field: console_password
    copies:
      - {path: aws/terraform/provider, id: AWS_ACCESS_KEY_ID, secret: AWS_SECRET_ACCESS_KEY}

  # --- kind: b2_application_key (scripts/rotation_b2.py) ----------------------
  # The Backblaze S3 credential behind VolSync restic + CNPG backups. NEVER the
  # RESTIC_PASSWORD (see the restic_key class: that would orphan every snapshot);
  # the rotator patches keyID/applicationKey/keyName only and hash-checks that
  # RESTIC_PASSWORD is unchanged. ALL THREE are rotated by the PROD runner, the
  # only identity allowed to read the B2 rotator key (ops/backblaze/key-rotator),
  # so staging can never mint keys for prod's data. Each key's old value is held
  # until grace_hours have passed and the consumer cluster's own runner reports
  # (to health_path, from read-only status) that its backups succeeded on the new
  # key. Keys keep their bucket + namePrefix scope across rotations.
  backblaze/k8s/prod/volsync:
    description: Prod VolSync restic (volsync/default/) + prod CNPG (cnpg/) - bucket-scoped, no prefix.
    kind: b2_application_key
    kube_context: admin@prod
    consumer_cluster: prod
    health_path: backblaze/k8s/prod/volsync-health
    grace_hours: 24
  backblaze/k8s/staging/volsync:
    description: Staging VolSync restic, namePrefix volsync/staging/ (own key since 2026-11-18).
    kind: b2_application_key
    kube_context: admin@prod
    consumer_cluster: staging
    health_path: backblaze/k8s/staging/volsync-health
    grace_hours: 24
  backblaze/k8s/staging/cnpg:
    description: Staging CNPG backups, namePrefix cnpg-staging/ (own key since 2026-11-18).
    kind: b2_application_key
    kube_context: admin@prod
    consumer_cluster: staging
    health_path: backblaze/k8s/staging/cnpg-health
    grace_hours: 24

  # --- kind: nextcloud_admin (scripts/rotation_nextcloud_admin.py) -----------
  # The local Database-backend `admin` account (the break-glass admin that
  # survives a Keycloak/AD outage). The env vars only seed it at install time,
  # so the rotator runs `occ user:resetpassword` itself and keeps Vault in step.
  # Nextcloud is NOT restarted (Recreate strategy = ~3 min outage, no effect);
  # only the metrics exporter, which logs in as admin on every scrape, is.
  # Consumer audit 2026-11-17 (k8s Secrets of both clusters and all 131 readable
  # Vault KV paths hash-scanned; access logs; occ user:auth-tokens:list):
  #   - the two VSS-fed Secrets below and the exporter are the only copies/users;
  #   - admin has NO app passwords or sessions; Roy logs in by hand from Vault;
  #   - homelab_flux scripts/nextcloud-webdav-copy-users.sh reads the Secret at run time;
  #   - the Nextcloud container's own NEXTCLOUD_ADMIN_PASSWORD env goes stale
  #     until its next restart - harmless (install-only), but don't read it.
  nextcloud/staging/app:
    description: Nextcloud staging local admin. Consumers - default/nextcloud-metrics (exporter).
    kind: nextcloud_admin
    kube_context: admin@staging
    field: NEXTCLOUD_ADMIN_PASSWORD
    user_field: NEXTCLOUD_ADMIN_USER
    instance: {namespace: default, deployment: nextcloud, container: nextcloud}
    vss:
      - {namespace: default, name: nextcloud-secret}
    restart:
      - {namespace: default, deployment: nextcloud-metrics}
    exporters:
      - http://nextcloud-metrics.default.svc:9205/metrics

  nextcloud/prod/app:
    description: >-
      Nextcloud prod local admin (the live nextcloud-migration-ldap instance).
      Consumers - nextcloud/nextcloud-migration-ldap-metrics (exporter). The
      default/nextcloud and nextcloud-migration-clean deployments are scaled to 0;
      default/nextcloud-secret is synced anyway so no copy keeps the old value.
    kind: nextcloud_admin
    kube_context: admin@prod
    field: NEXTCLOUD_ADMIN_PASSWORD
    user_field: NEXTCLOUD_ADMIN_USER
    instance: {namespace: nextcloud, deployment: nextcloud-migration-ldap, container: nextcloud}
    vss:
      - {namespace: nextcloud, name: nextcloud-migration-secret}
      - {namespace: default, name: nextcloud-secret}
    restart:
      - {namespace: nextcloud, deployment: nextcloud-migration-ldap-metrics}
    exporters:
      - http://nextcloud-migration-ldap-metrics.nextcloud.svc:9205/metrics

  # --- kind: keycloak_oidc_client (scripts/rotation_keycloak_oidc.py) ---------
  # Confidential Keycloak OIDC client secrets. Keycloak (kcadm in the pod), every
  # Vault copy, every k8s Secret and the relying party's own stored copy are
  # changed together; verified with a bogus-code token request (invalid_grant =
  # client auth passed) for new-accepted AND old-refused, plus the app's stored
  # secret used from inside the app pod. The Vault path IS what the Keycloak
  # client-bootstrap Job reads (default/nextcloud-oidc-secret, VSS-synced), so a
  # later Job version re-asserts the NEW secret, never the old one.
  # NOT here: synology/prod/sso/authelia/{kermit,scooter} - the DSM SSO-client
  # side is configured in the DSM UI (no supported API), so those stay manual.
  nextcloud/staging/oidc:
    description: >-
      Keycloak client nextcloud_staging <-> staging Nextcloud (default/nextcloud,
      user_oidc provider `keycloak`). The stale `authelia` provider (Authelia is
      gone) is deliberately not updated.
    kind: keycloak_oidc_client
    kube_context: admin@staging
    field: OIDC_CLIENT_SECRET
    client_id_field: OIDC_CLIENT_ID
    keycloak:
      namespace: default
      deployment: keycloak
      realm: homelab
      token_endpoint: https://sso.staging.myrobertson.net/realms/homelab/protocol/openid-connect/token
    vss:
      - {namespace: default, name: nextcloud-oidc-secret}
    app:
      kind: nextcloud_user_oidc
      namespace: default
      deployment: nextcloud
      container: nextcloud
      providers: [keycloak]
      restart: true

  nextcloud/prod/oidc:
    description: >-
      Keycloak client nextcloud_prod <-> the LIVE prod Nextcloud
      (nextcloud/nextcloud-migration-ldap, user_oidc provider `keycloak`). Its
      env Secret nextcloud/nextcloud-oidc-secret is HAND-MADE (README of
      homelab_flux apps/prod/nextcloud-migration-ldap), not VSS, so it is patched
      directly. default/nextcloud-oidc-secret (VSS) feeds the Keycloak Job.
      No restart: the provider is updated in place (Recreate strategy = a restart
      is a full outage) and the next start re-applies the same value from the
      patched Secret.
    kind: keycloak_oidc_client
    kube_context: admin@prod
    field: OIDC_CLIENT_SECRET
    client_id_field: OIDC_CLIENT_ID
    keycloak:
      namespace: default
      deployment: keycloak
      realm: homelab
      token_endpoint: https://sso.myrobertson.com/realms/homelab/protocol/openid-connect/token
    vss:
      - {namespace: default, name: nextcloud-oidc-secret}
    secrets:
      - {namespace: nextcloud, name: nextcloud-oidc-secret, field: OIDC_CLIENT_SECRET}
    app:
      kind: nextcloud_user_oidc
      namespace: nextcloud
      deployment: nextcloud-migration-ldap
      container: nextcloud
      providers: [keycloak]
      restart: false

  # --- kind: syncthing_api_key (scripts/rotation_syncthing.py) ----------------
  # The home Syncthing (prod default/syncthing) REST/GUI API key. The source of
  # truth is <apikey> in config.xml on the syncthing-config-ceph PVC; the rotator
  # changes it there over the REST API (PATCH /rest/config/gui, no restart, sync
  # uninterrupted) and keeps Vault in step. GUI logins are LDAP (authMode ldap),
  # so there is no local GUI password to rotate.
  # Consumer audit 2026-11-18 (all 131 Vault KV paths and every prod Secret
  # hash-scanned): Vault is the ONLY other copy - no VaultStaticSecret reads
  # syncthing/prod. The syncthing-settings Job reads the key from config.xml at
  # run time; the Prometheus PodMonitor scrapes /metrics WITHOUT auth
  # (metricsWithoutAuth=true, homelab_flux 71888e9e), which verify re-checks.
  # NOT here:
  #   monitoring/syncthing/metrics (token) - a DEAD credential: it matches neither
  #     this key nor the seedbox's (403 here), and its only consumer, the
  #     PodMonitor bearer auth, was removed 2026-04-19. Retire it (the
  #     monitoring/syncthing-metrics-token VSS + the Vault path) rather than
  #     rotate it.
  #   monitoring/syncthing/remote-admin - the Ultra.cc SEEDBOX Syncthing GUI
  #     login (external host that IP-bans on bursts of SSH/failed logins; its
  #     API key is not in Vault). The same password is ALSO the seedbox Deluge
  #     password (torrent-reaper/prod DELUGE_PASSWORD, and the *arr download
  #     clients). Manual: change it in the seedbox GUI, then Vault.
  syncthing/prod:
    description: Home Syncthing REST/GUI API key (prod default/syncthing). Consumers - none via VSO.
    kind: syncthing_api_key
    kube_context: admin@prod
    field: api_key
    instance: {namespace: default, deployment: syncthing, container: syncthing}
