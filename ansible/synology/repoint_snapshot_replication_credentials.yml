---
# Repoint Snapshot Replication plans at a LOCAL DSM account instead of the AD
# service account svc-syno-repl.
#
#   # report only - shows which plans would be repointed and why
#   ansible-playbook -i inventory/environments/production.ini \
#     ansible/synology/repoint_snapshot_replication_credentials.yml
#
#   # actually repoint
#   ansible-playbook -i inventory/environments/production.ini \
#     ansible/synology/repoint_snapshot_replication_credentials.yml \
#     -e srsc_confirm=true
#
# WHY THIS EXISTS
#
# 6344161 de-privileged svc-syno-repl on 2026-07-29 23:59: removed it from
# Backup Operators, and removed its group GG-Synology-Snapshot-Replication from
# Domain Admins. Its commit body reasoned "Snapshot replication only needs the
# account to authenticate; DSM enforces the share ACLs, so no privilege is
# required and the consumer is unaffected."
#
# That reasoning was wrong, and this is the evidence: at the 00:00 run on
# 2026-07-30 - ninety seconds later - 14 replication plans began failing with
# "no remote permission" and kept failing for three days. The account still
# authenticates (DSM returns 402 "denied permission", NOT 400 "wrong password"),
# and it is still in DSM's local administrators group and its domain user cache.
# DSM's Snapshot Replication partner API requires privilege the de-privileging
# removed, not merely a valid identity.
#
# Re-adding Backup Operators alone was tested and did NOT fix it, so the
# load-bearing grant was the Domain Admins nesting. Rather than restore that -
# which is exactly what the hardening set out to remove - this repoints the
# plans at a local DSM account, which is not subject to AD group evaluation at
# all. The security change stays intact and replication works.
#
# WHY A LOCAL ACCOUNT IS THE RIGHT ANSWER, NOT A WORKAROUND
#
# Synology's own docs never state that Snapshot Replication supports domain
# accounts - every reference says only "administrator account". kermit already
# had a local account (svc-syno-ssh) stored as a Snapshot Replication credential
# since 2026-05-04, so this is the estate's existing pattern, not a new one.
#
# NO RE-BASELINE
#
# This edits the connection on the existing plan. It does NOT delete or recreate
# it. Verified on web_packages: the three catch-up syncs each moved 23,569 bytes
# in ~16s, identical to every historical sync back to 2026-07-15, and
# success_sync_count/plan history were preserved. Deleting a plan WOULD force a
# full baseline - community reports include a 12 TB re-sync - so this play never
# calls `plan delete`.

- name: Repoint Snapshot Replication plans at a local DSM account
  hosts: "{{ srsc_nas_group | default('synology_snapshot_replication_nas') }}"
  gather_facts: false
  serial: 1

  vars:
    srsc_confirm: false
    # The local DSM account the plans should authenticate to the partner with.
    # Must exist locally on BOTH NAS and be in DSM's administrators group.
    srsc_account: svc-syno-ssh
    srsc_partner_port: 5010
    srsc_partner_protocol: http
    srsc_replica_port: 5566
    srsc_target_type: btrfs

    synology_ssh_host: "{{ ansible_host | default(inventory_hostname) }}"
    synology_ssh_port: "{{ ansible_port | default(22) }}"
    # Deliberately srsc_account, not the group's ansible_user (admin). This play
    # connects AS the same local account it repoints the plans TO, so one
    # credential is exercised end to end: if the SSH login works, the account
    # exists and is usable, and the DR credential it installs is the one just
    # proven. Using a different login would let the play succeed while
    # installing an account that cannot actually authenticate.
    synology_ssh_user: "{{ srsc_ssh_user | default(srsc_account) }}"
    synology_ssh_command: >-
      sshpass -e ssh -q
      -p {{ synology_ssh_port | quote }}
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      {{ synology_ssh_user | quote }}@{{ synology_ssh_host | quote }}
    synology_sshpass_environment:
      SSHPASS: "{{ ansible_password }}"

    srsc_bin: /var/packages/SnapshotReplication/target/sbin/synodr

  tasks:
    - name: Require a partner host for this NAS
      ansible.builtin.assert:
        that:
          - synology_replication_partner_host is defined
          - synology_replication_partner_host | length > 0
        fail_msg: >-
          synology_replication_partner_host is not set for {{ inventory_hostname }}.
          It is defined per-host in inventory/environments/production.ini under
          [synology_snapshot_replication_nas].

    # Discover rather than hardcode. Plan IDs are DSM-generated and a hardcoded
    # list silently goes stale when a plan is recreated - which is exactly the
    # kind of drift that produced the outage this play fixes. Selecting on live
    # status also makes the play idempotent: a plan already `ready` is skipped,
    # so re-running is a no-op.
    - name: Discover plans that are not ready
      ansible.builtin.shell:
        cmd: >-
          {{ synology_ssh_command }}
          {{ ("sudo -S -p '' " ~ srsc_bin ~ " plan list") | quote }}
          <<< "$SSHPASS"
      args:
        executable: /bin/bash
      environment: "{{ synology_sshpass_environment }}"
      delegate_to: localhost
      changed_when: false
      # Read-only, so it must run under --check too; otherwise the report below
      # has nothing to report and a dry run says "no work" regardless of state.
      check_mode: false
      register: srsc_plan_list

    - name: Parse the plan list
      ansible.builtin.set_fact:
        srsc_broken: >-
          {{ srsc_plan_list.stdout
             | regex_findall('planId: \[([^\]]+)\][\s\S]*?target: \[([^\]]+)\][\s\S]*?status: \[([^\]]+)\]')
             | rejectattr('2', 'equalto', 'ready')
             | list }}
      delegate_to: localhost

    - name: Repoint plan
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ srsc_broken | length }} plan(s) not ready ->
          {{ srsc_broken | map(attribute=1) | join(', ') | default('none', true) }}.
          {{ 'REPORT ONLY - nothing will change. Re-run with -e srsc_confirm=true.'
             if not (srsc_confirm | bool) else 'CONFIRMED - repointing to ' ~ srsc_account ~ '.' }}

    - name: Stop here unless explicitly confirmed
      ansible.builtin.meta: end_host
      when: not (srsc_confirm | bool)

    # test_conn before edit_conn, per plan. It validates the credential against
    # the partner without writing anything, so a bad account fails the play
    # before any plan is modified rather than halfway through the list.
    #
    # The password reaches synodr on stdin, never in argv: `synodr plan edit_conn`
    # takes the password as a positional argument, which would otherwise be
    # readable from /proc by any local user for the life of the process.
    - name: Validate the local account against the partner
      ansible.builtin.shell:
        cmd: >-
          {{ synology_ssh_command }}
          {{ ("sudo -S -p '' sh -c 'read -r PW; " ~ srsc_bin ~ " plan test_conn "
              ~ srsc_account ~ " " ~ synology_replication_partner_host ~ " "
              ~ srsc_partner_port ~ " " ~ srsc_partner_protocol ~ " "
              ~ srsc_account ~ ' "$PW" "" ' ~ srsc_target_type ~ " "
              ~ srsc_replica_port ~ "'") | quote }}
          <<< "$SSHPASS
          $SSHPASS"
      args:
        executable: /bin/bash
      environment: "{{ synology_sshpass_environment }}"
      delegate_to: localhost
      changed_when: false
      register: srsc_test
      failed_when: '''"success" : true'' not in srsc_test.stdout and ''"success":true'' not in srsc_test.stdout'
      no_log: true

    - name: Repoint each broken plan at the local account
      ansible.builtin.shell:
        cmd: >-
          {{ synology_ssh_command }}
          {{ ("sudo -S -p '' sh -c 'read -r PW; " ~ srsc_bin ~ " plan edit_conn "
              ~ item.0 ~ " " ~ srsc_account ~ " " ~ synology_replication_partner_host ~ " "
              ~ srsc_partner_port ~ " " ~ srsc_partner_protocol ~ " "
              ~ srsc_account ~ ' "$PW" "" ' ~ srsc_target_type ~ " "
              ~ srsc_replica_port ~ "'") | quote }}
          <<< "$SSHPASS
          $SSHPASS"
      args:
        executable: /bin/bash
      environment: "{{ synology_sshpass_environment }}"
      delegate_to: localhost
      loop: "{{ srsc_broken }}"
      loop_control:
        label: "{{ item.1 }}"
      register: srsc_edit
      failed_when: '''"success" : true'' not in srsc_edit.stdout and ''"success":true'' not in srsc_edit.stdout'
      changed_when: true
      no_log: true

    - name: Re-read plan status to confirm the repoint took
      ansible.builtin.shell:
        cmd: >-
          {{ synology_ssh_command }}
          {{ ("sudo -S -p '' " ~ srsc_bin ~ " plan list") | quote }}
          <<< "$SSHPASS"
      args:
        executable: /bin/bash
      environment: "{{ synology_sshpass_environment }}"
      delegate_to: localhost
      changed_when: false
      register: srsc_verify

    - name: Require every repointed plan to now be ready
      ansible.builtin.assert:
        that:
          - >-
            srsc_verify.stdout
            | regex_findall('planId: \[([^\]]+)\][\s\S]*?status: \[([^\]]+)\]')
            | rejectattr('1', 'equalto', 'ready') | list | length == 0
        fail_msg: >-
          One or more plans on {{ inventory_hostname }} are still not ready after
          the repoint. Check `{{ srsc_bin }} plan list` on the host. Nothing was
          deleted, so the plans and their replication history are intact - this
          is a failed edit, not a lost baseline.
        success_msg: >-
          All plans on {{ inventory_hostname }} report ready.
      delegate_to: localhost
