---
# Automate rotation of the Backblaze B2 application key behind the pbs-b2
# datastore. Sibling of pbs_s3_key_rotation.yml; read
# roles/pbs_b2_key_rotation/defaults/main.yml for what differs and why.
#
# WHAT THIS PROVISIONS
#   Vault  sys/policies/acl/backblaze-key-rotation  (from ansible/vault/policies/)
#          auth/approle/role/backblaze-key-rotation token lifetimes
#   PBS    /usr/local/sbin/pbs-rotate-b2-key.py, plus a daily timer
#
# Run:
#   export VAULT_ADDR=https://vault.myrobertson.net:8200 VAULT_TOKEN=...
#   ansible-playbook -i inventory/environments/production.ini \
#     ansible/proxmox/pbs_b2_key_rotation.yml

- name: Provision Vault for the PBS B2 key rotation
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pbs, pbs_b2_key_rotation]
  vars:
    boot_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
    boot_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    approle: backblaze-key-rotation
    policy_name: backblaze-key-rotation
    policy_file: "{{ playbook_dir }}/../vault/policies/backblaze-key-rotation.hcl"
  tasks:
    - name: Require Vault environment
      ansible.builtin.assert:
        that:
          - boot_addr | length > 0
          - boot_token | length > 0
        fail_msg: Export VAULT_ADDR and VAULT_TOKEN before running.

    - name: Write the rotation Vault policy
      community.hashi_vault.vault_write:
        url: "{{ boot_addr }}"
        token: "{{ boot_token }}"
        path: "sys/policies/acl/{{ policy_name }}"
        data:
          policy: "{{ lookup('ansible.builtin.file', policy_file) }}"

    - name: Ensure the rotation AppRole uses only that policy, short-lived
      community.hashi_vault.vault_write:
        url: "{{ boot_addr }}"
        token: "{{ boot_token }}"
        path: "auth/approle/role/{{ approle }}"
        data:
          token_policies: "{{ policy_name }}"
          token_ttl: 900
          token_max_ttl: 1800
          secret_id_num_uses: 0
          secret_id_ttl: 0

    - name: Read the rotation AppRole role_id
      community.hashi_vault.vault_read:
        url: "{{ boot_addr }}"
        token: "{{ boot_token }}"
        path: "auth/approle/role/{{ approle }}/role-id"
      register: pbs_b2_rot_role_id
      no_log: true

- name: Install the PBS B2 key rotation
  hosts: pbs_servers
  become: true
  gather_facts: true
  tags: [pbs, pbs_b2_key_rotation]
  vars:
    pbs_b2_key_rotation_role_id: >-
      {{ hostvars['localhost'].pbs_b2_rot_role_id.data.data.role_id }}
    pbs_b2_key_rotation_bootstrap_vault_token: >-
      {{ lookup('env', 'VAULT_TOKEN') }}
  roles:
    - role: pbs_b2_key_rotation
