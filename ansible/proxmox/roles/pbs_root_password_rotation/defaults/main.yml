---
# Rotates the PBS host's root (root@pam) password and records it in Vault.
#
# DISABLED BY DEFAULT. Vault is NOT the only consumer: the Proxmox VE storages
# pbs-s3, pbs-b2 and pbs-b2-encrypted (cluster-wide /etc/pve/storage.cfg) log
# in to PBS as root@pam with this password (/etc/pve/priv/storage/<id>.pw).
# The first rotation (2026-11-19 01:41Z) broke all three with 401 Unauthorized
# until the .pw files were rewritten by hand ~3h later. Before enabling the
# timer, move those storages to a PBS API token so root@pam's password has no
# copies outside Vault.
pbs_root_password_rotation_timer_enabled: false
pbs_root_password_rotation_vault_addr: "https://vault.myrobertson.net:8200"
pbs_root_password_rotation_vault_ca_file: /etc/vault-agent.d/vault-ca.pem
pbs_root_password_rotation_kv_mount: secret
pbs_root_password_rotation_kv_path: proxmox/pbs/prod/install
pbs_root_password_rotation_kv_key: root_password
pbs_root_password_rotation_policy_name: pbs-root-password-rotation
pbs_root_password_rotation_approle_name: pbs-root-password-rotation
pbs_root_password_rotation_interval_days: 90
pbs_root_password_rotation_rotate_after_days: 75
pbs_root_password_rotation_on_calendar: "*-*-* 04:45:00"
pbs_root_password_rotation_randomized_delay: "20m"
pbs_root_password_rotation_script: /usr/local/sbin/pbs-rotate-root-password.py
pbs_root_password_rotation_state_dir: /var/lib/pbs-root-password-rotation
pbs_root_password_rotation_unit_name: pbs-rotate-root-password
pbs_root_password_rotation_role_id_file: /etc/vault-agent.d/pbs-root-rotation-role-id
pbs_root_password_rotation_secret_id_file: /etc/vault-agent.d/pbs-root-rotation-secret-id
