---
# /etc/pve is the clustered config filesystem, so this check sees containers
# owned by any node in the cluster, not just the one we are connected to.
- name: Look for an existing container with the target VMID
  ansible.builtin.stat:
    path: "/etc/pve/lxc/{{ proxmox_mcp_lxc_vmid }}.conf"
  register: proxmox_mcp_lxc_conf

- name: Read the injected SSH public key
  ansible.builtin.set_fact:
    proxmox_mcp_lxc_ssh_public_key: "{{ lookup('ansible.builtin.file', proxmox_mcp_lxc_ssh_public_key_file) }}"
  delegate_to: localhost
  become: false
  when: not proxmox_mcp_lxc_conf.stat.exists

- name: Check whether the guest template is already downloaded
  ansible.builtin.stat:
    path: "/var/lib/vz/template/cache/{{ proxmox_mcp_lxc_template }}"
  register: proxmox_mcp_lxc_template_file
  when: not proxmox_mcp_lxc_conf.stat.exists

- name: Refresh the appliance template index
  ansible.builtin.command:
    argv:
      - pveam
      - update
  when:
    - not proxmox_mcp_lxc_conf.stat.exists
    - not proxmox_mcp_lxc_template_file.stat.exists
  changed_when: true

- name: Download the guest template
  ansible.builtin.command:
    argv:
      - pveam
      - download
      - "{{ proxmox_mcp_lxc_template_storage }}"
      - "{{ proxmox_mcp_lxc_template }}"
  when:
    - not proxmox_mcp_lxc_conf.stat.exists
    - not proxmox_mcp_lxc_template_file.stat.exists
  changed_when: true

- name: Stage the SSH public key for injection
  ansible.builtin.copy:
    content: "{{ proxmox_mcp_lxc_ssh_public_key }}\n"
    dest: "/tmp/proxmox-mcp-{{ proxmox_mcp_lxc_vmid }}.pub"
    owner: root
    group: root
    mode: "0600"
  when: not proxmox_mcp_lxc_conf.stat.exists

- name: Create the MCP container
  ansible.builtin.command:
    argv:
      - pct
      - create
      - "{{ proxmox_mcp_lxc_vmid }}"
      - "{{ proxmox_mcp_lxc_template_storage }}:vztmpl/{{ proxmox_mcp_lxc_template }}"
      - --hostname
      - "{{ proxmox_mcp_lxc_hostname }}"
      - --description
      - "{{ proxmox_mcp_lxc_description }}"
      - --cores
      - "{{ proxmox_mcp_lxc_cores }}"
      - --memory
      - "{{ proxmox_mcp_lxc_memory_mb }}"
      - --swap
      - "{{ proxmox_mcp_lxc_swap_mb }}"
      - --rootfs
      - "{{ proxmox_mcp_lxc_storage }}:{{ proxmox_mcp_lxc_rootfs_gb }}"
      - --net0
      - "{{ proxmox_mcp_lxc_net0 }}"
      - --nameserver
      - "{{ proxmox_mcp_lxc_nameserver }}"
      - --searchdomain
      - "{{ proxmox_mcp_lxc_searchdomain }}"
      - --onboot
      - "{{ 1 if proxmox_mcp_lxc_onboot | bool else 0 }}"
      - --unprivileged
      - "{{ 1 if proxmox_mcp_lxc_unprivileged | bool else 0 }}"
      - --ssh-public-keys
      - "/tmp/proxmox-mcp-{{ proxmox_mcp_lxc_vmid }}.pub"
  vars:
    proxmox_mcp_lxc_net0: >-
      name=eth0,bridge={{ proxmox_mcp_lxc_bridge }},ip={{ proxmox_mcp_lxc_ipv4_cidr }},gw={{ proxmox_mcp_lxc_gateway }}{{
        ',tag=' ~ proxmox_mcp_lxc_vlan_tag if proxmox_mcp_lxc_vlan_tag | length > 0 else ''
      }}
  when: not proxmox_mcp_lxc_conf.stat.exists
  changed_when: true

- name: Remove the staged SSH public key
  ansible.builtin.file:
    path: "/tmp/proxmox-mcp-{{ proxmox_mcp_lxc_vmid }}.pub"
    state: absent
  when: not proxmox_mcp_lxc_conf.stat.exists

- name: Read the current container status
  ansible.builtin.command:
    argv:
      - pct
      - status
      - "{{ proxmox_mcp_lxc_vmid }}"
  register: proxmox_mcp_lxc_status
  changed_when: false
  check_mode: false

- name: Start the container
  ansible.builtin.command:
    argv:
      - pct
      - start
      - "{{ proxmox_mcp_lxc_vmid }}"
  when:
    - proxmox_mcp_lxc_start | bool
    - "'status: running' not in proxmox_mcp_lxc_status.stdout"
  changed_when: true

- name: Wait for the container SSH endpoint to accept connections
  ansible.builtin.wait_for:
    host: "{{ proxmox_mcp_lxc_ipv4_cidr | split('/') | first }}"
    port: 22
    timeout: 180
  when: proxmox_mcp_lxc_start | bool
