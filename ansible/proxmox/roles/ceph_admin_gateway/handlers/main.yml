---
# The Vault Agent's daemon-reload and restart handlers now come from
# roles/vault_cert_agent (invoked from tasks/main.yml). The gateway keeps only
# the HAProxy / keepalived / nftables handlers below.
- name: Reload haproxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: reloaded

- name: Restart keepalived
  throttle: 1
  ansible.builtin.systemd_service:
    name: keepalived
    state: restarted

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
