---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart ceph admin vault agent
  ansible.builtin.systemd_service:
    name: "{{ ceph_admin_gateway_agent_name }}"
    state: restarted

- name: Reload haproxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: reloaded

- name: Restart keepalived
  throttle: 1
  ansible.builtin.systemd_service:
    name: keepalived
    state: restarted

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
