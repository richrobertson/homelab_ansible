---
# roles/vault_cert_agent
#
# The single, canonical internal-Linux implementation of the certificate
# management standard (runbooks/security/certificate-management-standard.md):
# a Vault Agent that keeps ONE service's TLS certificate auto-rotated from
# Vault PKI and reloads the service when the material changes.
#
# Instantiate it per service by setting the REQUIRED vars below (see
# ansible/proxmox/pbs_provision_certificate.yml for a worked example). The
# existing bespoke copies of this pattern — provision_certificates.yml
# (pveproxy) and roles/ceph_admin_gateway — are slated to converge onto this
# role; do that behind a per-host canary since they renew live production certs.

# --- REQUIRED per service ----------------------------------------------------
vault_cert_agent_service_name: ""        # short id, e.g. "pbs" (names units/dirs/scripts)
vault_cert_agent_common_name: ""         # cert CN, must be a valid RFC1123 hostname
vault_cert_agent_cert_file: ""           # where the leaf+chain PEM is installed
vault_cert_agent_key_file: ""            # where the private key is installed;
                                         # set equal to cert_file for a single
                                         # combined PEM (e.g. HAProxy)
vault_cert_agent_reload_command: ""      # run only on cert change, e.g.
                                         # "systemctl reload proxmox-backup-proxy"
vault_cert_agent_role_id: ""             # AppRole role_id  (pass from Vault KV)
vault_cert_agent_secret_id: ""           # AppRole secret_id (pass from Vault KV)

# --- Optional ----------------------------------------------------------------
vault_cert_agent_alt_names: ["{{ vault_cert_agent_common_name }}"]  # DNS SANs
vault_cert_agent_ip_sans: []             # e.g. ["192.168.1.217"]
vault_cert_agent_owner: root
vault_cert_agent_group: root
vault_cert_agent_mode: "0640"
vault_cert_agent_verify_host: ""         # optional post-issue check host, e.g. 127.0.0.1
vault_cert_agent_verify_port: ""         # e.g. "8007"
vault_cert_agent_expected_issuer_pattern: Vault
vault_cert_agent_install_vault_cli: true

# --- Vault PKI + AppRole (shared estate defaults) ----------------------------
vault_cert_agent_vault_addr: https://vault.myrobertson.net:8200
vault_cert_agent_pki_mount: pki_int
vault_cert_agent_pki_role: proxmox-api
vault_cert_agent_cert_ttl: 720h

# --- On-host layout (kept identical to provision_certificates.yml) -----------
vault_cert_agent_dir: /etc/vault-agent.d
vault_cert_agent_role_id_file: /etc/vault-agent.d/proxmox-role-id
vault_cert_agent_secret_id_file: /etc/vault-agent.d/proxmox-secret-id
vault_cert_agent_vault_ca_file: /etc/vault-agent.d/vault-ca.pem
vault_cert_agent_runtime_dir: "/var/lib/vault-agent/{{ vault_cert_agent_service_name }}"
vault_cert_agent_bundle_file: "/var/lib/vault-agent/{{ vault_cert_agent_service_name }}/issue-bundle.pem"
vault_cert_agent_config_file: "/etc/vault-agent.d/{{ vault_cert_agent_service_name }}.hcl"
vault_cert_agent_apply_script: "/usr/local/sbin/apply-{{ vault_cert_agent_service_name }}-cert.sh"
vault_cert_agent_unit_name: "vault-agent-{{ vault_cert_agent_service_name }}"
