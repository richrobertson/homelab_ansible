---
# Provision the internal AD DNS resolvers on the Proxmox-family hosts (Proxmox VE
# nodes + Proxmox Backup Server) so they resolve the internal myrobertson.net
# zone (e.g. vault.myrobertson.net).
#
# Why this exists: PBS was rebuilt and came back pointing at the UniFi gateway
# (192.168.1.1) as its resolver, which serves LAN/DHCP names but NOT the internal
# PowerDNS/AD zone. It therefore could not resolve vault.myrobertson.net, and its
# Vault-Agent certificate renewal (pbs_provision_certificate.yml) failed. The pve
# nodes already use the AD DNS servers (dns01/rhonda); this codifies that
# same config for the whole family so the fix is reproducible, not a one-off.
#
# The nameserver list is written in inventory order, and resolv.conf is tried in
# that order, so a dead entry costs every lookup a full resolver timeout before
# it falls back. These are literals rather than inventory lookups because the AD
# hosts are grouped by Windows role, not by "is a resolver" — so when dns01 moved
# 192.168.1.244 -> .101 the inventory was updated (see dhcp_partner_windows in
# inventory/environments/production.ini) and this list was not, leaving pbs and
# pve4 stalling ~3s on every DNS lookup. Cross-check both when a DC is renumbered.
#
# resolv.conf on these hosts is a plain static file (no systemd-resolved, no DHCP
# management), so a templated file is the correct, durable mechanism. The play
# asserts that before writing, and verifies internal resolution afterwards.
#
# Run:  ansible-playbook ansible/proxmox/provision_dns_resolvers.yml \
#         -i inventory/environments/production.ini
- name: Provision internal DNS resolvers for Proxmox VE + PBS
  hosts: proxmox_cert_nodes:pbs_servers
  become: true
  gather_facts: false
  serial: 1
  tags:
    - dns
    - resolvers
  vars:
    proxmox_dns_search: myrobertson.net
    proxmox_dns_nameservers:
      - 192.168.1.101
      - 192.168.1.245
    proxmox_dns_probe_name: vault.myrobertson.net
  tasks:
    - name: Stat /etc/resolv.conf
      ansible.builtin.stat:
        path: /etc/resolv.conf
      register: proxmox_resolv_stat

    - name: Require a static resolv.conf (not systemd-resolved / DHCP symlink)
      ansible.builtin.assert:
        that:
          - proxmox_resolv_stat.stat.exists
          - not (proxmox_resolv_stat.stat.islnk | default(false))
        fail_msg: >-
          /etc/resolv.conf on {{ inventory_hostname }} is missing or a symlink
          (likely systemd-resolved). This play manages a static resolv.conf;
          adapt it (resolved.conf / per-link DNS) before running here.

    - name: Install the internal-resolver resolv.conf
      ansible.builtin.template:
        src: resolv.conf.j2
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
        backup: true

    - name: Verify the internal zone resolves
      ansible.builtin.command:
        cmd: getent hosts {{ proxmox_dns_probe_name }}
      changed_when: false
      register: proxmox_dns_probe
      failed_when: proxmox_dns_probe.rc != 0

    # getent above only proves *some* resolver in the list answered; it succeeds
    # via fallback even when the first one is dead, which is precisely how the
    # stale .244 stayed invisible here for as long as it did. Probe each entry
    # individually so a dead resolver fails the play instead of silently
    # costing every lookup a timeout.
    #
    # wait_for rather than dig, to avoid depending on dnsutils being installed
    # on every host in the group, and rather than a bash /dev/tcp redirect,
    # which has no timeout: a blackholed resolver (SYNs dropped rather than
    # refused) would hang the play for the kernel's full SYN retry window per
    # nameserver instead of failing fast.
    - name: Check every configured resolver answers on port 53
      ansible.builtin.wait_for:
        host: "{{ item }}"
        port: 53
        connect_timeout: 2
        timeout: 3
        state: started
      changed_when: false
      failed_when: false
      # Read-only probe, so run it under --check too; otherwise the assert below
      # sees an empty result set and "passes" without having tested anything.
      check_mode: false
      register: proxmox_dns_reachable
      loop: "{{ proxmox_dns_nameservers }}"

    - name: Require every configured resolver to be reachable
      ansible.builtin.assert:
        that:
          - proxmox_dns_reachable.results | selectattr('failed') | list | length == 0
        fail_msg: >-
          Unreachable resolver(s) on {{ inventory_hostname }}:
          {{ proxmox_dns_reachable.results | selectattr('failed')
             | map(attribute='item') | join(', ') }}.
          Every entry in proxmox_dns_nameservers must be live — a dead one adds a
          full resolver timeout to each lookup that falls through to it.
        success_msg: >-
          All {{ proxmox_dns_nameservers | length }} configured resolvers answered.
