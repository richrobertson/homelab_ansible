---
# Shared by both plays in ansible/proxmox/credential_age_metrics.yml.

# Matches ansible/proxmox/ceph_fragmentation_metrics.yml and
# proxmox_transport_metrics.yml so all three collectors land in the directory
# node_exporter is already reading.
credential_age_metrics_textfile_dir: /var/lib/prometheus/node-exporter
credential_age_node_exporter_args: "--collector.textfile.directory={{ credential_age_metrics_textfile_dir }}"

credential_age_ad_script: /usr/local/sbin/credential-age-ad-metrics.sh
credential_age_vault_script: /usr/local/sbin/credential-age-vault-metrics.sh
credential_age_ad_lock_file: /run/lock/credential-age-ad-metrics.lock
credential_age_vault_lock_file: /run/lock/credential-age-vault-metrics.lock

# Password/policy posture moves slowly, but a shorter interval means a change
# (or a remediation) shows up in metrics within minutes instead of up to an
# hour. For an immediate refresh right after a deliberate change, trigger the
# relevant collector by hand — both are on this interval, so pick the one whose
# metrics you are waiting on:
#   systemctl start credential-age-ad-metrics.service
#   systemctl start credential-age-vault-metrics.service
credential_age_ad_interval: 15min
credential_age_vault_interval: 15min

# --- Active Directory --------------------------------------------------------
# Both writable DCs are listed so a single DC reboot does not blind the
# collector; OpenLDAP tries them in order.
credential_age_ad_ldap_uri: "ldaps://dc1.myrobertson.net:636 ldaps://rhonda.myrobertson.net:636"
credential_age_ad_base_dn: DC=myrobertson,DC=net
credential_age_ad_tls_verify: true
credential_age_ad_ca_file: /etc/vault-agent.d/ad-root-ca.pem
credential_age_ad_ca_secret_path: windows/domain/root_ca_cert
credential_age_ad_ca_cert_field: cert_pem

# adminCount only marks accounts AdminSDHolder has touched, which misses netsvc
# — privileged solely through DnsAdmins, a documented path to SYSTEM on a DC.
# Direct membership of any of these groups counts as privileged too.
credential_age_ad_privileged_groups:
  - Domain Admins
  - Enterprise Admins
  - Schema Admins
  - Administrators
  - Account Operators
  - Backup Operators
  - Server Operators
  - DnsAdmins

# The directory bind. This is currently the `ldap` Domain Admin, which is the
# account Workstream 4 exists to split up: point this at a dedicated read-only
# bind account as soon as one exists. The collector needs directory read and
# nothing else.
credential_age_ad_bind_secret_path: windows/domain/ldap

# --- Vault -------------------------------------------------------------------
# The address the collectors use from the Proxmox nodes, as distinct from the
# VAULT_ADDR the control node uses to bootstrap the AppRole below.
credential_age_vault_addr: https://vault.myrobertson.net:8200
credential_age_vault_ca_file: /etc/vault-agent.d/vault-ca.pem
credential_age_vault_mount: secret

# Applied to secrets that declare rotated_at but no rotation_interval_days, so
# that a date without an interval still produces an alertable deadline.
credential_age_vault_default_rotation_interval_days: 90

# Paths whose rotation date is a data field rather than custom_metadata, and
# which the collector therefore has to read the secret to see. Each entry widens
# the collector's Vault policy by one secret, so this list should shrink to
# empty as Workstream 2 task 1 moves the convention to custom_metadata.
credential_age_vault_data_field_paths:
  - proxmox/cl0/terraform

# --- Vault bootstrap ---------------------------------------------------------
credential_age_policy_name: credential-age-collector
credential_age_approle_name: credential-age-collector
credential_age_role_id_file: /etc/vault-agent.d/credential-age-role-id
credential_age_secret_id_file: /etc/vault-agent.d/credential-age-secret-id

# Each run authenticates, reads, and revokes, so nothing holds a token between
# runs and the TTL only has to cover a single sweep.
credential_age_token_ttl_seconds: 300
credential_age_token_max_ttl_seconds: 900

credential_age_bootstrap_vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
credential_age_bootstrap_vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
