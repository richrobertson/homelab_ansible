---
# Rotation triage for the Vault secrets that VaultSecretsPastRotationInterval
# fires on. This is Workstream 3 task 4 of
# runbooks/security/credential-lifecycle-roadmap.md - "map dependencies before
# automating" - which that roadmap names as the reason two of three earlier
# rotations were abandoned.
#
# Measured 2026-08-03: 92 of 139 secrets past their rotation interval.
#   180-365 days: 20      90-180 days: 72
#
# THE POINT OF THIS FILE
#
# "92 overdue secrets" invites a bulk rotation. A bulk rotation would destroy
# data. 29 of the 92 are restic repository passwords and 6 are Ceph auth
# keyrings; for both, writing a new value into Vault does not rotate anything -
# it breaks the consumer and, for restic, can strand the backups permanently.
#
# So the unit of work is not "rotate 92 secrets". It is "assign every secret a
# class, then automate the classes that can be automated". A secret with no
# class is not rotatable yet, and that is a finding rather than an oversight.
#
# Counts below sum to 92. Ordered by blast radius, worst first.

src_classes:
  restic_key:
    count: 29
    summary: >-
      VolSync restic repository passwords. Each secret holds RESTIC_PASSWORD,
      RESTIC_REPOSITORY and the S3 credentials for one backup repository.
    danger: >-
      DO NOT ROTATE BY WRITING VAULT. A restic repository is encrypted with a
      master key held in key slots; RESTIC_PASSWORD unlocks a slot, it is not
      the encryption key. Changing the Vault value does not re-key anything: the
      next VolSync run fails to open the repository, and if the old password has
      been discarded every existing snapshot in that repository is
      unrecoverable. This is 29 of the 92, so it is the single largest reason
      not to treat this alert as a bulk action.
    safe_procedure: >-
      restic key add (with the new password, authenticating with the old), then
      verify the new slot opens the repo, then restic key remove the old slot,
      and only then write Vault. The rotation is a repository operation that
      Vault records afterwards - never the reverse.
    automatable: false
    prerequisite: >-
      A playbook that drives restic key add/remove against each repository and
      writes Vault only after the new key is proven. Does not exist yet.

  ceph_auth:
    count: 6
    summary: >-
      Rook/Ceph CSI keyrings - rook-ceph-mon, the rbd and cephfs
      provisioner/node keys, and csi-cephfs-secret.
    danger: >-
      These mirror `ceph auth` entities in the external cluster. Writing a new
      value into Vault does not change the Ceph-side key, so the CSI drivers
      simply start failing to authenticate and volume attach/detach stops
      cluster-wide. Rotating the Ceph side without updating the consumers has
      the same effect in reverse.
    safe_procedure: >-
      ceph auth rotate on the external cluster, write Vault, force the VSO sync,
      then verify the K8s Secret matches. Do NOT write Vault first.

      The old instruction here also said "restart the CSI provisioner/node
      pods". That is not required and was never tested: the CSI sidecars read
      the credential from the API server per operation via the StorageClass
      secret refs, not from env at pod start. Measured 2026-08-22 - rotation
      took effect with no restart, and a fresh PVC provisioned and mounted
      immediately. Existing mounts are unaffected because they authenticated at
      mount time.
    automatable: true
    prerequisite: >-
      A client.admin key for the external cluster. Note this is Proxmox's own
      admin key - see the findings below before assuming it can be rotated.
    ceph_findings: >-
      Rotated 2026-08-22: csi-rbd-provisioner, csi-cephfs-provisioner,
      csi-rbd-node, csi-cephfs-node. All four went 326d -> 0d, all four
      authenticate, cluster stayed HEALTH_OK. Verified functionally, not just by
      key comparison: a throwaway PVC on ceph-block provisioned, attached,
      mounted and wrote a file after rotation.

      THE TOOLBOX OVERRIDES YOUR IDENTITY. The rook-ceph-tools pod sets
      CEPH_ARGS=--id healthchecker, which silently wins over --id/--name passed
      on the command line and produces "RADOS permission error (error connecting
      to the cluster)" no matter what keyring you supply. Every admin command
      run in that pod must "unset CEPH_ARGS" first. This looks exactly like a
      bad key and is not.

      csi-cephfs-secret WAS DELIBERATELY NOT ROTATED, and it is the interesting
      one. Its userID is "admin" - it holds client.admin, caps "allow *" on mon,
      osd, mds and mgr. That is not a CSI credential, it is the whole cluster,
      and because this Ceph lives on the Proxmox hosts (mds.pve*, mgr.pve*,
      osd.*) it is also the key in /etc/pve/priv/ceph.client.admin.keyring.
      Rotating it from Kubernetes would break Proxmox's own Ceph management,
      which is well outside the blast radius this class describes. It is also
      load-bearing: the csi-cephfs-sc StorageClass backs 46 PVCs including
      Nextcloud, Immich, Plex and every Mailu backup cache.

      The fix for that path is de-privileging, not rotation: create a scoped
      cephfs user with caps matching client.csi-cephfs-provisioner, point the
      ceph-csi stack at it, and only then retire admin from the secret. Rotating
      admin in place would leave the exposure intact and add an outage risk.

      Unrelated landmine found while verifying: the ceph-filesystem and
      ceph-filesystem-fuse StorageClasses specify fsName "rook_prod" and pool
      "rook_prod_data". Neither exists - the only filesystem is
      kubernetes-prod-cephfs, and while a POOL named rook_prod exists there is
      no such filesystem. Provisioning against them fails with "volume not
      found", which is why both have zero PVCs. They have presumably never
      worked. Fix or delete them; as written they are a trap for anyone who
      picks a cephfs StorageClass by name.

      Also present and unexplained: a client.csi-rbd-provisioner-test auth
      entity with no corresponding Vault path or consumer.

  external_provider:
    count: 6
    summary: >-
      Credentials minted by a third party, where the provider is the source of
      truth: aws/user/homelab, aws/user/homelab_terraform, cloudflare,
      cloudflare/external-dns, cloudflare/letsencrypt, github. Both docker paths
      were removed 2026-08-22; see cloudflare_and_docker_findings.
    danger: >-
      Vault holds a copy, not the original. Rotation must happen at the provider
      first; a Vault-only change just makes Vault wrong.
    safe_procedure: >-
      Create the new credential at the provider, write Vault, propagate to
      consumers, verify, then delete the old credential at the provider. The
      overlap window is what makes this safe - both are valid until the last
      step. AWS access keys and Cloudflare tokens both support two live
      credentials; use that.
    automatable: true
    prerequisite: >-
      Provider API credentials with permission to mint and revoke. aws/user/homelab
      at 314 days is the oldest secret in the estate.
    cloudflare_and_docker_findings: >-
      Measured 2026-08-22, and the alert was largely measuring rubbish.

      CLOUDFLARE (3 paths, 296d) CANNOT be rotated unattended from here. All
      three tokens verified as active, but none could mint a replacement: the
      scoped tokens lack User API Tokens:Edit and return "Unauthorized to access
      requested resource" on /user/tokens, and the Global API Key that could do
      it is an EMPTY field - cloudflare/external-dns held apiKey with length 0,
      so it looked present in a field listing while holding nothing. Minting a
      Cloudflare token is a dashboard action. Everything after that is
      mechanical.

      cloudflare/external-dns has since been reduced to apiToken alone, which is
      the only field external-dns reads (CF_API_TOKEN).

      ROTATED 2026-08-22, by hand at the dashboard. One shared token had been
      serving both Terraform and cert-manager; it is now three separate tokens,
      and Terraform's is scoped to myrobertson.net alone - the only zone it
      manages (cloudflare_dns_record.mail, zone 7f085e83...), so a read against
      myrobertson.com now correctly fails. Old tokens cf6a031a... and
      043343e6... were deleted after the replacements were proven.

      Two things worth carrying forward from that rotation:

      Do not infer a credential's shape from the old ones you happen to hold. A
      40-character length check, derived from the three legacy tokens in Vault,
      rejected a valid freshly-minted token: Cloudflare now issues "cfut_"
      -prefixed 53-character tokens. The provider's own verify endpoint is the
      only authority on whether a credential is good.

      A no-op write resets the age clock. secret/cloudflare/external-dns was
      rewritten with an UNCHANGED value on 2026-08-22 and its version bumped to
      4, which made a 296-day-old token read as fresh to the age exporter. Age
      is measured from the Vault write, not from the credential's real birth, so
      the metric can be laundered without anything malicious happening.

      DOCKER (2 paths, 311d) had nothing to rotate. docker/creds held ONE
      character, and a VaultStaticSecret was syncing that placeholder into
      external-dns/imagepullsecrets while reporting Synced/Healthy/Ready - the
      resulting Secret was typed kubernetes.io/dockerconfigjson but had "docker.io"
      as its top-level key with no "auths" wrapper. Kubernetes never validates
      that, so an unusable credential carried a green light at every layer. The
      consumer was commented out in release.yaml and no pod referenced it.
      Removed 2026-08-22.

      docker/imagepullsecrets held a REAL docker.io PAT for richrobertson with no
      consumer at all. It was deliberately left in place at first: deleting the
      Vault record while the PAT stayed live at Docker Hub would have converted a
      tracked unused credential into an untracked live one, which is worse.

      CLOSED 2026-08-22 in the provider-first order the PBS rotation uses. The
      PAT was revoked at Docker Hub, the stored value was confirmed to return 401
      from both hub login and registry auth, and only then was the Vault path
      deleted with kv metadata delete. secret/docker is now empty.

      Identifying WHICH Docker Hub token to revoke is the awkward part and worth
      recording. Docker Hub lists tokens by label and uuid, never by value, so
      the stored secret cannot be matched against the list directly, and the API
      refuses token management when the JWT came from a PAT ("token issued from
      personal access token is not allowed") - listing or deleting needs
      password auth. The trick that worked: authenticate to the REGISTRY with the
      stored PAT, which stamps that token's "last used" to now, then reload the
      dashboard and take the row that just changed. Note that hub login alone
      does NOT update last used; only the registry auth does. The match was
      corroborated by creation time - the token was created seven minutes before
      the Vault path was first written.

      The PAT was labelled "fluxcd" but nothing used it. The two ImageRepository
      resources that do scan docker.io (plex, vaultwarden) have secretRef unset
      and pull anonymously, which is worth revisiting: authenticated scans get a
      much higher Docker Hub rate limit. If that is wanted, mint a fresh
      read-only token and wire it up deliberately rather than reviving this one.
    progress: >-
      2026-08-21: the first fully automated member of this class is the PBS S3
      key (ansible/proxmox/pbs_s3_key_rotation.yml). It is the reference
      implementation for the rest - the pattern is that the provider credential
      used to rotate is itself dynamic (Vault's AWS secrets engine), so
      automating rotation does not create a new static credential that nothing
      rotates. Note that PBS is the easy case: nothing reads its key from Vault,
      so there is no consumer to restart. The Cloudflare and Docker members of
      this class have Kubernetes consumers and need the VSO propagation step
      before their rotation can be called atomic.

  appliance:
    count: 13
    summary: >-
      Logins that live on a device or appliance rather than in a config file:
      unifi/ssh, synology/* (3), proxmox/pbs/prod/* (4), proxmox/cl0/sso/authelia,
      proxmox (root), powerdns, substrate/db1, substrate/subdns.
    danger: >-
      The device is the source of truth and usually has no API for the change.
      Rotating Vault alone leaves Vault describing a password the device does not
      accept - the exact failure mode that made svc-syno-ssh's rotation an
      outage window earlier in this estate's history.
    safe_procedure: >-
      Change on the device, then Vault, then any consumer. Vault-first ordering
      is wrong here, unlike the AD accounts, because nothing reads these from
      Vault at runtime.
    automatable: partial
    prerequisite: Per-appliance; several are SSH-only and need an expect-style flow.

  k8s_secret:
    count: 30
    summary: >-
      Application credentials delivered into the cluster by VSO/VaultStaticSecret:
      nextcloud/* (9), mailu/* (4), monitoring/* (5), task-control-plane/* (3),
      authelia/* (2), oidc/* (2), talos/backup/* (2), cnpg/prod/backup-s3,
      syncthing/prod, homelab/proxmox/cl1/ansible, and volsync's non-restic peers.
    danger: >-
      Most need the workload restarted after the Secret updates; a few embed the
      credential in an application config that VSO does not touch (Nextcloud's
      user_ldap is the known case, which is why the AD map classes it as `occ`).
    safe_procedure: >-
      Rotate at the source, write Vault, confirm VSO has synced the Secret, then
      roll the workload. The roadmap's prerequisite applies: if VSO sync is
      broken, rotation that does not propagate is worse than none.
    automatable: true
    prerequisite: >-
      Per-secret consumer mapping in the shape of
      ansible/domain/vars/service_account_consumers.yml, which does not yet exist
      for non-AD secrets. That map is the actual deliverable here.

  ad_account:
    count: 3
    summary: >-
      windows/domain/ldap, windows/domain/domain_admin,
      windows/domain/dhcp_failover.
    danger: >-
      Already governed by ansible/domain/vars/service_account_consumers.yml,
      which fails closed for accounts whose consumers are not all automatable.
    safe_procedure: >-
      rotate_service_account_passwords.yml. `ldap` at 277 days is a retirement,
      not a rotation - see runbooks/security/ldap-account-retirement.md.
    automatable: partial
    prerequisite: None; tooling exists.

  review_obsolete:
    count: 3
    summary: >-
      One-shot migration credentials that may have outlived their purpose:
      bitwarden/prod/migration, trilium/prod/migration, plex/prod/migration.
      nextcloud/staging/migration/app is counted under k8s_secret pending the
      same review.
    danger: >-
      These inflate the overdue count and are held to a rotation schedule they
      may not need. Deleting a still-referenced migration secret breaks a job
      that a future restore might depend on, so confirm before removing.
    safe_procedure: >-
      Confirm the migration is complete and the seed Job is suspended or gone,
      then delete the secret rather than rotating it. Each is still referenced
      by 1-2 files in git, so this is a review, not an obvious deletion. Plex's
      migration is known complete - the LXC was retired - but the manifest is
      retained in apps/prod/plex.
    automatable: false
    prerequisite: Owner confirmation per secret.

# Prefix -> class. Longest prefix wins. Consumed by reporting only; nothing in
# this file rotates anything.
src_prefixes:
  - { prefix: "volsync/prod/", class: restic_key }
  - { prefix: "proxmox/cl0/ceph/", class: ceph_auth }
  - { prefix: "aws/user/", class: external_provider }
  - { prefix: "cloudflare", class: external_provider }
  - { prefix: "github", class: external_provider }
  - { prefix: "docker/", class: external_provider }
  - { prefix: "unifi/", class: appliance }
  - { prefix: "synology/", class: appliance }
  - { prefix: "proxmox/pbs/", class: appliance }
  - { prefix: "proxmox/cl0/sso/", class: appliance }
  - { prefix: "powerdns", class: appliance }
  - { prefix: "substrate/", class: appliance }
  - { prefix: "windows/domain/", class: ad_account }
  - { prefix: "nextcloud/", class: k8s_secret }
  - { prefix: "mailu/", class: k8s_secret }
  - { prefix: "monitoring/", class: k8s_secret }
  - { prefix: "task-control-plane/", class: k8s_secret }
  - { prefix: "authelia/", class: k8s_secret }
  - { prefix: "oidc/", class: k8s_secret }
  - { prefix: "talos/backup/", class: k8s_secret }
  - { prefix: "cnpg/", class: k8s_secret }
  - { prefix: "syncthing/", class: k8s_secret }
  - { prefix: "homelab/", class: k8s_secret }

# Reviewed individually rather than by prefix, because the prefix they share
# with a live application secret would misclassify them.
src_explicit:
  - { path: "bitwarden/prod/migration", class: review_obsolete }
  - { path: "trilium/prod/migration", class: review_obsolete }
  - { path: "plex/prod/migration", class: review_obsolete }
  - { path: "proxmox", class: appliance }

# What "done" looks like, so this file does not become a static document:
#
#   1. restic_key   - a key add/remove playbook exists and 29 repos are re-keyed
#                     with the old slot removed only after the new one is proven.
#   2. ceph_auth    - a rotation playbook covering ceph auth + VSO + CSI restart.
#   3. external_provider - overlap-window rotation automated per provider.
#   4. k8s_secret   - a non-AD consumer map in the shape of
#                     ansible/domain/vars/service_account_consumers.yml.
#   5. appliance    - per-device procedures; several may stay manual forever,
#                     which is fine as long as that is recorded rather than
#                     implied.
#   6. review_obsolete - deleted or given an owner and a real interval.
