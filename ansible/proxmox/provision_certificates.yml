---
- name: Bootstrap Vault PKI/AppRole for Proxmox API certs
  hosts: vault
  become: true
  gather_facts: false
  tags:
    - certs
    - proxmox_certs
  vars:
    proxmox_cert_manage_vault_bootstrap: true
    proxmox_vault_addr: https://127.0.0.1:8200
    proxmox_vault_skip_verify: true
    proxmox_pki_allowed_domain: myrobertson.net
    proxmox_vault_root_token_file: /root/.vault-token
    proxmox_pki_mount: pki_int
    proxmox_pki_issuer_id: ""
    proxmox_pki_role_name: proxmox-api
    proxmox_pki_policy_name: proxmox-api-cert
    proxmox_pki_approle_name: proxmox-api-cert
    proxmox_cert_ttl: 720h
  tasks:
    - name: Skip vault bootstrap when disabled
      ansible.builtin.meta: end_play
      when: not proxmox_cert_manage_vault_bootstrap

    - name: Check Vault root token file exists
      ansible.builtin.stat:
        path: "{{ proxmox_vault_root_token_file }}"
      register: proxmox_vault_token_stat

    - name: Fail when Vault root token file is missing
      ansible.builtin.fail:
        msg: "Vault root token file {{ proxmox_vault_root_token_file }} is required for certificate bootstrap."
      when: not proxmox_vault_token_stat.stat.exists

    - name: Ensure vault CLI is installed on vault host
      ansible.builtin.shell: command -v vault
      register: proxmox_vault_cli_check
      changed_when: false
      failed_when: proxmox_vault_cli_check.rc != 0

    - name: Ensure AppRole auth method is enabled
      ansible.builtin.shell: |
        set -euo pipefail
        export VAULT_ADDR="{{ proxmox_vault_addr }}"
        export VAULT_SKIP_VERIFY={{ proxmox_vault_skip_verify | string | lower }}
        export VAULT_TOKEN="$(cat {{ proxmox_vault_root_token_file }})"
        if ! vault auth list | awk '{print $1}' | grep -q '^approle/'; then
          vault auth enable approle
          echo "ENABLED"
        else
          echo "SKIPPED"
        fi
      args:
        executable: /bin/bash
      register: approle_enable
      changed_when: "'ENABLED' in approle_enable.stdout"

    - name: Ensure PKI role exists for Proxmox API certs
      ansible.builtin.shell: |
        set -euo pipefail
        export VAULT_ADDR="{{ proxmox_vault_addr }}"
        export VAULT_SKIP_VERIFY={{ proxmox_vault_skip_verify | string | lower }}
        export VAULT_TOKEN="$(cat {{ proxmox_vault_root_token_file }})"
        vault write {{ proxmox_pki_mount }}/roles/{{ proxmox_pki_role_name }} \
          {% if proxmox_pki_issuer_id | length > 0 %}issuer_ref={{ proxmox_pki_issuer_id }} \
          {% endif %}allowed_domains={{ proxmox_pki_allowed_domain }} \
          allow_bare_domains=false \
          allow_subdomains=true \
          allow_glob_domains=false \
          allow_any_name=false \
          allow_ip_sans=true \
          enforce_hostnames=true \
          server_flag=true \
          client_flag=false \
          key_type=rsa \
          key_bits=2048 \
          max_ttl={{ proxmox_cert_ttl }}
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure Vault policy can issue Proxmox certs
      ansible.builtin.shell: |
        set -euo pipefail
        export VAULT_ADDR="{{ proxmox_vault_addr }}"
        export VAULT_SKIP_VERIFY={{ proxmox_vault_skip_verify | string | lower }}
        export VAULT_TOKEN="$(cat {{ proxmox_vault_root_token_file }})"
        vault policy write {{ proxmox_pki_policy_name }} - <<'POLICY'
        path "{{ proxmox_pki_mount }}/issue/{{ proxmox_pki_role_name }}" {
          capabilities = ["update"]
        }
        path "{{ proxmox_pki_mount }}/cert/ca" {
          capabilities = ["read"]
        }
        POLICY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure AppRole exists for Proxmox cert agent
      ansible.builtin.shell: |
        set -euo pipefail
        export VAULT_ADDR="{{ proxmox_vault_addr }}"
        export VAULT_SKIP_VERIFY={{ proxmox_vault_skip_verify | string | lower }}
        export VAULT_TOKEN="$(cat {{ proxmox_vault_root_token_file }})"
        vault write auth/approle/role/{{ proxmox_pki_approle_name }} \
          token_policies={{ proxmox_pki_policy_name }} \
          token_ttl=1h \
          token_max_ttl=24h \
          token_num_uses=0
      args:
        executable: /bin/bash
      changed_when: false

- name: Export Vault CA for Proxmox API trust on control node
  hosts: vault
  become: true
  gather_facts: false
  tags:
    - certs
    - proxmox_certs
  vars:
    proxmox_cert_manage_vault_bootstrap: true
    proxmox_vault_addr: https://127.0.0.1:8200
    proxmox_vault_skip_verify: true
    proxmox_vault_root_token_file: /root/.vault-token
    proxmox_pki_mount: pki_int
    proxmox_control_ca_bundle_path: "{{ inventory_dir }}/certs/proxmox-vault-ca.pem"
  tasks:
    - name: Skip CA export when vault bootstrap is disabled
      ansible.builtin.meta: end_play
      when: not proxmox_cert_manage_vault_bootstrap

    - name: Check Vault root token file exists for CA export
      ansible.builtin.stat:
        path: "{{ proxmox_vault_root_token_file }}"
      register: proxmox_vault_token_stat_for_ca_export
      run_once: true

    - name: Fail when Vault root token file is missing for CA export
      ansible.builtin.fail:
        msg: "Vault root token file {{ proxmox_vault_root_token_file }} is required for CA export."
      when: not (proxmox_vault_token_stat_for_ca_export.stat.exists | default(false))
      run_once: true

    - name: Read Vault CA certificate for Proxmox PKI mount
      ansible.builtin.shell: |
        set -euo pipefail
        export VAULT_ADDR="{{ proxmox_vault_addr }}"
        export VAULT_SKIP_VERIFY={{ proxmox_vault_skip_verify | string | lower }}
        export VAULT_TOKEN="$(cat {{ proxmox_vault_root_token_file }})"
        vault read -field=certificate {{ proxmox_pki_mount }}/cert/ca
      args:
        executable: /bin/bash
      register: proxmox_vault_ca_cert
      changed_when: false
      run_once: true

    - name: Ensure local inventory cert directory exists
      ansible.builtin.file:
        path: "{{ proxmox_control_ca_bundle_path | dirname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Write Vault CA certificate bundle for Proxmox API trust
      ansible.builtin.copy:
        dest: "{{ proxmox_control_ca_bundle_path }}"
        content: "{{ proxmox_vault_ca_cert.stdout | trim }}\n"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true

- name: Provision Proxmox API certificate automation
  hosts: proxmox_cert_nodes
  become: true
  gather_facts: true
  serial: 1
  tags:
    - certs
    - proxmox_certs
  vars:
    proxmox_cert_manage_vault_bootstrap: true
    proxmox_vault_group: vault
    proxmox_pki_allowed_domain: myrobertson.net
    # NOTE: Set this per inventory group (for example proxmox_cert_nodes_cl0/cl1)
    # so each cluster receives only its own VIP DNS SAN.
    proxmox_vault_addr_default: >-
      https://{{
        (proxmox_vault_group is defined
         and proxmox_vault_group in groups
         and (groups[proxmox_vault_group] | length) > 0)
        | ternary(
            hostvars[groups[proxmox_vault_group][0]].ansible_host
            | default(groups[proxmox_vault_group][0]),
            '127.0.0.1')
      }}:8200
    proxmox_vault_skip_verify_default: false
    proxmox_vault_delegate_addr: https://127.0.0.1:8200
    proxmox_vault_delegate_skip_verify: true
    proxmox_vault_root_token_file: /root/.vault-token
    proxmox_pki_mount: pki_int
    proxmox_pki_issuer_id: ""
    proxmox_pki_role_name: proxmox-api
    proxmox_pki_approle_name: proxmox-api-cert
    proxmox_cert_ttl: 720h
    proxmox_cert_expected_issuer_pattern: Vault
    proxmox_cert_vault_role_id_default: ""
    proxmox_cert_vault_secret_id_default: ""
    proxmox_cert_agent_name: vault-agent-proxmox-pveproxy
    proxmox_cert_agent_dir: /etc/vault-agent.d
    proxmox_cert_agent_runtime_dir: /var/lib/vault-agent/proxmox-pveproxy
    proxmox_cert_bundle_file: /var/lib/vault-agent/proxmox-pveproxy/issue-bundle.pem
    proxmox_cert_role_id_file: /etc/vault-agent.d/proxmox-role-id
    proxmox_cert_secret_id_file: /etc/vault-agent.d/proxmox-secret-id
    proxmox_cert_agent_config_file: /etc/vault-agent.d/proxmox-pveproxy.hcl
    proxmox_cert_agent_token_file: /var/lib/vault-agent/proxmox-pveproxy/token
    proxmox_cert_apply_script: /usr/local/sbin/apply-proxmox-api-cert.sh
    proxmox_pveproxy_cert_file: /etc/pve/local/pveproxy-ssl.pem
    proxmox_pveproxy_key_file: /etc/pve/local/pveproxy-ssl.key
    proxmox_cert_vault_ca_file: /etc/vault-agent.d/vault-ca.pem
    # Post-rotation hook: pushes the freshly rotated pveproxy cert into the Ceph
    # mgr dashboard config-key store so it does not drift from the live cert
    # between manual ceph_admin_portal.yml runs. Installed and wired below.
    proxmox_cert_ceph_refresh_script: /usr/local/sbin/refresh-ceph-dashboard-cert.sh
  pre_tasks:
    - name: Resolve Proxmox certificate automation inputs
      ansible.builtin.set_fact:
        proxmox_vault_addr_resolved: "{{ proxmox_vault_addr | default(proxmox_vault_addr_default) }}"
        proxmox_vault_skip_verify_resolved: "{{ (proxmox_vault_skip_verify | default(proxmox_vault_skip_verify_default)) | bool }}"
        proxmox_cert_vault_role_id_resolved: "{{ proxmox_cert_vault_role_id | default(proxmox_cert_vault_role_id_default) }}"
        proxmox_cert_vault_secret_id_resolved: "{{ proxmox_cert_vault_secret_id | default(proxmox_cert_vault_secret_id_default) }}"

    - name: Build cert subject names for this host
      ansible.builtin.set_fact:
        proxmox_cert_common_name: "{{ ansible_fqdn | default(inventory_hostname) }}"
        # Include host FQDN/IP plus optional cluster VIP SAN from inventory var
        # proxmox_cert_cluster_san (for example cl0.myrobertson.net or cl1.myrobertson.net).
        proxmox_cert_all_sans: "{{ [ansible_fqdn | default(inventory_hostname), inventory_hostname, ansible_host | default(''), proxmox_cert_cluster_san | default('')] | reject('equalto', '') | unique }}"

    - name: Build cert SAN strings for Vault request
      ansible.builtin.set_fact:
        proxmox_cert_alt_names: "{{ proxmox_cert_all_sans | reject('match', '^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$') | join(',') }}"
        proxmox_cert_ip_sans: "{{ proxmox_cert_all_sans | select('match', '^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$') | join(',') }}"

    - name: Ensure vault CLI exists on Proxmox node
      ansible.builtin.shell: command -v vault
      register: proxmox_node_vault_cli_check
      changed_when: false
      failed_when: proxmox_node_vault_cli_check.rc != 0

    - name: Validate vault group exists when AppRole IDs are not preseeded
      ansible.builtin.assert:
        that:
          - proxmox_vault_group in groups
          - groups.get(proxmox_vault_group, []) | length > 0
        fail_msg: >-
          No vault host is defined in inventory group '{{ proxmox_vault_group }}'.
          Add a vault host or pass proxmox_cert_vault_role_id and proxmox_cert_vault_secret_id.
      when:
        - proxmox_cert_vault_role_id_resolved | length == 0 or proxmox_cert_vault_secret_id_resolved | length == 0

    - name: Validate Vault address when vault group is absent
      ansible.builtin.assert:
        that:
          - (groups.get(proxmox_vault_group, []) | length) > 0 or (proxmox_vault_addr_resolved is not search('https?://(?:127\\.0\\.0\\.1|localhost)(?::[0-9]+)?/?$'))
        fail_msg: >-
          proxmox_vault_group '{{ proxmox_vault_group }}' is empty/undefined and proxmox_vault_addr
          resolves to loopback ({{ proxmox_vault_addr_resolved }}). Define a non-empty vault group or override
          proxmox_vault_addr to a non-loopback Vault endpoint.

    - name: Check delegated Vault root token file exists
      ansible.builtin.stat:
        path: "{{ proxmox_vault_root_token_file }}"
      delegate_to: "{{ groups.get(proxmox_vault_group, ['localhost'])[0] }}"
      become: true
      register: proxmox_vault_delegate_token_stat
      when:
        - proxmox_cert_vault_role_id_resolved | length == 0 or proxmox_cert_vault_secret_id_resolved | length == 0

    - name: Fail when delegated Vault root token file is missing
      ansible.builtin.fail:
        msg: "Vault root token file {{ proxmox_vault_root_token_file }} is required on delegated vault host {{ groups[proxmox_vault_group][0] }}."
      when:
        - proxmox_cert_vault_role_id_resolved | length == 0 or proxmox_cert_vault_secret_id_resolved | length == 0
        - not (proxmox_vault_delegate_token_stat.stat.exists | default(false))

    - name: Generate role_id for Proxmox cert AppRole (vault host)
      ansible.builtin.shell: |
        set -euo pipefail
        export VAULT_ADDR="{{ proxmox_vault_delegate_addr }}"
        export VAULT_SKIP_VERIFY={{ proxmox_vault_delegate_skip_verify | string | lower }}
        export VAULT_TOKEN="$(cat {{ proxmox_vault_root_token_file }})"
        vault read -field=role_id auth/approle/role/{{ proxmox_pki_approle_name }}/role-id
      args:
        executable: /bin/bash
      delegate_to: "{{ groups.get(proxmox_vault_group, ['localhost'])[0] }}"
      become: true
      register: proxmox_role_id_result
      changed_when: false
      when: proxmox_cert_vault_role_id_resolved | length == 0

    - name: Check whether AppRole secret_id file already exists on Proxmox node
      ansible.builtin.stat:
        path: "{{ proxmox_cert_secret_id_file }}"
      register: proxmox_existing_secret_id_stat
      when: proxmox_cert_vault_secret_id_resolved | length == 0

    - name: Read existing AppRole secret_id file from Proxmox node
      ansible.builtin.slurp:
        path: "{{ proxmox_cert_secret_id_file }}"
      register: proxmox_existing_secret_id_file
      when:
        - proxmox_cert_vault_secret_id_resolved | length == 0
        - proxmox_existing_secret_id_stat.stat.exists | default(false)

    - name: Generate secret_id for Proxmox cert AppRole (vault host)
      ansible.builtin.shell: |
        set -euo pipefail
        export VAULT_ADDR="{{ proxmox_vault_delegate_addr }}"
        export VAULT_SKIP_VERIFY={{ proxmox_vault_delegate_skip_verify | string | lower }}
        export VAULT_TOKEN="$(cat {{ proxmox_vault_root_token_file }})"
        vault write -field=secret_id -f auth/approle/role/{{ proxmox_pki_approle_name }}/secret-id
      args:
        executable: /bin/bash
      delegate_to: "{{ groups.get(proxmox_vault_group, ['localhost'])[0] }}"
      become: true
      register: proxmox_secret_id_result
      changed_when: false
      when:
        - proxmox_cert_vault_secret_id_resolved | length == 0
        - not (proxmox_existing_secret_id_stat.stat.exists | default(false))

    - name: Resolve effective AppRole credentials
      ansible.builtin.set_fact:
        proxmox_cert_effective_role_id: "{{ proxmox_cert_vault_role_id_resolved if proxmox_cert_vault_role_id_resolved | length > 0 else proxmox_role_id_result.stdout }}"
        proxmox_cert_effective_secret_id: >-
          {{
            proxmox_cert_vault_secret_id_resolved
            if proxmox_cert_vault_secret_id_resolved | length > 0
            else
              (
                (proxmox_existing_secret_id_file.content | b64decode | trim)
                if (proxmox_existing_secret_id_stat.stat.exists | default(false))
                else proxmox_secret_id_result.stdout
              )
          }}

    - name: Check for existing Vault CA certificate on first Proxmox node
      ansible.builtin.stat:
        path: "{{ proxmox_cert_vault_ca_file }}"
      delegate_to: "{{ ansible_play_hosts_all[0] }}"
      become: true
      register: proxmox_existing_vault_ca_file_stat
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
      run_once: true

    - name: Validate existing Vault CA certificate on first Proxmox node
      ansible.builtin.shell: |
        set -euo pipefail
        openssl x509 -in "{{ proxmox_cert_vault_ca_file }}" -noout
      args:
        executable: /bin/bash
      delegate_to: "{{ ansible_play_hosts_all[0] }}"
      become: true
      register: proxmox_existing_vault_ca_validation
      changed_when: false
      failed_when: false
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
        - proxmox_existing_vault_ca_file_stat.stat.exists | default(false)
      run_once: true

    - name: Resolve whether existing Vault CA certificate can be reused
      ansible.builtin.set_fact:
        proxmox_reuse_existing_vault_ca: "{{ (proxmox_existing_vault_ca_validation.rc | default(1)) == 0 }}"
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
      run_once: true

    - name: Read existing Vault CA certificate from first Proxmox node
      ansible.builtin.slurp:
        path: "{{ proxmox_cert_vault_ca_file }}"
      delegate_to: "{{ ansible_play_hosts_all[0] }}"
      become: true
      register: proxmox_existing_vault_ca_cert_for_nodes
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
        - proxmox_reuse_existing_vault_ca | default(false)
      run_once: true

    - name: Read Vault CA certificate from public PKI endpoint for Proxmox nodes
      ansible.builtin.shell: |
        set -euo pipefail
        curl -k -fsS "{{ proxmox_vault_addr_resolved | regex_replace('/+$', '') }}/v1/{{ proxmox_pki_mount }}/ca/pem"
      args:
        executable: /bin/bash
      register: proxmox_public_vault_ca_cert_for_nodes
      changed_when: false
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
        - not (hostvars[ansible_play_hosts_all[0]].proxmox_reuse_existing_vault_ca | default(false))
        - groups.get(proxmox_vault_group, []) | length == 0
      run_once: true

    - name: Validate vault group exists for delegated CA fetch
      ansible.builtin.assert:
        that:
          - proxmox_vault_group in groups
          - groups.get(proxmox_vault_group, []) | length > 0
        fail_msg: >-
          No vault host is defined in inventory group '{{ proxmox_vault_group }}',
          but proxmox_vault_skip_verify=false requires delegated Vault CA fetch.
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
        - not (hostvars[ansible_play_hosts_all[0]].proxmox_reuse_existing_vault_ca | default(false))
        - >-
          proxmox_public_vault_ca_cert_for_nodes is not defined
          or proxmox_public_vault_ca_cert_for_nodes.skipped | default(false)

    - name: Check delegated Vault root token file exists for delegated CA fetch
      ansible.builtin.stat:
        path: "{{ proxmox_vault_root_token_file }}"
      delegate_to: "{{ groups.get(proxmox_vault_group, ['localhost'])[0] }}"
      become: true
      register: proxmox_vault_delegate_token_stat_for_ca_fetch
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
        - not (hostvars[ansible_play_hosts_all[0]].proxmox_reuse_existing_vault_ca | default(false))
        - >-
          proxmox_public_vault_ca_cert_for_nodes is not defined
          or proxmox_public_vault_ca_cert_for_nodes.skipped | default(false)
      run_once: true

    - name: Fail when delegated Vault root token file is missing for delegated CA fetch
      ansible.builtin.fail:
        msg: >-
          Vault root token file {{ proxmox_vault_root_token_file }} is required on delegated vault host
          {{ groups[proxmox_vault_group][0] }} when proxmox_vault_skip_verify=false.
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
        - not (proxmox_vault_delegate_token_stat_for_ca_fetch.stat.exists | default(false))
        - not (hostvars[ansible_play_hosts_all[0]].proxmox_reuse_existing_vault_ca | default(false))
        - >-
          proxmox_public_vault_ca_cert_for_nodes is not defined
          or proxmox_public_vault_ca_cert_for_nodes.skipped | default(false)
      run_once: true

    - name: Read Vault CA certificate for Proxmox nodes
      ansible.builtin.shell: |
        set -euo pipefail
        export VAULT_ADDR="{{ proxmox_vault_delegate_addr }}"
        export VAULT_SKIP_VERIFY={{ proxmox_vault_delegate_skip_verify | string | lower }}
        export VAULT_TOKEN="$(cat {{ proxmox_vault_root_token_file }})"
        vault read -field=certificate {{ proxmox_pki_mount }}/cert/ca
      args:
        executable: /bin/bash
      delegate_to: "{{ groups.get(proxmox_vault_group, ['localhost'])[0] }}"
      become: true
      register: proxmox_vault_ca_cert_for_nodes
      changed_when: false
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
        - not (hostvars[ansible_play_hosts_all[0]].proxmox_reuse_existing_vault_ca | default(false))
        - >-
          proxmox_public_vault_ca_cert_for_nodes is not defined
          or proxmox_public_vault_ca_cert_for_nodes.skipped | default(false)
      run_once: true

    - name: Validate fetched Vault CA certificate for Proxmox nodes
      ansible.builtin.shell: |
        set -euo pipefail
        openssl x509 -noout
      args:
        executable: /bin/bash
        stdin: >-
          {{
            proxmox_public_vault_ca_cert_for_nodes.stdout
            if (
              proxmox_public_vault_ca_cert_for_nodes is defined
              and not (proxmox_public_vault_ca_cert_for_nodes.skipped | default(false))
            )
            else proxmox_vault_ca_cert_for_nodes.stdout
          }}
      register: proxmox_fetched_vault_ca_validation
      changed_when: false
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
        - >-
          (
            proxmox_public_vault_ca_cert_for_nodes is defined
            and not (proxmox_public_vault_ca_cert_for_nodes.skipped | default(false))
          )
          or (
            proxmox_vault_ca_cert_for_nodes is defined
            and not (proxmox_vault_ca_cert_for_nodes.skipped | default(false))
          )
      run_once: true

    - name: Resolve Vault CA certificate content for Proxmox nodes
      ansible.builtin.set_fact:
        proxmox_cert_vault_ca_content: >-
          {{
            (
              proxmox_public_vault_ca_cert_for_nodes.stdout
              if (
                proxmox_public_vault_ca_cert_for_nodes is defined
                and not (proxmox_public_vault_ca_cert_for_nodes.skipped | default(false))
              )
              else (
                proxmox_vault_ca_cert_for_nodes.stdout
                if (
                  proxmox_vault_ca_cert_for_nodes is defined
                  and not (proxmox_vault_ca_cert_for_nodes.skipped | default(false))
                )
                else (proxmox_existing_vault_ca_cert_for_nodes.content | b64decode)
              )
            )
            | trim
          }}
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
        - >-
          (
            proxmox_public_vault_ca_cert_for_nodes is defined
            and not (proxmox_public_vault_ca_cert_for_nodes.skipped | default(false))
          )
          or (
            proxmox_vault_ca_cert_for_nodes is defined
            and not (proxmox_vault_ca_cert_for_nodes.skipped | default(false))
          )
          or proxmox_existing_vault_ca_cert_for_nodes is defined
      run_once: true

  tasks:
    - name: Detect current Proxmox portal private key type
      ansible.builtin.shell: |
        set -euo pipefail
        if [[ ! -f "{{ proxmox_pveproxy_key_file }}" ]]; then
          echo "MISSING"
        elif openssl pkey -in "{{ proxmox_pveproxy_key_file }}" -noout -text 2>/dev/null | grep -qi 'modulus:'; then
          echo "RSA"
        elif openssl pkey -in "{{ proxmox_pveproxy_key_file }}" -noout >/dev/null 2>&1; then
          echo "NON_RSA"
        else
          echo "UNREADABLE"
        fi
      args:
        executable: /bin/bash
      register: proxmox_current_key_type
      changed_when: false

    - name: Validate vault group exists for one-time RSA reissue
      ansible.builtin.assert:
        that:
          - proxmox_vault_group in groups
          - groups.get(proxmox_vault_group, []) | length > 0
        fail_msg: >-
          No vault host is defined in inventory group '{{ proxmox_vault_group }}',
          but RSA reissue requires delegated Vault access.
      when: proxmox_current_key_type.stdout | trim == 'NON_RSA'

    - name: Check delegated Vault root token file exists for one-time RSA reissue
      ansible.builtin.stat:
        path: "{{ proxmox_vault_root_token_file }}"
      delegate_to: "{{ groups.get(proxmox_vault_group, ['localhost'])[0] }}"
      become: true
      register: proxmox_vault_delegate_token_stat_for_rsa_reissue
      when: proxmox_current_key_type.stdout | trim == 'NON_RSA'

    - name: Fail when delegated Vault root token file is missing for one-time RSA reissue
      ansible.builtin.fail:
        msg: >-
          Vault root token file {{ proxmox_vault_root_token_file }} is required on delegated vault host
          {{ groups[proxmox_vault_group][0] }} for one-time EC→RSA certificate reissue.
      when:
        - proxmox_current_key_type.stdout | trim == 'NON_RSA'
        - not (proxmox_vault_delegate_token_stat_for_rsa_reissue.stat.exists | default(false))

    - name: Issue fresh RSA certificate for Proxmox portal (vault host)
      ansible.builtin.shell: |
        set -euo pipefail
        export VAULT_ADDR="{{ proxmox_vault_delegate_addr }}"
        export VAULT_SKIP_VERIFY={{ proxmox_vault_delegate_skip_verify | string | lower }}
        export VAULT_TOKEN="$(cat {{ proxmox_vault_root_token_file }})"
        vault write -format=json {{ proxmox_pki_mount }}/issue/{{ proxmox_pki_role_name }} \
          common_name="{{ proxmox_cert_common_name }}" \
          alt_names="{{ proxmox_cert_alt_names }}" \
          ip_sans="{{ proxmox_cert_ip_sans }}" \
          ttl="{{ proxmox_cert_ttl }}" \
          key_type="rsa" \
          key_bits="2048"
      args:
        executable: /bin/bash
      delegate_to: "{{ groups.get(proxmox_vault_group, ['localhost'])[0] }}"
      become: true
      register: proxmox_rsa_issue_result
      changed_when: false
      no_log: true
      when: proxmox_current_key_type.stdout | trim == 'NON_RSA'

    - name: Install freshly issued RSA certificate for Proxmox portal
      ansible.builtin.copy:
        dest: "{{ proxmox_pveproxy_cert_file }}"
        content: "{{ (proxmox_rsa_issue_result.stdout | from_json).data.certificate | trim }}\n{{ (proxmox_rsa_issue_result.stdout | from_json).data.issuing_ca | trim }}\n"
        owner: root
        group: www-data
        mode: "0640"
      when: proxmox_current_key_type.stdout | trim == 'NON_RSA'

    - name: Install freshly issued RSA private key for Proxmox portal
      ansible.builtin.copy:
        dest: "{{ proxmox_pveproxy_key_file }}"
        content: "{{ (proxmox_rsa_issue_result.stdout | from_json).data.private_key | trim }}\n"
        owner: root
        group: www-data
        mode: "0640"
      no_log: true
      when: proxmox_current_key_type.stdout | trim == 'NON_RSA'

    - name: Restart pveproxy after RSA key rotation
      ansible.builtin.systemd:
        name: pveproxy
        state: restarted
      when: proxmox_current_key_type.stdout | trim == 'NON_RSA'

    # The vault-agent config dir, runtime dir, and the AppRole role_id/secret_id
    # files are now created by roles/vault_cert_agent (invoked below) using the
    # same paths and 0750/0700/0600 permissions. The Vault CA is still installed
    # here from the content resolved in pre_tasks, so the role finds it already
    # present and does not re-fetch it.
    - name: Install Vault CA certificate for vault-agent trust
      ansible.builtin.copy:
        dest: "{{ proxmox_cert_vault_ca_file }}"
        content: "{{ hostvars[ansible_play_hosts_all[0]].proxmox_cert_vault_ca_content | trim }}\n"
        owner: root
        group: root
        mode: "0644"
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
        - hostvars[ansible_play_hosts_all[0]].proxmox_cert_vault_ca_content is defined

    - name: Fail if Vault CA is required but unavailable
      ansible.builtin.fail:
        msg: >-
          proxmox_vault_skip_verify is false, but Vault CA content is unavailable,
          so {{ proxmox_cert_vault_ca_file }} cannot be created. Ensure Vault CA
          retrieval is enabled for nodes or set proxmox_vault_skip_verify=true
          only for test scenarios.
      when:
        - not (proxmox_vault_skip_verify_resolved | bool)
        - hostvars[ansible_play_hosts_all[0]].proxmox_cert_vault_ca_content is not defined

    # The apply script, Vault Agent HCL, systemd unit, service enablement,
    # handler flush, and post-issue verification are now provided by
    # roles/vault_cert_agent (invoked below) using the pveproxy parameters. The
    # rendered artifacts are equivalent to the inline versions removed here; see
    # runbooks/security/certificate-management-standard.md and the convergence
    # notes in the role. Only the pmxcfs cp handling and the Ceph refresh hook
    # are pveproxy-specific and are passed as role options.
    - name: Install the Ceph mgr dashboard certificate refresh hook
      ansible.builtin.copy:
        dest: "{{ proxmox_cert_ceph_refresh_script }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # {{ ansible_managed }}
          # Invoked by the pveproxy Vault Agent apply script (post-reload hook)
          # after the pveproxy certificate rotates, so the Ceph mgr dashboard
          # config-key store does not drift from the live cert between manual
          # ceph_admin_portal.yml runs. Mirrors that playbook's per-node sync +
          # active-mgr fail, scoped to this node, and is a safe no-op (exit 0)
          # when this host is not a reachable Ceph mgr.
          set -uo pipefail

          CERT_FILE="{{ proxmox_pveproxy_cert_file }}"
          KEY_FILE="{{ proxmox_pveproxy_key_file }}"

          command -v ceph >/dev/null 2>&1 || exit 0
          ceph -s >/dev/null 2>&1 || exit 0
          [[ -s "$CERT_FILE" && -s "$KEY_FILE" ]] || exit 0

          NODES="$(ceph mgr dump --format json 2>/dev/null | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          nodes = []
          if d.get("active_name"):
              nodes.append(d["active_name"])
          nodes += [s["name"] for s in d.get("standbys", [])]
          print(" ".join(nodes))
          ')"
          [[ -n "$NODES" ]] || exit 0

          EXPECTED_KEY_HASH="$(sha256sum "$KEY_FILE" | awk '{print $1}')"
          EXPECTED_CRT_HASH="$(sha256sum "$CERT_FILE" | awk '{print $1}')"
          UPDATED=""
          for node in $NODES; do
            CURRENT_KEY_HASH="$(ceph config-key get "mgr/dashboard/${node}/key" 2>/dev/null | sha256sum | awk '{print $1}' || true)"
            CURRENT_CRT_HASH="$(ceph config-key get "mgr/dashboard/${node}/crt" 2>/dev/null | sha256sum | awk '{print $1}' || true)"
            if [[ "$CURRENT_KEY_HASH" != "$EXPECTED_KEY_HASH" || "$CURRENT_CRT_HASH" != "$EXPECTED_CRT_HASH" ]]; then
              ceph config-key set "mgr/dashboard/${node}/key" -i "$KEY_FILE" || true
              ceph config-key set "mgr/dashboard/${node}/crt" -i "$CERT_FILE" || true
              UPDATED="${UPDATED} ${node}"
            fi
          done

          if [[ -n "$UPDATED" ]]; then
            ACTIVE="$(ceph mgr stat --format json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("active_name",""))' 2>/dev/null || true)"
            [[ -n "$ACTIVE" ]] && ceph mgr fail "$ACTIVE" || true
          fi
          exit 0

    - name: Manage the pveproxy certificate via the canonical Vault Agent role
      ansible.builtin.include_role:
        name: vault_cert_agent
      vars:
        vault_cert_agent_service_name: proxmox-pveproxy
        vault_cert_agent_common_name: "{{ proxmox_cert_common_name }}"
        # SANs come from the same all-SANs list the legacy inline template used;
        # the role joins each list with ',' to reproduce the identical
        # alt_names / ip_sans request strings (host FQDN/short + IP + cluster VIP).
        vault_cert_agent_alt_names: "{{ proxmox_cert_all_sans | reject('match', '^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$') | list }}"
        vault_cert_agent_ip_sans: "{{ proxmox_cert_all_sans | select('match', '^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$') | list }}"
        vault_cert_agent_cert_file: "{{ proxmox_pveproxy_cert_file }}"
        vault_cert_agent_key_file: "{{ proxmox_pveproxy_key_file }}"
        # /etc/pve/local is pmxcfs (FUSE): install(1) metadata ops are rejected,
        # so the apply script uses plain cp and inherits the existing files'
        # root:www-data 0640 ownership (set by the EC->RSA reissue / Proxmox).
        vault_cert_agent_pmxcfs_target: true
        vault_cert_agent_reload_command: systemctl restart pveproxy
        # Ceph mgr dashboard cert refresh on rotation: DISABLED. Each pve node
        # has a distinct leaf (CN = node FQDN), so pushing it into the shared
        # mgr/dashboard/<node> config-keys makes them flip-flop between three
        # certs and fires a `ceph mgr fail` failover on every rotation (~weekly).
        # Low value anyway: the HAProxy ceph-admin gateway fronts the dashboard
        # with its own cert. Needs a single-source, run_once redesign before it
        # is re-enabled. The helper script stays installed but dormant.
        vault_cert_agent_post_reload_command: ""
        vault_cert_agent_verify_host: 127.0.0.1
        vault_cert_agent_verify_port: "8006"
        vault_cert_agent_expected_issuer_pattern: "{{ proxmox_cert_expected_issuer_pattern }}"
        vault_cert_agent_vault_addr: "{{ proxmox_vault_addr_resolved }}"
        vault_cert_agent_vault_ca_file: "{{ proxmox_cert_vault_ca_file }}"
        vault_cert_agent_pki_mount: "{{ proxmox_pki_mount }}"
        vault_cert_agent_pki_role: "{{ proxmox_pki_role_name }}"
        vault_cert_agent_cert_ttl: "{{ proxmox_cert_ttl }}"
        vault_cert_agent_role_id: "{{ proxmox_cert_effective_role_id }}"
        vault_cert_agent_secret_id: "{{ proxmox_cert_effective_secret_id }}"
        # Keep the exact on-host paths/unit name the legacy agent used so this is
        # an in-place upgrade (no orphaned units/scripts).
        vault_cert_agent_role_id_file: "{{ proxmox_cert_role_id_file }}"
        vault_cert_agent_secret_id_file: "{{ proxmox_cert_secret_id_file }}"
        vault_cert_agent_runtime_dir: "{{ proxmox_cert_agent_runtime_dir }}"
        vault_cert_agent_bundle_file: "{{ proxmox_cert_bundle_file }}"
        vault_cert_agent_config_file: "{{ proxmox_cert_agent_config_file }}"
        vault_cert_agent_apply_script: "{{ proxmox_cert_apply_script }}"
        # vault CLI presence is already asserted in pre_tasks; do not install it.
        vault_cert_agent_install_vault_cli: false
