---
# Installs the node_exporter textfile collectors that publish credential age for
# the two places long-lived credentials actually live: Active Directory and the
# Vault secret/ KV mount.
#
#   export VAULT_ADDR=https://vault.myrobertson.net:8200 VAULT_TOKEN=...
#   ansible-playbook -i inventory/environments/production.ini \
#     ansible/proxmox/credential_age_metrics.yml
#
# Pairs with the alert rules in
# homelab_flux/infrastructure/configs/credential-age-alerts.yaml and implements
# Workstream 2 of runbooks/security/credential-lifecycle-roadmap.md.
#
# Why the Proxmox nodes host this rather than a purpose-built host: they already
# run a node_exporter that Prometheus scrapes as job="proxmox-node-exporter",
# they already publish two textfile collectors into the same directory, they
# already hold a Vault AppRole and the Vault CA, and they sit on the same L2
# segment as the domain controllers. Every alternative adds a scrape target, a
# trust anchor, or both. A Kubernetes-resident exporter was the closest
# contender and was rejected because it would depend on the Vault -> Kubernetes
# sync path the incident found broken, so it would go blind exactly when
# credential handling is already degraded.

- name: Provision Vault access for the credential age collectors
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars_files:
    - vars/credential_age_metrics.yml

  tasks:
    - name: Require Vault environment
      ansible.builtin.assert:
        that:
          - credential_age_bootstrap_vault_addr | length > 0
          - credential_age_bootstrap_vault_token | length > 0
        fail_msg: Set VAULT_ADDR and VAULT_TOKEN before running this playbook.

    # Metadata-only by default. The collector needs a date, not a password, and
    # custom_metadata carries the date without exposing the value, so the only
    # secrets this policy can read are the directory bind and whichever paths
    # still keep their rotation date in a data field.
    - name: Render the collector Vault policy
      ansible.builtin.set_fact:
        credential_age_policy_hcl: |
          path "{{ credential_age_vault_mount }}/metadata" {
            capabilities = ["list"]
          }

          path "{{ credential_age_vault_mount }}/metadata/*" {
            capabilities = ["read", "list"]
          }

          path "{{ credential_age_vault_mount }}/data/{{ credential_age_ad_bind_secret_path }}" {
            capabilities = ["read"]
          }
          {% for path in credential_age_vault_data_field_paths %}

          path "{{ credential_age_vault_mount }}/data/{{ path }}" {
            capabilities = ["read"]
          }
          {% endfor %}

    - name: Read the current collector Vault policy
      community.hashi_vault.vault_read:
        url: "{{ credential_age_bootstrap_vault_addr }}"
        token: "{{ credential_age_bootstrap_vault_token }}"
        path: "sys/policies/acl/{{ credential_age_policy_name }}"
      register: credential_age_existing_policy
      failed_when: false

    # Compared with whitespace collapsed: Vault returns the policy verbatim, and
    # an insignificant newline difference must not re-write it on every run.
    - name: Write the collector Vault policy
      community.hashi_vault.vault_write:
        url: "{{ credential_age_bootstrap_vault_addr }}"
        token: "{{ credential_age_bootstrap_vault_token }}"
        path: "sys/policies/acl/{{ credential_age_policy_name }}"
        data:
          policy: "{{ credential_age_policy_hcl }}"
      vars:
        credential_age_policy_current: >-
          {{ (credential_age_existing_policy.data.data.policy | default(''))
             | regex_replace('\s+', ' ') | trim }}
        credential_age_policy_wanted: >-
          {{ credential_age_policy_hcl | regex_replace('\s+', ' ') | trim }}
      when: credential_age_policy_current != credential_age_policy_wanted

    - name: Read the current collector AppRole
      community.hashi_vault.vault_read:
        url: "{{ credential_age_bootstrap_vault_addr }}"
        token: "{{ credential_age_bootstrap_vault_token }}"
        path: "auth/approle/role/{{ credential_age_approle_name }}"
      register: credential_age_existing_approle
      failed_when: false

    - name: Create the collector AppRole
      community.hashi_vault.vault_write:
        url: "{{ credential_age_bootstrap_vault_addr }}"
        token: "{{ credential_age_bootstrap_vault_token }}"
        path: "auth/approle/role/{{ credential_age_approle_name }}"
        data:
          token_policies: "{{ credential_age_policy_name }}"
          token_ttl: "{{ credential_age_token_ttl_seconds }}"
          token_max_ttl: "{{ credential_age_token_max_ttl_seconds }}"
          secret_id_num_uses: 0
          secret_id_ttl: 0
      vars:
        credential_age_approle_current: "{{ credential_age_existing_approle.data.data | default({}) }}"
      when: >-
        credential_age_approle_current.token_policies | default([]) != [credential_age_policy_name]
        or credential_age_approle_current.token_ttl | default(0) | int != credential_age_token_ttl_seconds
        or credential_age_approle_current.token_max_ttl | default(0) | int != credential_age_token_max_ttl_seconds

    - name: Read the collector AppRole role_id
      community.hashi_vault.vault_read:
        url: "{{ credential_age_bootstrap_vault_addr }}"
        token: "{{ credential_age_bootstrap_vault_token }}"
        path: "auth/approle/role/{{ credential_age_approle_name }}/role-id"
      register: credential_age_role_id_result
      no_log: true

    # The AD CS root is what makes the LDAPS bind verifiable. Only cert_pem is
    # used; the same Vault path also holds the CA private key, hence no_log.
    - name: Read the Active Directory root CA certificate
      community.hashi_vault.vault_kv2_get:
        url: "{{ credential_age_bootstrap_vault_addr }}"
        token: "{{ credential_age_bootstrap_vault_token }}"
        engine_mount_point: "{{ credential_age_vault_mount }}"
        path: "{{ credential_age_ad_ca_secret_path }}"
      register: credential_age_ad_ca_secret
      no_log: true
      when: credential_age_ad_tls_verify | bool

- name: Export Active Directory and Vault credential age metrics
  hosts: "{{ credential_age_metrics_target_hosts | default('proxmox_nodes') }}"
  become: true
  gather_facts: false

  vars_files:
    - vars/credential_age_metrics.yml

  vars:
    credential_age_role_id: "{{ hostvars['localhost'].credential_age_role_id_result.data.data.role_id }}"
    credential_age_ad_ca_pem: >-
      {{ hostvars['localhost'].credential_age_ad_ca_secret.secret[credential_age_ad_ca_cert_field] | default('') }}

  handlers:
    - name: Restart prometheus-node-exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        state: restarted
        daemon_reload: true

  tasks:
    - name: Install the LDAP client used for the directory query
      ansible.builtin.apt:
        name: ldap-utils
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Installed by ansible/proxmox/provision_certificates.yml. Without it the
    # collectors would have to skip Vault TLS verification while carrying a
    # directory bind credential.
    - name: Assert the Vault CA is present
      ansible.builtin.stat:
        path: "{{ credential_age_vault_ca_file }}"
      register: credential_age_vault_ca_stat
      failed_when: not credential_age_vault_ca_stat.stat.exists

    - name: Ensure node exporter textfile directory exists
      ansible.builtin.file:
        path: "{{ credential_age_metrics_textfile_dir }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0755"

    - name: Enable node exporter textfile collector
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus-node-exporter
        regexp: '^ARGS='
        line: 'ARGS="{{ credential_age_node_exporter_args }}"'
        create: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart prometheus-node-exporter

    - name: Install the Active Directory root CA for LDAPS verification
      ansible.builtin.copy:
        dest: "{{ credential_age_ad_ca_file }}"
        content: "{{ credential_age_ad_ca_pem | trim }}\n"
        owner: root
        group: root
        mode: "0644"
      when: credential_age_ad_tls_verify | bool

    # No trailing newline: the collectors pass these to `vault write role_id=@file`,
    # and the Vault CLI uses the file contents verbatim rather than trimming them
    # the way vault-agent does for its own role_id_file_path.
    - name: Install the collector AppRole role_id
      ansible.builtin.copy:
        dest: "{{ credential_age_role_id_file }}"
        content: "{{ credential_age_role_id }}"
        owner: root
        group: root
        mode: "0600"

    - name: Check whether this node already holds a collector secret_id
      ansible.builtin.stat:
        path: "{{ credential_age_secret_id_file }}"
      register: credential_age_secret_id_stat

    # A secret_id is minted only when the node has none, so re-running the
    # playbook does not churn credentials on every pass. Each node gets its own
    # so one can be revoked without disturbing the others.
    - name: Mint a collector secret_id for this node
      community.hashi_vault.vault_write:
        url: "{{ credential_age_bootstrap_vault_addr }}"
        token: "{{ credential_age_bootstrap_vault_token }}"
        path: "auth/approle/role/{{ credential_age_approle_name }}/secret-id"
        data:
          metadata: '{"node": "{{ inventory_hostname }}"}'
      register: credential_age_secret_id_result
      when: not credential_age_secret_id_stat.stat.exists
      delegate_to: localhost
      become: false
      no_log: true

    - name: Install the collector AppRole secret_id
      ansible.builtin.copy:
        dest: "{{ credential_age_secret_id_file }}"
        content: "{{ credential_age_secret_id_result.data.data.secret_id }}"
        owner: root
        group: root
        mode: "0600"
      when: not credential_age_secret_id_stat.stat.exists
      no_log: true

    - name: Install the Active Directory credential age collector
      ansible.builtin.template:
        src: credential-age-ad-metrics.sh.j2
        dest: "{{ credential_age_ad_script }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install the Vault credential age collector
      ansible.builtin.template:
        src: credential-age-vault-metrics.sh.j2
        dest: "{{ credential_age_vault_script }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install the Active Directory credential age service
      ansible.builtin.copy:
        dest: /etc/systemd/system/credential-age-ad-metrics.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Collect Active Directory credential age metrics
          Wants=network-online.target
          After=network-online.target pve-cluster.service

          [Service]
          Type=oneshot
          ExecStart={{ credential_age_ad_script }}

    - name: Install the Vault credential age service
      ansible.builtin.copy:
        dest: /etc/systemd/system/credential-age-vault-metrics.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Collect Vault secret rotation age metrics
          Wants=network-online.target
          After=network-online.target pve-cluster.service

          [Service]
          Type=oneshot
          ExecStart={{ credential_age_vault_script }}

    - name: Install the Active Directory credential age timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/credential-age-ad-metrics.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run the Active Directory credential age collector every {{ credential_age_ad_interval }}

          [Timer]
          OnBootSec=10min
          OnUnitActiveSec={{ credential_age_ad_interval }}
          RandomizedDelaySec=300
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Install the Vault credential age timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/credential-age-vault-metrics.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run the Vault credential age collector every {{ credential_age_vault_interval }}

          [Timer]
          OnBootSec=10min
          OnUnitActiveSec={{ credential_age_vault_interval }}
          RandomizedDelaySec=300
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Enable the credential age timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - credential-age-ad-metrics.timer
        - credential-age-vault-metrics.timer

    - name: Run the collectors once so metrics exist immediately
      ansible.builtin.command:
        argv: ["{{ item }}"]
      loop:
        - "{{ credential_age_ad_script }}"
        - "{{ credential_age_vault_script }}"
      changed_when: true

    - name: Check whether this node published the Active Directory metrics
      ansible.builtin.stat:
        path: "{{ credential_age_metrics_textfile_dir }}/credential_age_ad.prom"
      register: credential_age_ad_file

    - name: Check whether this node published the Vault metrics
      ansible.builtin.stat:
        path: "{{ credential_age_metrics_textfile_dir }}/credential_age_vault.prom"
      register: credential_age_vault_file

    # Exactly one, not at least one: a second publisher means leader election
    # has broken and every per-account alert would fire in triplicate.
    - name: Verify exactly one node published each credential age metric file
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | map('extract', hostvars, ['credential_age_ad_file', 'stat', 'exists']) | select | list | length == 1
          - ansible_play_hosts | map('extract', hostvars, ['credential_age_vault_file', 'stat', 'exists']) | select | list | length == 1
        fail_msg: >-
          The credential age metric files were published by zero or more than one
          Proxmox node. Check `systemctl status credential-age-ad-metrics.service
          credential-age-vault-metrics.service` and the pmxcfs leader election in
          the collector scripts.
      run_once: true
