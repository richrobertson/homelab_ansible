---
# Automate rotation of the PBS host root (root@pam) password. Vault
# (secret/proxmox/pbs/prod/install, key root_password) is its only consumer.
#
# WHAT THIS PROVISIONS
#   Vault  sys/policies/acl/pbs-root-password-rotation (ansible/vault/policies/)
#          auth/approle/role/pbs-root-password-rotation, 15 min tokens
#   PBS    /usr/local/sbin/pbs-rotate-root-password.py, plus a daily timer
#
# Run:
#   export VAULT_ADDR=https://vault.myrobertson.net:8200 VAULT_TOKEN=...
#   ansible-playbook -i inventory/environments/production.ini \
#     ansible/proxmox/pbs_root_password_rotation.yml
#
# First rotation by hand: ssh root@pbs /usr/local/sbin/pbs-rotate-root-password.py --force

- name: Provision Vault for the PBS root password rotation
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pbs, pbs_root_password_rotation]
  vars:
    boot_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
    boot_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    approle: pbs-root-password-rotation
    policy_name: pbs-root-password-rotation
    policy_file: "{{ playbook_dir }}/../vault/policies/pbs-root-password-rotation.hcl"
  tasks:
    - name: Require Vault environment
      ansible.builtin.assert:
        that:
          - boot_addr | length > 0
          - boot_token | length > 0
        fail_msg: Export VAULT_ADDR and VAULT_TOKEN before running.

    - name: Write the rotation Vault policy
      community.hashi_vault.vault_write:
        url: "{{ boot_addr }}"
        token: "{{ boot_token }}"
        path: "sys/policies/acl/{{ policy_name }}"
        data:
          policy: "{{ lookup('ansible.builtin.file', policy_file) }}"

    - name: Ensure the rotation AppRole uses only that policy, short-lived
      community.hashi_vault.vault_write:
        url: "{{ boot_addr }}"
        token: "{{ boot_token }}"
        path: "auth/approle/role/{{ approle }}"
        data:
          token_policies: "{{ policy_name }}"
          token_ttl: 900
          token_max_ttl: 1800
          secret_id_num_uses: 0
          secret_id_ttl: 0

    - name: Read the rotation AppRole role_id
      community.hashi_vault.vault_read:
        url: "{{ boot_addr }}"
        token: "{{ boot_token }}"
        path: "auth/approle/role/{{ approle }}/role-id"
      register: pbs_root_rot_role_id
      no_log: true

- name: Install the PBS root password rotation
  hosts: pbs_servers
  become: true
  gather_facts: true
  tags: [pbs, pbs_root_password_rotation]
  vars:
    pbs_root_password_rotation_role_id: >-
      {{ hostvars['localhost'].pbs_root_rot_role_id.data.data.role_id }}
    pbs_root_password_rotation_bootstrap_vault_token: >-
      {{ lookup('env', 'VAULT_TOKEN') }}
  roles:
    - role: pbs_root_password_rotation
