---
# Hardens the Active Directory Default Domain Password Policy for
# myrobertson.net. Addresses two live security findings:
#
#   * ADDomainLockoutThresholdDisabled  - live LockoutThreshold = 0 (no lockout)
#   * ADDomainMinPasswordLengthWeak      - live MinPasswordLength = 7
#
# The Default Domain Password Policy is a single, domain-wide object. Changing
# it has domain-wide blast radius, so this playbook is written to be run later,
# under explicit sign-off, after the read-only pre-flight audit has passed.
#
# The policy is always written through the PDC emulator, which owns the
# authoritative copy of the Default Domain Policy (currently
# rhonda.myrobertson.net). The WinRM connection may land on any writable DC
# (dc1 by default); the change itself is directed at the PDCe with -Server.
#
# Idempotent: it reads the current policy, changes only the attributes that
# differ, and re-reads to verify. A second run makes no change.
#
# Values this playbook SETS (desired) and their ROLLBACK values (the live
# pre-change state, captured on dc1 2026-07-29):
#
#     Attribute                    Desired (set)   Rollback (restore)
#     ---------------------------  -------------   ------------------
#     MinPasswordLength            14              7
#     LockoutThreshold             10              0
#     LockoutDuration              15 minutes      30 minutes
#     LockoutObservationWindow     15 minutes      30 minutes
#
# To roll back, re-run with the four pwpol_* vars overridden to the rollback
# values above, e.g.:
#   -e 'pwpol_min_password_length=7 pwpol_lockout_threshold=0
#       pwpol_lockout_duration_minutes=30 pwpol_lockout_observation_minutes=30'
#
# The following live attributes are already compliant and are deliberately
# LEFT UNCHANGED: ComplexityEnabled=true, PasswordHistoryCount=24,
# MinPasswordAge=1 day, MaxPasswordAge=42 days.
#
# Run (only with sign-off; do NOT run as part of the audit):
#   export WINPW="$(...vault read windows/domain/ldap password...)"
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES .venv/bin/ansible-playbook -f 1 \
#     -i inventory/environments/production.ini \
#     ansible/domain/harden_default_domain_password_policy.yml \
#     -e @"$SP/winpw.extravars.yml"
#
- name: Harden the Default Domain Password Policy (write via PDC emulator)
  hosts: "{{ harden_password_policy_hosts | default('domain_controllers_windows[0]') }}"
  gather_facts: false

  vars:
    # Desired policy. Override any of these to change the target or to roll back.
    pwpol_min_password_length: 14
    pwpol_lockout_threshold: 10
    pwpol_lockout_duration_minutes: 15
    pwpol_lockout_observation_minutes: 15

    # PDC emulator that owns the authoritative Default Domain Policy. Leave
    # empty to auto-discover via (Get-ADDomain).PDCEmulator; currently resolves
    # to rhonda.myrobertson.net.
    pwpol_pdc_emulator: ""

  pre_tasks:
    - name: Validate desired policy inputs
      ansible.builtin.assert:
        that:
          - pwpol_min_password_length | int >= 1
          - pwpol_lockout_threshold | int >= 0
          - pwpol_lockout_duration_minutes | int >= pwpol_lockout_observation_minutes | int
          - pwpol_lockout_observation_minutes | int >= 1
        fail_msg: >-
          Invalid policy inputs. LockoutDuration must be >= LockoutObservationWindow
          and the observation window must be at least 1 minute.
      tags: [preflight]

    - name: Ensure the Active Directory PowerShell module is available
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name ActiveDirectory)) {
            throw 'ActiveDirectory PowerShell module is not available on this host.'
          }
          Write-Output 'ActiveDirectory module available'
      changed_when: false
      tags: [preflight]

  tasks:
    - name: Read the current Default Domain Password Policy (rollback baseline)
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $pdc = {{ pwpol_pdc_emulator | to_json }}
          if ([string]::IsNullOrWhiteSpace($pdc)) { $pdc = (Get-ADDomain).PDCEmulator }
          $domainDn = (Get-ADDomain -Server $pdc).DistinguishedName
          $p = Get-ADDefaultDomainPasswordPolicy -Identity $domainDn -Server $pdc

          # Record the live values so the run log preserves a rollback baseline.
          [pscustomobject]@{
            PDCEmulator                 = [string]$pdc
            MinPasswordLength           = [int]$p.MinPasswordLength
            LockoutThreshold            = [int]$p.LockoutThreshold
            LockoutDurationMin          = [int]$p.LockoutDuration.TotalMinutes
            LockoutObservationWindowMin = [int]$p.LockoutObservationWindow.TotalMinutes
            ComplexityEnabled           = [bool]$p.ComplexityEnabled
            PasswordHistoryCount        = [int]$p.PasswordHistoryCount
            MinPasswordAgeDays          = [int]$p.MinPasswordAge.TotalDays
            MaxPasswordAgeDays          = [int]$p.MaxPasswordAge.TotalDays
          }
      changed_when: false
      register: pwpol_current
      tags: [read, rollback]

    - name: Show the pre-change policy (rollback baseline)
      ansible.builtin.debug:
        var: pwpol_current.output
      tags: [read, rollback]

    - name: Apply the hardened policy via the PDC emulator (only what differs)
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $pdc = {{ pwpol_pdc_emulator | to_json }}
          if ([string]::IsNullOrWhiteSpace($pdc)) { $pdc = (Get-ADDomain).PDCEmulator }
          $domainDn = (Get-ADDomain -Server $pdc).DistinguishedName

          $desiredMinLen    = [int]{{ pwpol_min_password_length | int }}
          $desiredThreshold = [int]{{ pwpol_lockout_threshold | int }}
          $desiredDuration  = [timespan]::FromMinutes({{ pwpol_lockout_duration_minutes | int }})
          $desiredObs       = [timespan]::FromMinutes({{ pwpol_lockout_observation_minutes | int }})

          # AD rejects a lockout duration shorter than the observation window.
          if ($desiredDuration -lt $desiredObs) {
            throw 'LockoutDuration must be greater than or equal to LockoutObservationWindow.'
          }

          $current = Get-ADDefaultDomainPasswordPolicy -Identity $domainDn -Server $pdc

          $params = @{}
          if ([int]$current.MinPasswordLength -ne $desiredMinLen) {
            $params['MinPasswordLength'] = $desiredMinLen
          }
          if ([int]$current.LockoutThreshold -ne $desiredThreshold) {
            $params['LockoutThreshold'] = $desiredThreshold
          }
          if ($current.LockoutDuration -ne $desiredDuration) {
            $params['LockoutDuration'] = $desiredDuration
          }
          if ($current.LockoutObservationWindow -ne $desiredObs) {
            $params['LockoutObservationWindow'] = $desiredObs
          }

          if ($params.Count -gt 0) {
            Set-ADDefaultDomainPasswordPolicy -Identity $domainDn -Server $pdc @params
            Write-Output ("Changed=True; via PDCe {0}; updated: {1}" -f `
              $pdc, (($params.Keys | Sort-Object) -join ', '))
          }
          else {
            Write-Output ("Changed=False; via PDCe {0}; already compliant" -f $pdc)
          }
      register: pwpol_apply
      changed_when: "'Changed=True' in pwpol_apply.output[0]"
      tags: [apply]

    - name: Show the apply result
      ansible.builtin.debug:
        var: pwpol_apply.output
      tags: [apply]

    - name: Verify the policy now matches the desired hardened values
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $pdc = {{ pwpol_pdc_emulator | to_json }}
          if ([string]::IsNullOrWhiteSpace($pdc)) { $pdc = (Get-ADDomain).PDCEmulator }
          $domainDn = (Get-ADDomain -Server $pdc).DistinguishedName
          $p = Get-ADDefaultDomainPasswordPolicy -Identity $domainDn -Server $pdc

          [pscustomobject]@{
            MinPasswordLength           = [int]$p.MinPasswordLength
            LockoutThreshold            = [int]$p.LockoutThreshold
            LockoutDurationMin          = [int]$p.LockoutDuration.TotalMinutes
            LockoutObservationWindowMin = [int]$p.LockoutObservationWindow.TotalMinutes
          }
      changed_when: false
      register: pwpol_verify
      tags: [verify]

    - name: Assert the hardened policy is in effect
      ansible.builtin.assert:
        that:
          - pwpol_verify.output[0].MinPasswordLength | int == pwpol_min_password_length | int
          - pwpol_verify.output[0].LockoutThreshold | int == pwpol_lockout_threshold | int
          - pwpol_verify.output[0].LockoutDurationMin | int == pwpol_lockout_duration_minutes | int
          - >-
            pwpol_verify.output[0].LockoutObservationWindowMin | int
            == pwpol_lockout_observation_minutes | int
        fail_msg: >-
          Default Domain Password Policy did not converge to the desired values:
          {{ pwpol_verify.output }}
        success_msg: >-
          Default Domain Password Policy hardened: MinPasswordLength=
          {{ pwpol_min_password_length }}, LockoutThreshold=
          {{ pwpol_lockout_threshold }}, LockoutDuration=
          {{ pwpol_lockout_duration_minutes }}m, LockoutObservationWindow=
          {{ pwpol_lockout_observation_minutes }}m.
      tags: [verify]
