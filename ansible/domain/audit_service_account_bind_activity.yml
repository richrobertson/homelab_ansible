---
# Measure whether a service account is still authenticating, across EVERY domain
# controller, without trusting the inventory to know what the domain controllers
# are.
#
# WHY THIS EXISTS
#
# On 2026-08-03 the ldap@myrobertson.net retirement was nearly signed off on a
# measurement that silently covered two DCs out of three. The inventory group
# `domain_controllers_windows` listed dc1 and rhonda; dns01 is a READ-ONLY domain
# controller that services LDAP binds perfectly well, but it was filed under
# `dhcp_partner_windows` and so appeared in no bind audit at all. It happened to
# be clean. That was luck, not method - a single bind there would have been
# invisible, and the account would have been disabled while still in use.
#
# So this playbook does not ask the inventory which hosts are DCs. Play 1 asks
# Active Directory via Get-ADDomainController and add_host's the result into a
# dynamic group; play 2 queries each of those over WinRM. Joining a DC to the
# domain is therefore enough for it to be audited - nobody has to remember to
# update an inventory group. That matters especially because
# inventory/environments/*.ini is gitignored, so a grouping fix made there does
# not travel to another machine.
#
# Querying each DC over WinRM rather than Get-WinEvent -ComputerName is
# deliberate: the RPC the -ComputerName form needs is not open between these DCs
# ("The RPC server is unavailable" from dc1 to both rhonda and dns01), while
# WinRM is already how every other play here reaches them.
#
# WHY THE SECURITY LOG AND NOT THE OBVIOUS ALTERNATIVES
#
#   - lastLogonTimestamp replicates lazily (9-14 days): a good negative signal,
#     a poor positive one.
#   - lastLogon is exact but per-DC and not replicated, and does not reliably
#     advance for LDAP simple binds at all. Measured: ldap@ read as days-idle by
#     every one of these attributes while doing ~1,800 binds/day.
#   - Directory Service event 2889 ("16 LDAP Interface Events") fires only for
#     UNSIGNED or CLEARTEXT simple binds. Consumers here use StartTLS on 389 or
#     LDAPS on 636 and produce no 2889 at all. The retirement runbook describes
#     2889 as logging "every simple bind"; that is untrue for TLS-protected binds
#     and following it yields a confident, wrong zero.
#
# Security 4624/4776 filtered on the STRUCTURED TargetUserName field is what
# actually catches these; it is verified to detect StartTLS simple binds. Do not
# substitute a regex over the rendered event Message - that matches unrelated
# fields (authentication package, workstation, process path) and inflated the
# count by ~35% when first tried.
#
# USAGE
#
#   ansible-playbook -i inventory/environments/production.ini \
#     ansible/domain/audit_service_account_bind_activity.yml \
#     -e '{"asba_accounts":["ldap"]}' -e asba_days=14
#
# Read-only. Changes nothing in AD or on any DC.

- name: Discover domain controllers from Active Directory
  hosts: domain_controllers_windows[0]
  gather_facts: false
  tasks:
    - name: Ask AD for the authoritative domain controller list
      ansible.windows.win_powershell:
        script: |
          Get-ADDomainController -Filter * |
            Select-Object Name, HostName, IPv4Address, IsReadOnly
      register: asba_dcs

    - name: Add every discovered DC to a dynamic group
      # Connection settings are inherited from the host this play ran against, so
      # the credentials stay in group_vars and are not restated here.
      ansible.builtin.add_host:
        name: "{{ item.HostName }}"
        groups: asba_discovered_dcs
        ansible_host: "{{ item.IPv4Address }}"
        asba_dc_name: "{{ item.Name }}"
        asba_dc_readonly: "{{ item.IsReadOnly }}"
        ansible_connection: "{{ hostvars[inventory_hostname].ansible_connection | default('winrm') }}"
        ansible_port: "{{ hostvars[inventory_hostname].ansible_port | default(5985) }}"
        ansible_winrm_scheme: "{{ hostvars[inventory_hostname].ansible_winrm_scheme | default('http') }}"
        ansible_winrm_transport: "{{ hostvars[inventory_hostname].ansible_winrm_transport | default('ntlm') }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_user: "{{ hostvars[inventory_hostname].ansible_user }}"
        ansible_password: "{{ hostvars[inventory_hostname].ansible_password }}"
      loop: "{{ asba_dcs.output }}"
      loop_control:
        label: "{{ item.Name }} ({{ item.IPv4Address }}){{ ' [RODC]' if item.IsReadOnly else '' }}"
      changed_when: false
      no_log: true      # the loop would otherwise echo ansible_password

    - name: Report what was discovered
      ansible.builtin.debug:
        msg: >-
          {{ asba_dcs.output | length }} domain controllers:
          {{ asba_dcs.output | map(attribute='Name') | join(', ') }}
          (read-only: {{ asba_dcs.output | selectattr('IsReadOnly') | map(attribute='Name') | join(', ') | default('none', true) }})

- name: Query the Security log on every discovered domain controller
  hosts: asba_discovered_dcs
  gather_facts: false

  vars:
    asba_accounts:
      - ldap
    # The retirement runbook requires 14 clean days before an account may be
    # disabled: that exceeds the lastLogonTimestamp replication window, so the
    # attribute gets a full cycle to reveal a use it might have been hiding.
    asba_days: 14
    # A control account known to be active. Without it, a typo in an account name
    # is indistinguishable from a clean result.
    asba_control_account: svc-nextcloud-ldap

  tasks:
    - name: Count authentication events per account
      ansible.windows.win_powershell:
        parameters:
          Accounts: "{{ asba_accounts + [asba_control_account] }}"
          Days: "{{ asba_days | int }}"
        script: |
          param([string[]]$Accounts, [int]$Days)
          $ErrorActionPreference = 'Continue'
          $ms = $Days * 24 * 60 * 60 * 1000
          $out = foreach ($acct in $Accounts) {
            # Server-side XPath on the structured EventData field. This cannot
            # match the account name against an unrelated field the way a regex
            # over the rendered Message can.
            $x = "*[System[TimeCreated[timediff(@SystemTime) <= $ms] and " +
                 "(EventID=4624 or EventID=4768 or EventID=4769 or EventID=4776)]] " +
                 "and *[EventData[Data[@Name='TargetUserName']='$acct']]"
            $ev = @()
            try { $ev = @(Get-WinEvent -LogName Security -FilterXPath $x -ErrorAction Stop) }
            catch { if ($_.Exception.Message -notmatch 'No events were found') { throw } }

            $last = if ($ev.Count) {
                      ($ev | Sort-Object TimeCreated -Descending |
                        Select-Object -First 1).TimeCreated.ToString('yyyy-MM-dd HH:mm:ss')
                    } else { 'none' }
            $srcs = (@($ev) | ForEach-Object {
                       (([xml]$_.ToXml()).Event.EventData.Data |
                          Where-Object Name -eq 'IpAddress').'#text'
                     } | Where-Object { $_ -and $_ -ne '-' -and $_ -ne '::1' } |
                     Sort-Object -Unique) -join ', '
            [pscustomobject]@{ Account=$acct; Count=@($ev).Count; Last=$last; Sources=$srcs }
          }
          $out
      register: asba_res

    - name: Per-DC result
      ansible.builtin.debug:
        msg: |
          {{ asba_dc_name }}{{ ' [RODC]' if asba_dc_readonly | bool else '' }} - {{ asba_days }} day window
          {% for r in asba_res.output %}
            {{ '%-22s' | format(r.Account) }} {{ '%6d' | format(r.Count) }}  last={{ r.Last }}  {{ r.Sources }}
          {% endfor %}

    # A control account reporting zero means the query is broken, and a zero for
    # the audited account is meaningless rather than reassuring.
    - name: Fail if the control account shows no activity on any DC
      ansible.builtin.assert:
        that:
          - (asba_res.output | selectattr('Account', 'equalto', asba_control_account)
             | map(attribute='Count') | sum) > 0
        fail_msg: >-
          Control account {{ asba_control_account }} reported zero binds on
          {{ asba_dc_name }} over {{ asba_days }} days. Either it is genuinely
          inactive - pick a different control - or the query is not working, in
          which case no conclusion may be drawn about {{ asba_accounts | join(', ') }}.
        success_msg: >-
          Control {{ asba_control_account }} shows activity on {{ asba_dc_name }};
          the query works there.
      # Bind traffic is not evenly spread across DCs - rhonda carries ~13x dc1 -
      # so a control legitimately reads zero on a quiet DC. Report rather than
      # abort, and judge the control on the domain-wide total below.
      ignore_errors: true
      register: asba_control_check

- name: Summarise
  hosts: domain_controllers_windows[0]
  gather_facts: false
  vars:
    asba_accounts:
      - ldap
    asba_control_account: svc-nextcloud-ldap
  tasks:
    - name: Domain-wide totals
      ansible.builtin.debug:
        msg: |
          DCs queried: {{ groups['asba_discovered_dcs'] | length }}
          {% for acct in asba_accounts + [asba_control_account] %}
          {{ '%-24s' | format(acct) }} total={{ groups['asba_discovered_dcs']
             | map('extract', hostvars, ['asba_res','output'])
             | map('selectattr','Account','equalto',acct) | map('map',attribute='Count')
             | map('sum') | sum }}
          {% endfor %}

    # The whole point of the playbook: a DC that was not queried must never be
    # reported as a clean one.
    - name: Assert every discovered DC was actually queried
      ansible.builtin.assert:
        that:
          - groups['asba_discovered_dcs'] | length ==
            groups['asba_discovered_dcs'] | map('extract', hostvars, ['asba_res','output'])
            | select('defined') | list | length
        fail_msg: >-
          At least one discovered domain controller produced no result, so this
          audit is INCOMPLETE and must not be used to justify disabling an account.
        success_msg: >-
          All {{ groups['asba_discovered_dcs'] | length }} discovered domain
          controllers returned results.
