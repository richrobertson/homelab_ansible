---
# Let Keycloak change a human user's Active Directory password on their behalf.
#
#   # report only - shows who would gain the delegation. Default.
#   ansible-playbook -i inventory/environments/production.ini \
#     ansible/domain/delegate_keycloak_password_reset.yml
#
#   # apply
#   ansible-playbook ... -e kpr_confirm=true
#
# THE SYMPTOM
#
# Keycloak's "Update password" screen fails with:
#   Could not modify attribute for DN [CN=Rich Robertson,CN=Users,DC=myrobertson,DC=net]
#
# Keycloak federates users from AD and writes password changes back over LDAPS
# as keycloak-ldap. That write is an administrative reset, not a self-service
# change, so the SELF ACE every user carries does not authorise it - the bind
# account itself needs the right.
#
# THE CAUSE
#
# The delegation exists, but only on OU=Family:
#
#   OU=Family,DC=myrobertson,DC=net
#     keycloak-ldap  ExtendedRight  Reset Password    (Descendents)
#     keycloak-ldap  ExtendedRight  Change Password   (Descendents)
#     keycloak-ldap  WriteProperty  pwdLastSet        (Descendents)
#   CN=Users,DC=myrobertson,DC=net
#     (no keycloak-ldap ACEs at all)
#
# stella lives in OU=Family and inherits it, so her password change works. rich,
# roy, david and renae live in CN=Users, inherit nothing, and fail.
#
# WHY THIS IS PER-OBJECT AND NOT A CONTAINER DELEGATION
#
# Granting the same rights on CN=Users would be the obvious fix and would be a
# privilege escalation path. That container also holds, with inheritance NOT
# blocked and therefore in scope of any container-level ACE:
#
#   netsvc          privileged through DnsAdmins - a documented path to SYSTEM
#                   on a domain controller
#   krbtgt_12069    the RODC krbtgt
#   svc-syno-admin, svc-syno-repl, oidc-test, Guest
#
# Compromising the Keycloak bind account would then mean: reset netsvc, inherit
# DnsAdmins, own a DC. The genuinely privileged accounts in CN=Users
# (Administrator, krbtgt, ldap, synbackup, rich-super, roy-super) are safe from
# this because AdminSDHolder keeps inheritance blocked on them - but the four
# above are not, and that is enough to rule the container approach out.
#
# So the delegation is written directly onto each named human account. Adding a
# person here is then a deliberate, reviewable act rather than a side effect of
# where their object happens to live.
#
# THE ALTERNATIVE, IF YOU PREFER IT
#
# Moving the human users into OU=Family would make them inherit the existing
# delegation and need no new ACEs at all. That is arguably cleaner, since
# OU=Family is evidently the intended home for people, but it changes GPO scope
# and anything that filters on DN, so it is a bigger change than it looks.

- name: Delegate password reset to Keycloak for human accounts
  hosts: "{{ kpr_host | default('domain_controllers_windows[0]') }}"
  gather_facts: false

  vars:
    kpr_confirm: false
    kpr_bind_account: keycloak-ldap
    # Human accounts that authenticate through Keycloak and must be able to
    # change their own password from its account console. Service accounts are
    # deliberately absent: they are rotated by automation, never interactively.
    #
    # david and renae were here and have been removed - both are leavers, and
    # their AD accounts are already disabled. A disabled account has no reason to
    # let a federation bind account reset its password, so the play now revokes
    # the delegation from anyone not listed here rather than only ever adding.
    # Removing a name is therefore sufficient to offboard; nobody has to remember
    # to go and strip the ACE by hand.
    kpr_users:
      - rich
      - roy

    # Accounts to actively check for and strip a stale delegation from. Kept
    # explicit rather than scanning the directory: a play that walks every user
    # and removes ACEs is a much larger blast radius than one that revokes from a
    # named list, and this is a security-sensitive edit either way.
    kpr_revoke_users:
      - david
      - renae

  tasks:
    - name: Read the current delegation state
      ansible.windows.win_powershell:
        script: |
          param([string[]]$Users, [string]$Bind)
          Import-Module ActiveDirectory
          # Extended-right and property GUIDs, spelled out so the intent is
          # readable rather than four opaque UUIDs.
          $RESET  = '00299570-246d-11d0-a768-00aa006e0529'  # Reset Password
          $CHANGE = 'ab721a53-1e2f-11d0-9819-00aa0040529b'  # Change Password
          $PWDLS  = 'bf967a0a-0de6-11d0-a285-00aa003049e2'  # pwdLastSet
          $out = foreach ($u in $Users) {
            $usr = Get-ADUser -Identity $u -Properties DistinguishedName,adminCount -ErrorAction SilentlyContinue
            if ($null -eq $usr) {
              [pscustomobject]@{ name=$u; exists=$false; has_reset=$false; has_change=$false; has_pwdlastset=$false; admin_count=0; inheritance_blocked=$false }
              continue
            }
            $acl = Get-Acl -Path ("AD:" + $usr.DistinguishedName)
            $mine = $acl.Access | Where-Object { $_.IdentityReference -like "*\$Bind" }
            [pscustomobject]@{
              name                = $usr.SamAccountName
              exists              = $true
              admin_count         = if ($null -eq $usr.adminCount) { 0 } else { $usr.adminCount }
              inheritance_blocked = [bool]$acl.AreAccessRulesProtected
              has_reset           = [bool]($mine | Where-Object { $_.ObjectType -eq $RESET })
              has_change          = [bool]($mine | Where-Object { $_.ObjectType -eq $CHANGE })
              has_pwdlastset      = [bool]($mine | Where-Object { $_.ObjectType -eq $PWDLS })
            }
          }
          $out
        parameters:
          Users: "{{ kpr_users }}"
          Bind: "{{ kpr_bind_account }}"
      register: kpr_state
      changed_when: false
      check_mode: false

    # An account AdminSDHolder protects must never be given this. SDProp would
    # strip the ACE within the hour anyway, so it would look like it worked and
    # then silently stop working - but the real objection is that a privileged
    # account should not be resettable by a federation bind account at all.
    - name: Refuse to delegate over any privileged account
      ansible.builtin.assert:
        that:
          - kpr_state.output | selectattr('admin_count', 'greaterthan', 0) | list | length == 0
        fail_msg: >-
          {{ kpr_state.output | selectattr('admin_count', 'greaterthan', 0)
             | map(attribute='name') | join(', ') }} carries adminCount and is
          protected by AdminSDHolder. Delegating password reset over a privileged
          account to a federation bind account is a privilege escalation path,
          and SDProp would remove the ACE within the hour regardless. Remove the
          account from kpr_users, or demote it first.

    - name: Report what would change
      ansible.builtin.debug:
        msg: >-
          {% for u in kpr_state.output %}
          {{ u.name }}: {{ 'ABSENT from AD' if not u.exists else
             ('already delegated' if (u.has_reset and u.has_change and u.has_pwdlastset)
              else 'would gain reset/change/pwdLastSet for ' ~ kpr_bind_account) }}.
          {% endfor %}
          {{ 'REPORT ONLY - nothing will change. Re-run with -e kpr_confirm=true.'
             if not (kpr_confirm | bool) else 'CONFIRMED - applying.' }}

    - name: Stop here unless explicitly confirmed
      ansible.builtin.meta: end_play
      when: not (kpr_confirm | bool)

    - name: Grant password-reset delegation on each account
      ansible.windows.win_powershell:
        script: |
          param([string]$User, [string]$Bind)
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          $RESET  = [guid]'00299570-246d-11d0-a768-00aa006e0529'
          $CHANGE = [guid]'ab721a53-1e2f-11d0-9819-00aa0040529b'
          $PWDLS  = [guid]'bf967a0a-0de6-11d0-a285-00aa003049e2'

          $usr = Get-ADUser -Identity $User -Properties DistinguishedName
          $path = "AD:" + $usr.DistinguishedName
          $sid  = (Get-ADUser -Identity $Bind).SID
          $acl  = Get-Acl -Path $path
          $added = @()

          function Need($acl, $sid, $right, $objGuid) {
            -not ($acl.Access | Where-Object {
              $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]) -eq $sid -and
              $_.ObjectType -eq $objGuid -and $_.AccessControlType -eq 'Allow'
            })
          }

          # None of these are inheritable: the ACE is placed on the user object
          # itself, so it cannot leak to anything else in the container.
          foreach ($spec in @(
            @{ right='ExtendedRight'; guid=$RESET;  label='ResetPassword' },
            @{ right='ExtendedRight'; guid=$CHANGE; label='ChangePassword' },
            @{ right='WriteProperty'; guid=$PWDLS;  label='pwdLastSet' }
          )) {
            if (Need $acl $sid $spec.right $spec.guid) {
              $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
                $sid,
                [System.DirectoryServices.ActiveDirectoryRights]::($spec.right),
                [System.Security.AccessControl.AccessControlType]::Allow,
                $spec.guid,
                [System.DirectoryServices.ActiveDirectorySecurityInheritance]::None)
              $acl.AddAccessRule($ace)
              $added += $spec.label
            }
          }

          if ($added.Count -gt 0) {
            Set-Acl -Path $path -AclObject $acl
            "GRANTED $User : $($added -join ', ')"
          } else {
            "NOOP $User already delegated"
          }
        parameters:
          User: "{{ item }}"
          Bind: "{{ kpr_bind_account }}"
      loop: "{{ kpr_state.output | selectattr('exists') | map(attribute='name') | list }}"
      register: kpr_apply

    # Re-read rather than trusting Set-Acl. An ACL write can succeed and still
    # not produce the ACE you meant if the GUID or inheritance flag is wrong.
    - name: Verify the delegation landed
      ansible.windows.win_powershell:
        script: |
          param([string[]]$Users, [string]$Bind)
          Import-Module ActiveDirectory
          $RESET  = '00299570-246d-11d0-a768-00aa006e0529'
          $CHANGE = 'ab721a53-1e2f-11d0-9819-00aa0040529b'
          $PWDLS  = 'bf967a0a-0de6-11d0-a285-00aa003049e2'
          foreach ($u in $Users) {
            $usr = Get-ADUser -Identity $u -Properties DistinguishedName
            $acl = Get-Acl -Path ("AD:" + $usr.DistinguishedName)
            $mine = $acl.Access | Where-Object { $_.IdentityReference -like "*\$Bind" }
            [pscustomobject]@{
              name  = $usr.SamAccountName
              reset = [bool]($mine | Where-Object { $_.ObjectType -eq $RESET })
              change= [bool]($mine | Where-Object { $_.ObjectType -eq $CHANGE })
              pwdls = [bool]($mine | Where-Object { $_.ObjectType -eq $PWDLS })
            }
          }
        parameters:
          Users: "{{ kpr_state.output | selectattr('exists') | map(attribute='name') | list }}"
          Bind: "{{ kpr_bind_account }}"
      register: kpr_verify
      changed_when: false

    # Offboarding. Runs whether or not the account still exists, and is a no-op
    # when there is nothing to remove, so a leaver can be left in
    # kpr_revoke_users indefinitely as a standing assertion.
    - name: Revoke the delegation from accounts that should no longer have it
      ansible.windows.win_powershell:
        script: |
          param([string]$User, [string]$Bind)
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          $usr = Get-ADUser -Identity $User -Properties DistinguishedName,Enabled -ErrorAction SilentlyContinue
          if ($null -eq $usr) { "ABSENT $User"; return }
          $path = "AD:" + $usr.DistinguishedName
          $sid  = (Get-ADUser -Identity $Bind).SID
          $acl  = Get-Acl -Path $path
          # Only ACEs granted directly to the bind account on this object are
          # touched. Inherited ACEs cannot be removed here anyway, and removing
          # anything belonging to another principal would be well outside what
          # this play is for.
          $mine = $acl.Access | Where-Object {
            $_.IsInherited -eq $false -and
            $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]) -eq $sid
          }
          if (-not $mine) { "NOOP $User has no direct $Bind delegation"; return }
          foreach ($ace in $mine) { [void]$acl.RemoveAccessRule($ace) }
          Set-Acl -Path $path -AclObject $acl
          $left = (Get-Acl -Path $path).Access | Where-Object {
            $_.IsInherited -eq $false -and
            $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]) -eq $sid
          }
          if ($left) { throw "$User still holds a direct $Bind ACE after removal" }
          "REVOKED $User (enabled=$($usr.Enabled)) : removed $($mine.Count) direct ACE(s)"
        parameters:
          User: "{{ item }}"
          Bind: "{{ kpr_bind_account }}"
      loop: "{{ kpr_revoke_users | default([]) }}"
      register: kpr_revoked

    - name: Report the revocations
      ansible.builtin.debug:
        msg: >-
          {{ (kpr_revoked.results | default([])) | rejectattr('skipped', 'defined')
             | map(attribute='output') | flatten | join('; ') | default('nothing to revoke', true) }}

    - name: Require every account to hold all three rights
      ansible.builtin.assert:
        that:
          - kpr_verify.output | rejectattr('reset') | list | length == 0
          - kpr_verify.output | rejectattr('change') | list | length == 0
          - kpr_verify.output | rejectattr('pwdls') | list | length == 0
        fail_msg: >-
          Delegation incomplete:
          {{ kpr_verify.output | rejectattr('reset') | map(attribute='name') | join(', ') | default('-', true) }}
          missing ResetPassword;
          {{ kpr_verify.output | rejectattr('change') | map(attribute='name') | join(', ') | default('-', true) }}
          missing ChangePassword;
          {{ kpr_verify.output | rejectattr('pwdls') | map(attribute='name') | join(', ') | default('-', true) }}
          missing pwdLastSet.
        success_msg: >-
          {{ (kpr_apply.results | default([])) | rejectattr('skipped', 'defined')
             | map(attribute='output') | flatten | join('; ') }}.
          Verified reset/change/pwdLastSet present for
          {{ kpr_verify.output | map(attribute='name') | join(', ') }}.
