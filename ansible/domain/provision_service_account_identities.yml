---
# Provisions the least-privilege service identities that replace
# ldap@myrobertson.net. See runbooks/security/ldap-account-retirement.md.
#
# This playbook is idempotent and additive. It never deletes or disables the
# legacy `ldap` account: decommissioning is a separate, deliberate step in the
# runbook so that both credentials are valid concurrently during cutover.
#
# Passwords are read from Vault. Nothing in this file, and nothing it prints,
# contains a credential.
- name: Provision least-privilege Active Directory service identities
  hosts: domain_controllers_windows[0]
  gather_facts: false

  vars:
    sai_base_dn: DC=myrobertson,DC=net
    sai_service_ou: Service Accounts
    sai_bind_ou: Bind
    sai_automation_ou: Automation

    # Container that holds the read-only bind tier. Vault's LDAP secrets engine
    # manager is scoped to exactly this DN and no wider.
    sai_bind_ou_dn: "OU={{ sai_bind_ou }},OU={{ sai_service_ou }},{{ sai_base_dn }}"
    sai_automation_ou_dn: "OU={{ sai_automation_ou }},OU={{ sai_service_ou }},{{ sai_base_dn }}"

    # Delegation groups. Neither grants any right of its own; they exist only to
    # carry ACEs and Group Policy user-rights references, so that 15 attributes
    # x 2 containers are expressed once rather than once per account.
    sai_read_group: GG-Directory-Bind-Read
    sai_deny_logon_group: GG-Deny-Interactive-Logon

    # Containers the bind tier is permitted to read. Deliberately excludes
    # OU=Domain Controllers, CN=Computers, OU=Endpoints, CN=System,
    # CN=Configuration, CN=Managed Service Accounts and OU=Service Accounts.
    sai_read_scopes:
      - "CN=Users,{{ sai_base_dn }}"
      - "OU=Family,{{ sai_base_dn }}"

    # The attribute set every consumer was measured to read. Verified against
    # the live Authelia, Nextcloud, Keycloak, Vault, Proxmox VE and PBS
    # configurations on 2026-07-29.
    sai_read_user_attributes:
      - objectClass
      - cn
      - name
      - distinguishedName
      - sAMAccountName
      - sAMAccountType
      - userPrincipalName
      - mail
      - displayName
      - givenName
      - sn
      - memberOf
      - userAccountControl
      - objectGUID
      - objectSid
    sai_read_group_attributes:
      - objectClass
      - cn
      - name
      - distinguishedName
      - sAMAccountName
      - member
      - memberOf
      - objectGUID
      - objectSid

    # Read-only directory bind accounts. None is a member of any privileged
    # group; each ends up with adminCount=0 and no servicePrincipalName.
    sai_bind_accounts:
      - name: svc-vault-ldap
        display_name: Vault LDAP Auth Bind
        description: Bind account for the Vault ldap/ auth method. Read-only.
        vault_path: windows/domain/service-accounts/svc-vault-ldap
      - name: svc-nextcloud-ldap
        display_name: Nextcloud LDAP Bind (prod)
        description: Bind account for Nextcloud production user directory. Read-only.
        vault_path: windows/domain/service-accounts/svc-nextcloud-ldap
      - name: svc-nextcloud-ldap-stg
        display_name: Nextcloud LDAP Bind (staging)
        description: Bind account for Nextcloud staging user directory. Read-only.
        vault_path: windows/domain/service-accounts/svc-nextcloud-ldap-stg
      - name: svc-pve-ldap
        display_name: Proxmox VE Realm Bind
        description: Bind account for the Proxmox VE myrobertson AD realm. Read-only.
        vault_path: windows/domain/service-accounts/svc-pve-ldap
      - name: svc-pbs-ldap
        display_name: Proxmox Backup Server Realm Bind
        description: Bind account for the PBS myrobertson.net AD realm. Read-only.
        vault_path: windows/domain/service-accounts/svc-pbs-ldap
      - name: svc-authelia-ldap
        display_name: Authelia LDAP Bind (interim)
        description: >-
          Interim bind account for Authelia. Delete when Authelia is
          decommissioned in favour of Keycloak. Read-only.
        vault_path: windows/domain/service-accounts/svc-authelia-ldap

    # Write-capable or otherwise elevated automation identities. These are NOT
    # in the bind tier and are NOT reachable by the bind-tier Vault manager.
    sai_automation_accounts:
      - name: svc-vault-ldapmgr-bind
        display_name: Vault LDAP Secrets Manager (bind tier)
        description: >-
          Vault LDAP secrets engine manager. Resets passwords of accounts in
          OU=Bind only.
        vault_path: windows/domain/service-accounts/svc-vault-ldapmgr-bind
      - name: svc-tf-adcs
        display_name: Terraform AD CS Enrolment
        description: >-
          Terraform microsoftadcs provider. Enrol rights on named certificate
          templates only; no directory write.
        vault_path: windows/domain/service-accounts/svc-tf-adcs
      - name: svc-tf-dnsupdate
        display_name: Terraform DNS Dynamic Update
        description: >-
          Terraform dns provider (GSSAPI). Write access to delegated DNS zones
          only. Explicitly NOT a member of DnsAdmins.
        vault_path: windows/domain/service-accounts/svc-tf-dnsupdate
      - name: svc-ansible-ad
        display_name: Ansible AD Object Provisioning
        description: >-
          Creates and maintains objects under OU=Family and OU=Service Accounts.
          Not a Domain Admin.
        vault_path: windows/domain/service-accounts/svc-ansible-ad

    # The WinRM automation identity is deliberately declared apart from the
    # others. Configuring a domain controller's operating system is a Tier-0
    # action and cannot be reduced below it; see the runbook.
    sai_winrm_account:
      name: svc-ansible-win
      display_name: Ansible Windows Host Automation (Tier-0)
      description: >-
        WinRM automation for dc1, rhonda, dns01 and janice. Tier-0 identity.
        Restricted by userWorkstations and by denied logon rights.
      vault_path: windows/domain/service-accounts/svc-ansible-win
      workstations: DC1,RHONDA,DNS01,JANICE

    sai_manage_winrm_account: false

  pre_tasks:
    - name: Validate service identity inputs
      ansible.builtin.assert:
        that:
          - sai_base_dn | length > 0
          - sai_bind_accounts | length > 0
          - sai_read_scopes | length > 0
          - sai_read_user_attributes | length > 0
          - sai_bind_accounts | selectattr('vault_path', 'defined') | list | length
            == sai_bind_accounts | length
          - sai_automation_accounts | selectattr('vault_path', 'defined') | list | length
            == sai_automation_accounts | length
        fail_msg: >-
          Define sai_base_dn, sai_read_scopes, sai_read_user_attributes, and give
          every account in sai_bind_accounts and sai_automation_accounts a
          vault_path.

  tasks:
    - name: Ensure the Active Directory PowerShell module is available
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name ActiveDirectory)) {
            throw 'ActiveDirectory PowerShell module is not available on this host.'
          }
          Write-Output 'ActiveDirectory module available'
      changed_when: false
      tags: [preflight]

    - name: Ensure the service account tier organizational units exist
      loop:
        - name: "{{ sai_service_ou }}"
          path: "{{ sai_base_dn }}"
        - name: "{{ sai_bind_ou }}"
          path: "OU={{ sai_service_ou }},{{ sai_base_dn }}"
        - name: "{{ sai_automation_ou }}"
          path: "OU={{ sai_service_ou }},{{ sai_base_dn }}"
      loop_control:
        label: "OU={{ item.name }},{{ item.path }}"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $ouName = {{ item.name | to_json }}
          $ouPath = {{ item.path | to_json }}
          $existing = Get-ADOrganizationalUnit -LDAPFilter "(ou=$ouName)" `
            -SearchBase $ouPath -SearchScope OneLevel -ErrorAction SilentlyContinue

          if ($existing) {
            Write-Output 'Changed=False'
            exit 0
          }

          New-ADOrganizationalUnit -Name $ouName -Path $ouPath `
            -ProtectedFromAccidentalDeletion $true
          Write-Output 'Changed=True'
      register: sai_ou_result
      changed_when: "'Changed=True' in sai_ou_result.output"
      tags: [ou]

    - name: Ensure the delegation groups exist
      loop:
        - name: "{{ sai_read_group }}"
          description: >-
            Carries the read ACEs granted to directory bind accounts. Confers no
            privilege of its own.
        - name: "{{ sai_deny_logon_group }}"
          description: >-
            Referenced by Group Policy user-rights assignment to deny
            interactive, Remote Desktop and batch logon.
      loop_control:
        label: "{{ item.name }}"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $groupName = {{ item.name | to_json }}
          $groupDesc = {{ item.description | to_json }}
          $ouDn = {{ ('OU=' ~ sai_service_ou ~ ',' ~ sai_base_dn) | to_json }}
          $changed = $false

          $group = Get-ADGroup -LDAPFilter "(sAMAccountName=$groupName)" `
            -Properties description -ErrorAction SilentlyContinue
          if (-not $group) {
            New-ADGroup -Name $groupName -SamAccountName $groupName `
              -GroupScope Global -GroupCategory Security -Path $ouDn `
              -Description $groupDesc
            $changed = $true
          }
          elseif ($group.description -ne $groupDesc) {
            Set-ADGroup -Identity $group -Description $groupDesc
            $changed = $true
          }

          Write-Output "Changed=$changed"
      register: sai_group_result
      changed_when: "'Changed=True' in sai_group_result.output"
      tags: [groups]

    - name: Ensure the read-only directory bind accounts exist
      loop: "{{ sai_bind_accounts }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      vars:
        sai_password: >-
          {{ lookup('community.hashi_vault.vault_kv2_get', item.vault_path,
                    engine_mount_point='secret').secret.password }}
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $username = {{ item.name | to_json }}
          $password = {{ sai_password | to_json }}
          $displayName = {{ item.display_name | to_json }}
          $description = {{ item.description | to_json }}
          $targetOuDn = {{ sai_bind_ou_dn | to_json }}
          $upn = "$username@myrobertson.net"
          $changed = $false

          $props = @('userPrincipalName', 'displayName', 'description', 'Enabled',
            'PasswordNeverExpires', 'servicePrincipalName', 'adminCount')
          $user = Get-ADUser -LDAPFilter "(sAMAccountName=$username)" `
            -Properties $props -ErrorAction SilentlyContinue

          if (-not $user) {
            if (-not $password) {
              throw "Account $username does not exist and Vault returned no password."
            }
            New-ADUser `
              -SamAccountName $username `
              -Name $displayName `
              -DisplayName $displayName `
              -Description $description `
              -UserPrincipalName $upn `
              -Path $targetOuDn `
              -AccountPassword (ConvertTo-SecureString $password -AsPlainText -Force) `
              -Enabled $true `
              -PasswordNeverExpires $false `
              -CannotChangePassword $false
            $user = Get-ADUser -Identity $username -Properties $props
            $changed = $true
          }

          # Least-privilege invariants, reasserted on every run.
          if ($user.PasswordNeverExpires) {
            Set-ADUser -Identity $user -PasswordNeverExpires $false
            $changed = $true
          }
          if (-not $user.Enabled) {
            Enable-ADAccount -Identity $user
            $changed = $true
          }
          if ($user.DistinguishedName -notlike "*$targetOuDn") {
            Move-ADObject -Identity $user.DistinguishedName -TargetPath $targetOuDn
            $changed = $true
          }

          $replace = @{}
          if ($user.userPrincipalName -ne $upn) { $replace['userPrincipalName'] = $upn }
          if ($user.displayName -ne $displayName) { $replace['displayName'] = $displayName }
          if ($user.description -ne $description) { $replace['description'] = $description }
          if ($replace.Count -gt 0) {
            Set-ADUser -Identity $user -Replace $replace
            $changed = $true
          }

          Write-Output "Changed=$changed"
      register: sai_bind_account_result
      changed_when: "'Changed=True' in sai_bind_account_result.output"
      tags: [accounts, bind]

    - name: Ensure the write-capable automation accounts exist
      loop: "{{ sai_automation_accounts }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      vars:
        sai_password: >-
          {{ lookup('community.hashi_vault.vault_kv2_get', item.vault_path,
                    engine_mount_point='secret').secret.password }}
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $username = {{ item.name | to_json }}
          $password = {{ sai_password | to_json }}
          $displayName = {{ item.display_name | to_json }}
          $description = {{ item.description | to_json }}
          $targetOuDn = {{ sai_automation_ou_dn | to_json }}
          $upn = "$username@myrobertson.net"
          $changed = $false

          $props = @('userPrincipalName', 'displayName', 'description', 'Enabled',
            'PasswordNeverExpires')
          $user = Get-ADUser -LDAPFilter "(sAMAccountName=$username)" `
            -Properties $props -ErrorAction SilentlyContinue

          if (-not $user) {
            if (-not $password) {
              throw "Account $username does not exist and Vault returned no password."
            }
            New-ADUser `
              -SamAccountName $username `
              -Name $displayName `
              -DisplayName $displayName `
              -Description $description `
              -UserPrincipalName $upn `
              -Path $targetOuDn `
              -AccountPassword (ConvertTo-SecureString $password -AsPlainText -Force) `
              -Enabled $true `
              -PasswordNeverExpires $false
            $user = Get-ADUser -Identity $username -Properties $props
            $changed = $true
          }

          if ($user.PasswordNeverExpires) {
            Set-ADUser -Identity $user -PasswordNeverExpires $false
            $changed = $true
          }
          if (-not $user.Enabled) {
            Enable-ADAccount -Identity $user
            $changed = $true
          }
          if ($user.DistinguishedName -notlike "*$targetOuDn") {
            Move-ADObject -Identity $user.DistinguishedName -TargetPath $targetOuDn
            $changed = $true
          }

          $replace = @{}
          if ($user.userPrincipalName -ne $upn) { $replace['userPrincipalName'] = $upn }
          if ($user.displayName -ne $displayName) { $replace['displayName'] = $displayName }
          if ($user.description -ne $description) { $replace['description'] = $description }
          if ($replace.Count -gt 0) {
            Set-ADUser -Identity $user -Replace $replace
            $changed = $true
          }

          Write-Output "Changed=$changed"
      register: sai_automation_account_result
      changed_when: "'Changed=True' in sai_automation_account_result.output"
      tags: [accounts, automation]

    - name: Ensure the WinRM automation identity exists
      when: sai_manage_winrm_account | bool
      no_log: true
      vars:
        sai_password: >-
          {{ lookup('community.hashi_vault.vault_kv2_get',
                    sai_winrm_account.vault_path,
                    engine_mount_point='secret').secret.password }}
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $username = {{ sai_winrm_account.name | to_json }}
          $password = {{ sai_password | to_json }}
          $displayName = {{ sai_winrm_account.display_name | to_json }}
          $description = {{ sai_winrm_account.description | to_json }}
          $workstations = {{ sai_winrm_account.workstations | to_json }}
          $targetOuDn = {{ sai_automation_ou_dn | to_json }}
          $upn = "$username@myrobertson.net"
          $changed = $false

          $props = @('userPrincipalName', 'displayName', 'description', 'Enabled',
            'PasswordNeverExpires', 'userWorkstations')
          $user = Get-ADUser -LDAPFilter "(sAMAccountName=$username)" `
            -Properties $props -ErrorAction SilentlyContinue

          if (-not $user) {
            if (-not $password) {
              throw "Account $username does not exist and Vault returned no password."
            }
            New-ADUser `
              -SamAccountName $username `
              -Name $displayName `
              -DisplayName $displayName `
              -Description $description `
              -UserPrincipalName $upn `
              -Path $targetOuDn `
              -AccountPassword (ConvertTo-SecureString $password -AsPlainText -Force) `
              -Enabled $true `
              -PasswordNeverExpires $false
            $user = Get-ADUser -Identity $username -Properties $props
            $changed = $true
          }

          if ($user.PasswordNeverExpires) {
            Set-ADUser -Identity $user -PasswordNeverExpires $false
            $changed = $true
          }
          # userWorkstations is enforced for the NTLM and Kerberos logons WinRM
          # performs. It is NOT reliably enforced for LDAP simple binds, which
          # is why the bind tier does not set it.
          if ($user.userWorkstations -ne $workstations) {
            Set-ADUser -Identity $user -Replace @{ userWorkstations = $workstations }
            $changed = $true
          }
          if ($user.DistinguishedName -notlike "*$targetOuDn") {
            Move-ADObject -Identity $user.DistinguishedName -TargetPath $targetOuDn
            $changed = $true
          }

          Write-Output "Changed=$changed"
      register: sai_winrm_account_result
      changed_when: "'Changed=True' in sai_winrm_account_result.output"
      tags: [accounts, winrm]

    - name: Ensure bind accounts hold the read delegation group
      loop: "{{ sai_bind_accounts }}"
      loop_control:
        label: "{{ item.name }}"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $username = {{ item.name | to_json }}
          $groupName = {{ sai_read_group | to_json }}
          $user = Get-ADUser -Identity $username
          $group = Get-ADGroup -Identity $groupName
          $changed = $false

          $member = Get-ADGroupMember -Identity $group |
            Where-Object { $_.DistinguishedName -eq $user.DistinguishedName }
          if (-not $member) {
            Add-ADGroupMember -Identity $group -Members $user
            $changed = $true
          }

          Write-Output "Changed=$changed"
      register: sai_bind_group_result
      changed_when: "'Changed=True' in sai_bind_group_result.output"
      tags: [groups, bind]

    - name: Ensure every service identity is denied interactive logon
      loop: >-
        {{ (sai_bind_accounts | map(attribute='name') | list)
           + (sai_automation_accounts | map(attribute='name') | list) }}
      loop_control:
        label: "{{ item }}"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $username = {{ item | to_json }}
          $groupName = {{ sai_deny_logon_group | to_json }}
          $user = Get-ADUser -Identity $username
          $group = Get-ADGroup -Identity $groupName
          $changed = $false

          $member = Get-ADGroupMember -Identity $group |
            Where-Object { $_.DistinguishedName -eq $user.DistinguishedName }
          if (-not $member) {
            Add-ADGroupMember -Identity $group -Members $user
            $changed = $true
          }

          Write-Output "Changed=$changed"
      register: sai_deny_logon_result
      changed_when: "'Changed=True' in sai_deny_logon_result.output"
      tags: [groups, logon]

    - name: Assert no service identity carries a privileged group or an SPN
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $names = @({{ ((sai_bind_accounts | map(attribute='name') | list)
                        + (sai_automation_accounts | map(attribute='name') | list))
                       | map('to_json') | join(', ') }})
          $forbidden = @(
            'Domain Admins', 'Enterprise Admins', 'Schema Admins',
            'Administrators', 'Account Operators', 'Backup Operators',
            'Server Operators', 'Print Operators', 'DnsAdmins',
            'Group Policy Creator Owners', 'Key Admins', 'Enterprise Key Admins'
          )
          $problems = @()

          foreach ($name in $names) {
            $u = Get-ADUser -Identity $name -Properties `
              memberOf, adminCount, servicePrincipalName, userAccountControl
            if ($u.adminCount -eq 1) {
              $problems += "$name has adminCount=1"
            }
            if ($u.servicePrincipalName -and $u.servicePrincipalName.Count -gt 0) {
              $problems += "$name has a servicePrincipalName"
            }
            if ($u.userAccountControl -band 65536) {
              $problems += "$name has DONT_EXPIRE_PASSWORD"
            }
            if ($u.userAccountControl -band 524288) {
              $problems += "$name is TRUSTED_FOR_DELEGATION"
            }
            foreach ($dn in $u.memberOf) {
              $g = Get-ADGroup -Identity $dn
              if ($forbidden -contains $g.Name) {
                $problems += "$name is a member of $($g.Name)"
              }
            }
          }

          if ($problems.Count -gt 0) {
            throw ("Least-privilege assertion failed: " + ($problems -join '; '))
          }
          Write-Output 'Least-privilege assertions passed'
      changed_when: false
      tags: [verify]

    - name: Delegate scoped directory read to the bind tier
      loop: "{{ sai_read_scopes }}"
      loop_control:
        label: "{{ item }}"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $scopeDn = {{ item | to_json }}
          $groupName = {{ sai_read_group | to_json }}
          $userAttrs = @({{ sai_read_user_attributes | map('to_json') | join(', ') }})
          $groupAttrs = @({{ sai_read_group_attributes | map('to_json') | join(', ') }})

          $group = Get-ADGroup -Identity $groupName
          $sid = [System.Security.Principal.SecurityIdentifier]$group.SID
          $schemaDn = (Get-ADRootDSE).schemaNamingContext
          $userClassGuid = [Guid]'bf967aba-0de6-11d0-a285-00aa003049e2'
          $groupClassGuid = [Guid]'bf967a9c-0de6-11d0-a285-00aa003049e2'

          function Get-AttributeGuid {
            param([string]$LdapName)
            $a = Get-ADObject -SearchBase $schemaDn `
              -LDAPFilter "(lDAPDisplayName=$LdapName)" -Properties schemaIDGUID
            if (-not $a) { throw "Unknown schema attribute $LdapName" }
            return (New-Object Guid (,$a.schemaIDGUID))
          }

          $aclPath = "AD:\$scopeDn"
          $acl = Get-Acl -Path $aclPath
          $existing = $acl.GetAccessRules($true, $false,
            [System.Security.Principal.SecurityIdentifier])
          $changed = $false

          function Add-ReadRule {
            param([Guid]$AttributeGuid, [Guid]$ClassGuid)

            $rights = [System.DirectoryServices.ActiveDirectoryRights]::ReadProperty
            $inherit =
              [System.DirectoryServices.ActiveDirectorySecurityInheritance]::Descendents

            foreach ($rule in $existing) {
              if (
                $rule.IdentityReference -eq $sid -and
                $rule.AccessControlType -eq
                  [System.Security.AccessControl.AccessControlType]::Allow -and
                (($rule.ActiveDirectoryRights -band $rights) -eq $rights) -and
                $rule.ObjectType -eq $AttributeGuid -and
                $rule.InheritanceType -eq $inherit -and
                $rule.InheritedObjectType -eq $ClassGuid
              ) { return }
            }

            $new = [System.DirectoryServices.ActiveDirectoryAccessRule]::new(
              $sid, $rights,
              [System.Security.AccessControl.AccessControlType]::Allow,
              $AttributeGuid, $inherit, $ClassGuid)
            $acl.AddAccessRule($new)
            $script:changed = $true
          }

          foreach ($attr in $userAttrs) {
            Add-ReadRule -AttributeGuid (Get-AttributeGuid -LdapName $attr) `
              -ClassGuid $userClassGuid
          }
          foreach ($attr in $groupAttrs) {
            Add-ReadRule -AttributeGuid (Get-AttributeGuid -LdapName $attr) `
              -ClassGuid $groupClassGuid
          }

          # List Contents on the container itself, so the tier can enumerate the
          # objects whose attributes it has just been granted.
          $lcRights = [System.DirectoryServices.ActiveDirectoryRights]::ListChildren
          $lcPresent = $false
          foreach ($rule in $existing) {
            if (
              $rule.IdentityReference -eq $sid -and
              $rule.AccessControlType -eq
                [System.Security.AccessControl.AccessControlType]::Allow -and
              (($rule.ActiveDirectoryRights -band $lcRights) -eq $lcRights)
            ) { $lcPresent = $true; break }
          }
          if (-not $lcPresent) {
            $acl.AddAccessRule(
              [System.DirectoryServices.ActiveDirectoryAccessRule]::new(
                $sid, $lcRights,
                [System.Security.AccessControl.AccessControlType]::Allow,
                [System.DirectoryServices.ActiveDirectorySecurityInheritance]::All))
            $changed = $true
          }

          if ($changed) { Set-Acl -Path $aclPath -AclObject $acl }
          Write-Output "Changed=$changed"
      register: sai_read_delegation_result
      changed_when: "'Changed=True' in sai_read_delegation_result.output"
      tags: [acl, bind]

    - name: Delegate password reset over the bind tier to the Vault LDAP manager
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $principalName = 'svc-vault-ldapmgr-bind'
          $scopeDn = {{ sai_bind_ou_dn | to_json }}

          $principal = Get-ADUser -Identity $principalName
          $sid = [System.Security.Principal.SecurityIdentifier]$principal.SID
          $userClassGuid = [Guid]'bf967aba-0de6-11d0-a285-00aa003049e2'
          $resetPasswordGuid = [Guid]'00299570-246d-11d0-a768-00aa006e0529'
          $schemaDn = (Get-ADRootDSE).schemaNamingContext
          $pwdLastSet = Get-ADObject -SearchBase $schemaDn `
            -LDAPFilter '(lDAPDisplayName=pwdLastSet)' -Properties schemaIDGUID
          $pwdLastSetGuid = New-Object Guid (,$pwdLastSet.schemaIDGUID)

          $aclPath = "AD:\$scopeDn"
          $acl = Get-Acl -Path $aclPath
          $existing = $acl.GetAccessRules($true, $false,
            [System.Security.Principal.SecurityIdentifier])
          $changed = $false

          function Add-Rule {
            param(
              [System.DirectoryServices.ActiveDirectoryRights]$Rights,
              [Guid]$ObjectType
            )
            $inherit =
              [System.DirectoryServices.ActiveDirectorySecurityInheritance]::Descendents
            foreach ($rule in $existing) {
              if (
                $rule.IdentityReference -eq $sid -and
                $rule.AccessControlType -eq
                  [System.Security.AccessControl.AccessControlType]::Allow -and
                (($rule.ActiveDirectoryRights -band $Rights) -eq $Rights) -and
                $rule.ObjectType -eq $ObjectType -and
                $rule.InheritanceType -eq $inherit -and
                $rule.InheritedObjectType -eq $userClassGuid
              ) { return }
            }
            $acl.AddAccessRule(
              [System.DirectoryServices.ActiveDirectoryAccessRule]::new(
                $sid, $Rights,
                [System.Security.AccessControl.AccessControlType]::Allow,
                $ObjectType, $inherit, $userClassGuid))
            $script:changed = $true
          }

          Add-Rule -Rights ([System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight) `
            -ObjectType $resetPasswordGuid
          Add-Rule -Rights ([System.DirectoryServices.ActiveDirectoryRights]::WriteProperty) `
            -ObjectType $pwdLastSetGuid

          if ($changed) { Set-Acl -Path $aclPath -AclObject $acl }
          Write-Output "Changed=$changed"
      register: sai_manager_delegation_result
      changed_when: "'Changed=True' in sai_manager_delegation_result.output"
      tags: [acl, rotation]

    - name: Report the resulting identity inventory
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $ou = {{ ('OU=' ~ sai_service_ou ~ ',' ~ sai_base_dn) | to_json }}
          $props = @('adminCount', 'userAccountControl', 'memberOf',
            'servicePrincipalName', 'pwdLastSet', 'userWorkstations')
          Get-ADUser -SearchBase $ou -Filter * -Properties $props |
            Select-Object SamAccountName, DistinguishedName, Enabled,
              @{n = 'adminCount'; e = { [int]$_.adminCount } },
              @{n = 'dontExpire'; e = { [bool]($_.userAccountControl -band 65536) } },
              @{n = 'groups'; e = { ($_.memberOf | ForEach-Object {
                (Get-ADGroup $_).Name }) -join ',' } },
              @{n = 'pwdAgeDays'; e = {
                [int]((Get-Date) - [datetime]::FromFileTime($_.pwdLastSet)).TotalDays } } |
            Format-Table -AutoSize | Out-String
      register: sai_inventory
      changed_when: false
      tags: [verify]

    - name: Show the identity inventory
      ansible.builtin.debug:
        var: sai_inventory.output
      tags: [verify]
