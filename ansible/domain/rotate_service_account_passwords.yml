---
# Rotate a service account's password in AD and Vault, verify the new
# credential actually authenticates, and roll back if it does not.
#
#   # report only - shows what WOULD rotate and why the rest is refused
#   ansible-playbook -i inventory/environments/production.ini \
#     ansible/domain/rotate_service_account_passwords.yml
#
#   # actually rotate one account
#   ansible-playbook -i inventory/environments/production.ini \
#     ansible/domain/rotate_service_account_passwords.yml \
#     -e sac_rotate_only=svc-tf-adcs -e sac_rotate_confirm=true
#
# This is the missing half of seed_service_account_passwords.yml, which says in
# its own header that "existing passwords are never overwritten (rotation is a
# separate, deliberate action)". This is that deliberate action.
#
# DEFAULTS ARE INERT. With no extra vars this playbook changes nothing: it
# prints a rotation plan and exits. Rotating requires BOTH an explicit account
# selection and sac_rotate_confirm=true. There is deliberately no "rotate
# everything" mode - see the assertion below.
#
# FAILS CLOSED. An account is rotatable only if every consumer in
# vars/service_account_consumers.yml has an automatable `update` kind. Anything
# `manual`, anything with a null required field, and anything missing from that
# file is refused with a reason rather than rotated blind. Today that means the
# automation-tier accounts (Terraform/Ansible, which read from Vault at runtime)
# are rotatable and the application-bind accounts are not. That asymmetry is the
# honest state of the estate, not an oversight.
#
# Requires VAULT_ADDR + VAULT_TOKEN (and VAULT_CACERT if Vault presents the
# internal CA). Every task touching a secret is no_log.

- name: Rotate service account passwords (report-only unless confirmed)
  hosts: "{{ sac_dc_host | default('domain_controllers_windows[0]') }}"
  gather_facts: false
  # Only the consumer map is a hard dependency. The identity list ships with #27
  # and is loaded below with first_found, so this play parses and reports even
  # before that merges - a vars_files entry for a missing file fails at parse
  # time, which would make even a report-only run impossible.
  vars_files:
    - vars/service_account_consumers.yml
  vars:
    sac_vault_mount: secret
    sac_rotate_confirm: false
    sac_rotate_only: ""
    sac_rotation_interval_days: 90
    sac_password_length: 32
    sac_rotated_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

  tasks:
    - name: Load the service identity list if it is present
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.first_found', sac_identity_candidates, errors='ignore') }}"
      vars:
        sac_identity_candidates:
          - files:
              - vars/service_account_identities.yml
            skip: true
      when: >-
        lookup('ansible.builtin.first_found', sac_identity_candidates,
               errors='ignore') | default('', true) | length > 0
      delegate_to: localhost
      run_once: true

    - name: Require the identity list before planning anything
      ansible.builtin.assert:
        that:
          - sai_bind_accounts is defined
          - sai_automation_accounts is defined
          - sai_winrm_account is defined
        fail_msg: >-
          vars/service_account_identities.yml is not present. It ships with
          homelab_ansible#27; merge that first. This play deliberately does not
          carry its own copy of the account list - two sources of truth for
          which identities exist is exactly how a rotation targets the wrong
          account.
      delegate_to: localhost
      run_once: true

    - name: Assemble the account list
      ansible.builtin.set_fact:
        sac_all_accounts: >-
          {{ sai_bind_accounts + sai_automation_accounts + [sai_winrm_account] }}
      delegate_to: localhost
      run_once: true
    # Only gated on rotation. A report-only run reads nothing from Vault, so
    # demanding a token to print a plan would stop the safe mode being usable by
    # anyone without rotation credentials - and the whole point of the default
    # mode is that it is safe to run.
    - name: Require the Vault environment when rotating
      ansible.builtin.assert:
        that:
          - lookup('env', 'VAULT_ADDR') | length > 0
          - lookup('env', 'VAULT_TOKEN') | length > 0
        fail_msg: >-
          Set VAULT_ADDR and VAULT_TOKEN (and VAULT_CACERT if Vault uses the
          internal CA) before rotating.
      when: sac_rotate_confirm | bool
      run_once: true
      delegate_to: localhost

    # Refuse a bare "rotate everything". Mass rotation of directory credentials
    # is the single fastest way to take the estate down, and the blast radius is
    # not uniform across accounts - one selection at a time forces the operator
    # to look at each consumer list.
    - name: Require an explicit single-account selection when rotating
      ansible.builtin.assert:
        that:
          - sac_rotate_only | length > 0
          - sac_rotate_only.split(',') | length == 1
        fail_msg: >-
          Rotation requires -e sac_rotate_only=<account>, one account per run.
          There is no bulk mode by design. Run without sac_rotate_confirm to see
          the plan for every account.
      when: sac_rotate_confirm | bool
      run_once: true
      delegate_to: localhost

    # An account is rotatable only if it is mapped AND every one of its
    # consumers is `vault_only` - the sole update kind this playbook can
    # currently complete without a further propagation step. `manual` fails
    # this, and so does a half-filled `occ` entry (occ_config_id: null), because
    # occ is not vault_only. Computing it per-account here rather than with a
    # chained selectattr keeps the test on the individual consumer dicts, where
    # it is meaningful.
    - name: Build the rotation plan
      ansible.builtin.set_fact:
        sac_plan: >-
          {{ sac_plan | default([]) + [{
               'name': item.name,
               'vault_path': item.vault_path,
               'mapped': item.name in sac_consumers,
               'rotatable': (
                 item.name in sac_consumers
                 and (sac_consumers[item.name].consumers | default([])) | length > 0
                 and (sac_consumers[item.name].consumers
                      | rejectattr('update', 'equalto', 'vault_only')
                      | list | length) == 0
               )
             }] }}
      loop: "{{ sac_all_accounts }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      run_once: true

    - name: Classify each account as rotatable or refused
      ansible.builtin.set_fact:
        sac_rotatable: >-
          {{ sac_plan | selectattr('rotatable') | map(attribute='name') | list }}
        sac_refused: >-
          {{ sac_plan | rejectattr('rotatable') | map(attribute='name') | list }}
        # Accounts described in the consumer map but absent from
        # service_account_identities.yml. These are the legacy credentials that
        # are actually stale today - `ldap` at 2056 days, svc-syno-repl at 96 -
        # and they are invisible to the plan loop above, which iterates only the
        # LPU identities #27 introduces. Surfacing them is the point: the
        # credentials most in need of rotation are precisely the ones this
        # cannot yet touch, and that should be stated rather than discovered.
        sac_unmanaged: >-
          {{ sac_consumers.keys() | difference(sac_all_accounts
             | map(attribute='name') | list) }}
      delegate_to: localhost
      run_once: true

    - name: Rotation plan
      ansible.builtin.debug:
        msg: >-
          {{ sac_all_accounts | length }} LPU accounts known.
          Rotatable now: {{ sac_rotatable | join(', ') | default('none', true) }}.
          Refused (manual or non-vault_only consumers):
          {{ sac_refused | join(', ') | default('none', true) }}.
          Consumer-mapped but outside service_account_identities.yml, so not
          rotatable by this playbook at all - these are the ones actually stale
          today: {{ sac_unmanaged | join(', ') | default('none', true) }}.
          {{ 'REPORT ONLY - nothing will change. Re-run with -e sac_rotate_only=<account> -e sac_rotate_confirm=true to rotate.'
             if not (sac_rotate_confirm | bool)
             else 'CONFIRMED - rotating ' ~ sac_rotate_only ~ '.' }}
      delegate_to: localhost
      run_once: true

    - name: Stop here unless rotation was explicitly confirmed
      ansible.builtin.meta: end_play
      when: not (sac_rotate_confirm | bool)

    - name: Refuse to rotate an account whose consumers are not fully automatable
      ansible.builtin.assert:
        that:
          - sac_rotate_only in sac_rotatable
        fail_msg: >-
          {{ sac_rotate_only }} is not rotatable: its consumer list in
          vars/service_account_consumers.yml contains a `manual` entry, a null
          required field, or the account is absent from that file entirely.
          Fix the consumer mapping (and prove the update path) before rotating.
          This refusal is the safety property, not a bug.
      run_once: true
      delegate_to: localhost

    - name: Select the account being rotated
      ansible.builtin.set_fact:
        sac_target: >-
          {{ (sac_all_accounts | selectattr('name', 'equalto', sac_rotate_only)
              | list | first) }}
      delegate_to: localhost
      run_once: true

    # Capture the CURRENT password before touching anything. This is the
    # rollback material: if the new credential fails to authenticate, AD is put
    # back to exactly what Vault still holds, leaving the two consistent.
    # Read via the vault CLI, not community.hashi_vault. The write below already
    # uses the CLI, and so does the existence precheck in
    # seed_service_account_passwords.yml, so the lookup was the odd one out - and
    # it pulls in hvac, a second Vault client with its own TLS trust handling and
    # its own install location. In practice hvac is not present in the Ansible
    # venv, so the lookup failed outright on first use. One client, one auth
    # path, one thing to keep working.
    # -format=json rather than -field=password. The field form emits the raw
    # value followed by a newline, so recovering it means trimming - and trim
    # would silently alter any password with leading or trailing whitespace.
    # That matters precisely here: this value is the rollback material, and a
    # rollback must restore EXACTLY what Vault holds or it leaves AD and Vault
    # disagreeing, which is the failure this whole play is built to avoid.
    # JSON round-trips the value unchanged.
    - name: Capture the current Vault password for rollback
      ansible.builtin.command:
        argv:
          - vault
          - kv
          - get
          - -format=json
          - -mount={{ sac_vault_mount }}
          - "{{ sac_target.vault_path }}"
      register: sac_old_password_read
      changed_when: false
      failed_when: false
      no_log: true
      delegate_to: localhost
      run_once: true

    - name: Require a readable current password before changing anything
      ansible.builtin.assert:
        that:
          - sac_old_password_read.rc == 0
          - (sac_old_password_read.stdout | from_json).data.data.password | default('', true) | length > 0
        fail_msg: >-
          Could not read the current password for {{ sac_rotate_only }} from
          {{ sac_target.vault_path }}. No AD or Vault write has been attempted,
          so nothing on the estate has changed. Without this value there is no
          rollback material, so the rotation is refused rather than run one-way.
      delegate_to: localhost
      run_once: true

    - name: Hold the current password for rollback
      ansible.builtin.set_fact:
        sac_old_password: "{{ (sac_old_password_read.stdout | from_json).data.data.password }}"
      no_log: true
      delegate_to: localhost
      run_once: true

    # AD's default complexity rule requires three of four character categories.
    # Sampling a mixed alphabet does not guarantee that: for a 32-char draw from
    # ascii_letters+digits there is roughly a 0.36% chance of containing no digit
    # at all. Set-ADAccountPassword would then reject the password mid-rotation,
    # which is survivable here (nothing has been written to Vault yet) but is an
    # avoidable failure - and the same flaw is open as a P1 on #27's seeder.
    #
    # So compose deterministically: one uppercase, one lowercase, one digit, then
    # fill the remainder from the full alphabet. Every component comes from the
    # same CSPRNG-backed lookup; concatenating guaranteed categories does not
    # weaken it, it only removes the categories-missing tail.
    - name: Generate the new password
      ansible.builtin.set_fact:
        sac_new_password: >-
          {{ lookup('ansible.builtin.password', '/dev/null', length=1, chars='ascii_uppercase')
             ~ lookup('ansible.builtin.password', '/dev/null', length=1, chars='ascii_lowercase')
             ~ lookup('ansible.builtin.password', '/dev/null', length=1, chars='digits')
             ~ lookup('ansible.builtin.password', '/dev/null',
                      length=(sac_password_length | int) - 3,
                      chars='ascii_letters,digits') }}
      no_log: true
      delegate_to: localhost
      run_once: true

    - name: Sanity-check the generated password before using it
      ansible.builtin.assert:
        that:
          - sac_new_password | length == (sac_password_length | int)
          - sac_new_password | regex_search('[A-Z]')
          - sac_new_password | regex_search('[a-z]')
          - sac_new_password | regex_search('[0-9]')
        fail_msg: >-
          Generated password did not meet AD complexity. Nothing has been
          changed; rerun. (This assertion should be unreachable - it exists so a
          future change to the generation expression cannot silently reintroduce
          the sampling flaw.)
      no_log: true
      delegate_to: localhost
      run_once: true

    # AD first, Vault last. Between these two steps Vault holds a credential
    # that no longer works, which is a real (short) window - but the reverse
    # order is worse: Vault would advertise a password AD has not accepted, and
    # a consumer refreshing mid-rotation would cache a credential that never
    # works. Verification sits between them precisely to keep the window small.
    - name: Set the new password in Active Directory
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          $username = {{ sac_target.name | to_json }}
          $password = {{ sac_new_password | to_json }}
          Set-ADAccountPassword -Identity $username -Reset `
            -NewPassword (ConvertTo-SecureString $password -AsPlainText -Force)
          Write-Output "reset $username"
      no_log: true
      register: sac_ad_set

    # Prove the credential is actually usable. A successful Set-ADAccountPassword
    # proves the write landed, not that the account can authenticate - policy,
    # lockout or a UPN mismatch can still block it.
    #
    # Validated ON the domain controller via PrincipalContext.ValidateCredentials
    # rather than by binding from the controller with ldapsearch. The earlier
    # approach had two defects that review caught, and this removes both at once:
    #
    #   - it bound to ldap://:389, sending the freshly generated password in
    #     cleartext on every rotation. LDAPS is available on 636 but the DC's
    #     certificate is issued to the hostname, so binding by IP fails
    #     validation and binding by name needs the internal CA trusted on
    #     whatever host runs the play - a fragile precondition for a security
    #     check.
    #   - `ldapsearch -w <password>` puts the secret in argv, readable from
    #     /proc by any local user for the life of the process. The repo already
    #     avoids this elsewhere by using -y with a protected file.
    #
    # ValidateCredentials negotiates Kerberos/NTLM, so the password never
    # crosses the network in the clear, and it stays in a PowerShell variable
    # rather than a command line. The script is passed through | to_json and the
    # task is no_log.
    - name: Verify the new credential authenticates
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.DirectoryServices.AccountManagement
          $ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext(
            [System.DirectoryServices.AccountManagement.ContextType]::Domain,
            {{ sac_domain | to_json }}
          )
          $ok = $ctx.ValidateCredentials({{ sac_target.name | to_json }}, {{ sac_new_password | to_json }})
          if (-not $ok) { throw "ValidateCredentials returned false" }
          Write-Output "validated"
      no_log: true
      # ignore_errors, NOT failed_when: false. The latter rewrites .failed to
      # false on the registered result, so the rollback below could never see a
      # verification failure and a broken credential would be written to Vault.
      # ignore_errors keeps .failed truthful while letting the play continue to
      # the rollback.
      ignore_errors: true  # noqa: ignore-errors
      register: sac_verify
      when: sac_consumers[sac_rotate_only].verify == 'ldap_bind'

    # Roll AD back to the password Vault still holds, so the two stay consistent
    # and the consumer keeps working on the old credential.
    - name: Roll back the AD password if verification failed
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          $username = {{ sac_target.name | to_json }}
          $password = {{ sac_old_password | to_json }}
          Set-ADAccountPassword -Identity $username -Reset `
            -NewPassword (ConvertTo-SecureString $password -AsPlainText -Force)
          Write-Output "rolled back $username"
      no_log: true
      when:
        - sac_consumers[sac_rotate_only].verify == 'ldap_bind'
        - sac_verify.failed | default(true)

    - name: Fail loudly if verification failed
      ansible.builtin.fail:
        msg: >-
          New credential for {{ sac_rotate_only }} did not authenticate against
          the {{ sac_domain }} domain. Active Directory has been rolled back to the
          password Vault still holds, so nothing is broken and no consumer needs
          updating. Investigate before retrying.
      when:
        - sac_consumers[sac_rotate_only].verify == 'ldap_bind'
        - sac_verify.failed | default(true)

    # The Vault write is the point of no return, so it gets the same rollback
    # treatment as verification. If it fails - transient Vault outage, expired
    # token, insufficient policy - AD is already holding the new password while
    # Vault still holds the old one. Nothing on the estate knows the working
    # credential, and because it is generated in-memory and no_log it exists
    # nowhere else: the account would be bricked and unrecoverable without a
    # manual reset. Roll AD back instead.
    - name: Store the verified password in Vault
      ansible.builtin.command:
        cmd: >-
          vault kv put -mount={{ sac_vault_mount }} {{ sac_target.vault_path }}
          password=- managed_by=rotate_service_account_passwords.yml
          purpose=scheduled-rotation
        stdin: "{{ sac_new_password }}"
        stdin_add_newline: false
      delegate_to: localhost
      no_log: true
      changed_when: sac_vault_write.rc == 0
      failed_when: false
      register: sac_vault_write

    - name: Roll back the AD password if the Vault write failed
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          $username = {{ sac_target.name | to_json }}
          $password = {{ sac_old_password | to_json }}
          Set-ADAccountPassword -Identity $username -Reset `
            -NewPassword (ConvertTo-SecureString $password -AsPlainText -Force)
          Write-Output "rolled back $username"
      no_log: true
      when: sac_vault_write.rc | default(1) != 0

    - name: Fail loudly if the Vault write failed
      ansible.builtin.fail:
        msg: >-
          Vault write failed for {{ sac_rotate_only }} after the AD password had
          already been changed. Active Directory has been rolled back to the
          password Vault still holds, so the account keeps working on its old
          credential and nothing needs updating. Check VAULT_ADDR/VAULT_TOKEN and
          the policy on {{ sac_target.vault_path }}, then retry.
      when: sac_vault_write.rc | default(1) != 0

    - name: Stamp rotation metadata
      ansible.builtin.command:
        cmd: >-
          vault kv metadata put -mount={{ sac_vault_mount }}
          -custom-metadata=rotated_at={{ sac_rotated_at }}
          -custom-metadata=rotation_interval_days={{ sac_rotation_interval_days }}
          {{ sac_target.vault_path }}
      delegate_to: localhost
      changed_when: true

    # vault_only consumers need nothing further - they read from Vault at
    # runtime, so the write above IS their update. Any other kind would need an
    # explicit step here, and cannot currently be reached: the rotatable filter
    # refuses accounts that have one.
    - name: Confirm no consumer requires a further update
      ansible.builtin.assert:
        that:
          - sac_consumers[sac_rotate_only].consumers
            | rejectattr('update', 'equalto', 'vault_only') | list | length == 0
        fail_msg: >-
          {{ sac_rotate_only }} has a consumer whose update kind is not
          vault_only, but rotation already completed. This means the rotatable
          filter and the consumer map disagree - treat the credential as
          rotated-but-not-propagated and update that consumer by hand now.
      delegate_to: localhost

    - name: Result
      ansible.builtin.debug:
        msg: >-
          Rotated {{ sac_rotate_only }}: new password set in AD, verified by
          LDAP bind, stored in Vault at {{ sac_target.vault_path }}, rotation
          metadata stamped {{ sac_rotated_at }}. Consumers are vault_only, so no
          further propagation is required.
      delegate_to: localhost
