---
# Single source of truth for the least-privilege service identities that replace
# ldap@myrobertson.net. Consumed by BOTH:
# - seed_service_account_passwords.yml  (generates + stores passwords in Vault)
# - provision_service_account_identities.yml (creates the AD accounts from
# Vault) so the account list is defined exactly once. See
# runbooks/security/ldap-account-retirement.md.
#
# NOTE: `name` becomes the account's sAMAccountName, which AD caps at 20
# characters. Keep every name <= 20 chars (display_name and the UPN may be
# longer). This is why the staging Nextcloud and Vault manager accounts use
# shortened names.
#
# Vault layout: secret/<vault_path> with a `password` field (KV v2, mount
# `secret`).

# Read-only directory bind accounts. None is a member of any privileged group;
# each ends up with adminCount=0 and no servicePrincipalName.
sai_bind_accounts:
  - name: svc-vault-ldap
    display_name: Vault LDAP Auth Bind
    description: Bind account for the Vault ldap/ auth method. Read-only.
    vault_path: windows/domain/service-accounts/svc-vault-ldap
  - name: svc-nextcloud-ldap
    display_name: Nextcloud LDAP Bind (prod)
    description: Bind account for Nextcloud production user directory. Read-only.
    vault_path: windows/domain/service-accounts/svc-nextcloud-ldap
  - name: svc-nextcloud-stg
    display_name: Nextcloud LDAP Bind (staging)
    description: Bind account for Nextcloud staging user directory. Read-only.
    vault_path: windows/domain/service-accounts/svc-nextcloud-stg
  # Staging runs TWO Nextcloud instances, not one. Besides default/nextcloud
  # (which svc-nextcloud-stg above serves) there is nextcloud/nextcloud-
  # migration, and on 2026-08-03 it was measured still binding as
  # ldap@myrobertson.net - the last significant consumer of that account after
  # Authelia was retired, at roughly 4-7 binds/hour. The consumer inventory in
  # runbooks/security/ldap-account-retirement.md does not list it, so it would
  # have been missed by a retirement that worked only from that table.
  #
  # Its LDAP settings live ONLY in the Nextcloud database - the deployment has
  # no LDAP_* env vars and no Secret - so repointing it is an occ ldap:set-
  # config call, not a manifest change. sAMAccountName is 17 chars, inside AD's
  # 20-char cap.
  - name: svc-nextcloud-mig
    display_name: Nextcloud LDAP Bind (staging migration)
    description: >-
      Bind account for the staging nextcloud-migration Nextcloud instance
      user directory. Read-only.
    vault_path: windows/domain/service-accounts/svc-nextcloud-mig
  # svc-pve-ldap and svc-pbs-ldap were REMOVED on 2026-08-04. Both were bind
  # accounts for AD realms that no longer exist, so neither had a consumer left
  # to serve.
  #
  #   Proxmox VE: `pvesh get /access/domains` on pve3/pve4/pve5 returns
  #   pam, keycloak, pve - the 'myrobertson' AD realm is gone and
  #   authentication moved to Keycloak OIDC.
  #
  #   PBS: `proxmox-backup-manager ldap list` returns nothing and
  #   /etc/proxmox-backup/domains.cfg holds only pam, pbs and two openid
  #   realms. ldap_passwords.json is 2 bytes - an empty object. Note this one
  #   was seeded 2026-07-29 and the realm was deleted 2026-08-03 while still
  #   bound as ldap@myrobertson.net: it was provisioned and never adopted, the
  #   same shape as svc-authelia-ldap below.
  #
  # Verified before disabling: zero binds on ALL THREE domain controllers over
  # 14 days, with Administrator as a control proven active on each (20/9/5
  # events). The handful of binds that did appear were self-inflicted - a
  # verification sweep from pve3 on 08-03 and this session's own investigation.
  # The earlier audit used svc-nextcloud-ldap as control, which reads zero on
  # dc1 and dns01 because prod Nextcloud only talks to rhonda; that is a
  # control-selection problem, not a broken query, and it is why the control
  # was changed before drawing a conclusion.
  #
  # Removing the entries stops provision_service_account_identities.yml
  # re-creating and re-enabling them. The AD objects are DISABLED, not deleted,
  # and their Vault secrets are retained - re-enable with Enable-ADAccount if a
  # consumer ever surfaces.
  # svc-authelia-ldap was REMOVED on 2026-08-03. Its own description said to
  # delete it once Authelia was decommissioned in favour of Keycloak, and that
  # happened the same day: Authelia is gone from both clusters, and every
  # ext_authz application now uses the Keycloak auth proxy.
  #
  # It was never actually used. Measured across all three DCs over 14 days:
  # zero 4624/4768/4769/4776 events, lastLogon 'none'. Authelia was still
  # binding as ldap@myrobertson.net right up to its removal, so this interim
  # account was provisioned and then never adopted.
  #
  # Removing the entry stops the provisioning playbook from re-creating and re-
  # enabling it. The AD object is being DISABLED rather than deleted, which is
  # reversible with Enable-ADAccount; delete it, and the Vault secret at
  # windows/domain/service-accounts/svc-authelia-ldap, after a soak. Keep the
  # Vault path until then so the credential can be restored if anything
  # unexpected surfaces. The credential-age collector's directory bind. Until
  # this account exists the collector binds as `ldap` - a Domain Admin whose
  # password is 2057 days old - to do nothing but read user attributes.
  # Enumerating accounts and reading pwdLastSet/userAccountControl needs
  # authenticated directory read and nothing more, so this belongs in the bind
  # tier like every other read-only consumer. sAMAccountName is 16 chars, inside
  # AD's 20-char cap.
  - name: svc-credage-ldap
    display_name: Credential Age Collector Bind
    description: >-
      Bind account for the credential-age metrics collector on the Proxmox
      nodes. Reads user attributes to compute password ages. Read-only.
    vault_path: windows/domain/service-accounts/svc-credage-ldap

# Write-capable or otherwise elevated automation identities. These are NOT in
# the bind tier and are NOT reachable by the bind-tier Vault manager.
sai_automation_accounts:
  # svc-vault-ldapmgr was REMOVED on 2026-08-04. It existed to let Vault's LDAP
  # SECRETS engine rotate the bind tier, but no ldap-type secrets engine is
  # mounted: `vault secrets list` shows aws, cubbyhole, identity, pki, pki_int,
  # pki_int_prod, pki_int_staging, postgres, prod-kubernetes, secret,
  # staging-kubernetes, sys, transit. The manager had nothing to manage.
  #
  # Do not confuse it with svc-vault-ldap, which is the ldap/ AUTH method bind
  # and is very much alive - it was automated the same day.
  #
  # Worth recording what goes away with it: this account held Reset Password
  # over OU=Bind, which is EIGHT accounts (svc-vault-ldap, svc-nextcloud-ldap,
  # svc-nextcloud-stg, svc-nextcloud-mig, svc-pve-ldap, svc-pbs-ldap,
  # svc-authelia-ldap, svc-credage-ldap) - including the account Vault's own
  # auth method binds with. Both this file's neighbours and
  # runbooks/security/ldap-account-retirement.md previously said "seven" or
  # "six"; the enumerated answer is eight. Losing the delegation locks nobody
  # out - those accounts keep working - it only removes an unused automated
  # reset path.
  #
  # Zero binds on all three DCs over 14 days, control-verified. AD object is
  # DISABLED, not deleted; Vault secret retained.
  - name: svc-tf-adcs
    display_name: Terraform AD CS Enrolment
    description: >-
      Terraform microsoftadcs provider. Enrol rights on named certificate
      templates only; no directory write.
    vault_path: windows/domain/service-accounts/svc-tf-adcs
  - name: svc-tf-dnsupdate
    display_name: Terraform DNS Dynamic Update
    description: >-
      Terraform dns provider (GSSAPI). Write access to delegated DNS zones
      only. Explicitly NOT a member of DnsAdmins.
    vault_path: windows/domain/service-accounts/svc-tf-dnsupdate
  - name: svc-ansible-ad
    display_name: Ansible AD Object Provisioning
    description: >-
      Creates and maintains objects under OU=Family and OU=Service Accounts.
      Not a Domain Admin.
    vault_path: windows/domain/service-accounts/svc-ansible-ad

# The WinRM automation identity is deliberately declared apart from the others.
# Configuring a domain controller's operating system is a Tier-0 action and
# cannot be reduced below it; see the runbook.
sai_winrm_account:
  name: svc-ansible-win
  display_name: Ansible Windows Host Automation (Tier-0)
  description: >-
    WinRM automation for dc1, rhonda, dns01 and janice. Tier-0 identity.
    Restricted by denied interactive logon rights.
  vault_path: windows/domain/service-accounts/svc-ansible-win
  # userWorkstations is DELIBERATELY EMPTY, and this is a correction rather than
  # a relaxation of something that was working.
  #
  # It previously listed DC1,RHONDA,DNS01,JANICE - the automation TARGETS. But
  # userWorkstations restricts the machine an account may authenticate FROM, not
  # the machines it may reach. The Ansible control node is a non-domain-joined
  # Mac, which sends an empty workstation name in NTLM, and an empty name can
  # never match a non-empty allow-list. The account was therefore unusable for
  # its only purpose: every logon failed 4625 with SubStatus 0xc0000070
  # (INVALID_WORKSTATION) while the password itself validated fine.
  #
  # Net exposure is unchanged versus the account this replaces: ldap@ carries no
  # workstation restriction either. The controls that remain real are membership
  # of GG-Deny-Interactive-Logon and the Tier-0 scoping below.
  #
  # To make a source restriction meaningful again, move the control node onto a
  # domain-joined host and set this to THAT host's name.
  workstations: ""
  # WinRM automation on the domain controllers installs features, edits HKLM,
  # manages services, registers scheduled tasks, creates and links GPOs,
  # authorises DHCP in AD and writes OU ACLs. The retirement runbook states this
  # genuinely requires Tier-0 and cannot be reduced. Stated here so the grant is
  # explicit in the source of truth rather than applied by hand.
  groups:
    - Domain Admins

# Accounts that already exist in Active Directory and are ROTATED by
# rotate_service_account_passwords.yml, but are deliberately NOT provisioned.
#
# WHY A SEPARATE LIST. provision_service_account_identities.yml loops
# sai_bind_accounts and runs New-ADUser with an explicit -Path, so putting a
# pre-existing account there would enrol it into provisioning and could move it
# into OU=Bind. runbooks/security/ldap-account-retirement.md is explicit that
# keycloak-ldap must not be renamed - renaming sAMAccountName changes the bind
# DN and breaks every login - and the same caution applies to relocating it.
#
# So this list is read by the rotation play only.
# seed_service_account_passwords.yml and
# provision_service_account_identities.yml continue to see exactly the three
# lists above and are unaffected.
sai_existing_accounts:
  - name: keycloak-ldap
    display_name: Keycloak LDAP Bind
    description: >-
      Keycloak user federation bind. Pre-existing; created outside this
      automation and left where it is.
    vault_path: windows/domain/service-accounts/keycloak-ldap
