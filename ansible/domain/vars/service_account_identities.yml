---
# Single source of truth for the least-privilege service identities that replace
# ldap@myrobertson.net. Consumed by BOTH:
#   - seed_service_account_passwords.yml  (generates + stores passwords in Vault)
#   - provision_service_account_identities.yml (creates the AD accounts from Vault)
# so the account list is defined exactly once. See
# runbooks/security/ldap-account-retirement.md.
#
# NOTE: `name` becomes the account's sAMAccountName, which AD caps at 20
# characters. Keep every name <= 20 chars (display_name and the UPN may be
# longer). This is why the staging Nextcloud and Vault manager accounts use
# shortened names.
#
# Vault layout: secret/<vault_path> with a `password` field (KV v2, mount `secret`).

# Read-only directory bind accounts. None is a member of any privileged group;
# each ends up with adminCount=0 and no servicePrincipalName.
sai_bind_accounts:
  - name: svc-vault-ldap
    display_name: Vault LDAP Auth Bind
    description: Bind account for the Vault ldap/ auth method. Read-only.
    vault_path: windows/domain/service-accounts/svc-vault-ldap
  - name: svc-nextcloud-ldap
    display_name: Nextcloud LDAP Bind (prod)
    description: Bind account for Nextcloud production user directory. Read-only.
    vault_path: windows/domain/service-accounts/svc-nextcloud-ldap
  - name: svc-nextcloud-stg
    display_name: Nextcloud LDAP Bind (staging)
    description: Bind account for Nextcloud staging user directory. Read-only.
    vault_path: windows/domain/service-accounts/svc-nextcloud-stg
  - name: svc-pve-ldap
    display_name: Proxmox VE Realm Bind
    description: Bind account for the Proxmox VE myrobertson AD realm. Read-only.
    vault_path: windows/domain/service-accounts/svc-pve-ldap
  - name: svc-pbs-ldap
    display_name: Proxmox Backup Server Realm Bind
    description: Bind account for the PBS myrobertson.net AD realm. Read-only.
    vault_path: windows/domain/service-accounts/svc-pbs-ldap
  - name: svc-authelia-ldap
    display_name: Authelia LDAP Bind (interim)
    description: >-
      Interim bind account for Authelia. Delete when Authelia is
      decommissioned in favour of Keycloak. Read-only.
    vault_path: windows/domain/service-accounts/svc-authelia-ldap

# Write-capable or otherwise elevated automation identities. These are NOT in the
# bind tier and are NOT reachable by the bind-tier Vault manager.
sai_automation_accounts:
  - name: svc-vault-ldapmgr
    display_name: Vault LDAP Secrets Manager (bind tier)
    description: >-
      Vault LDAP secrets engine manager. Resets passwords of accounts in
      OU=Bind only.
    vault_path: windows/domain/service-accounts/svc-vault-ldapmgr
  - name: svc-tf-adcs
    display_name: Terraform AD CS Enrolment
    description: >-
      Terraform microsoftadcs provider. Enrol rights on named certificate
      templates only; no directory write.
    vault_path: windows/domain/service-accounts/svc-tf-adcs
  - name: svc-tf-dnsupdate
    display_name: Terraform DNS Dynamic Update
    description: >-
      Terraform dns provider (GSSAPI). Write access to delegated DNS zones
      only. Explicitly NOT a member of DnsAdmins.
    vault_path: windows/domain/service-accounts/svc-tf-dnsupdate
  - name: svc-ansible-ad
    display_name: Ansible AD Object Provisioning
    description: >-
      Creates and maintains objects under OU=Family and OU=Service Accounts.
      Not a Domain Admin.
    vault_path: windows/domain/service-accounts/svc-ansible-ad

# The WinRM automation identity is deliberately declared apart from the others.
# Configuring a domain controller's operating system is a Tier-0 action and
# cannot be reduced below it; see the runbook.
sai_winrm_account:
  name: svc-ansible-win
  display_name: Ansible Windows Host Automation (Tier-0)
  description: >-
    WinRM automation for dc1, rhonda, dns01 and janice. Tier-0 identity.
    Restricted by userWorkstations and by denied logon rights.
  vault_path: windows/domain/service-accounts/svc-ansible-win
  workstations: DC1,RHONDA,DNS01,JANICE
