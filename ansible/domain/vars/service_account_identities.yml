---
# Single source of truth for the least-privilege service identities that replace
# ldap@myrobertson.net. Consumed by BOTH:
#   - seed_service_account_passwords.yml  (generates + stores passwords in Vault)
#   - provision_service_account_identities.yml (creates the AD accounts from Vault)
# so the account list is defined exactly once. See
# runbooks/security/ldap-account-retirement.md.
#
# NOTE: `name` becomes the account's sAMAccountName, which AD caps at 20
# characters. Keep every name <= 20 chars (display_name and the UPN may be
# longer). This is why the staging Nextcloud and Vault manager accounts use
# shortened names.
#
# Vault layout: secret/<vault_path> with a `password` field (KV v2, mount `secret`).

# Read-only directory bind accounts. None is a member of any privileged group;
# each ends up with adminCount=0 and no servicePrincipalName.
sai_bind_accounts:
  - name: svc-vault-ldap
    display_name: Vault LDAP Auth Bind
    description: Bind account for the Vault ldap/ auth method. Read-only.
    vault_path: windows/domain/service-accounts/svc-vault-ldap
  - name: svc-nextcloud-ldap
    display_name: Nextcloud LDAP Bind (prod)
    description: Bind account for Nextcloud production user directory. Read-only.
    vault_path: windows/domain/service-accounts/svc-nextcloud-ldap
  - name: svc-nextcloud-stg
    display_name: Nextcloud LDAP Bind (staging)
    description: Bind account for Nextcloud staging user directory. Read-only.
    vault_path: windows/domain/service-accounts/svc-nextcloud-stg
  # Staging runs TWO Nextcloud instances, not one. Besides default/nextcloud
  # (which svc-nextcloud-stg above serves) there is nextcloud/nextcloud-migration,
  # and on 2026-08-03 it was measured still binding as ldap@myrobertson.net - the
  # last significant consumer of that account after Authelia was retired, at
  # roughly 4-7 binds/hour. The consumer inventory in
  # runbooks/security/ldap-account-retirement.md does not list it, so it would
  # have been missed by a retirement that worked only from that table.
  #
  # Its LDAP settings live ONLY in the Nextcloud database - the deployment has no
  # LDAP_* env vars and no Secret - so repointing it is an occ ldap:set-config
  # call, not a manifest change. sAMAccountName is 17 chars, inside AD's 20-char
  # cap.
  - name: svc-nextcloud-mig
    display_name: Nextcloud LDAP Bind (staging migration)
    description: >-
      Bind account for the staging nextcloud-migration Nextcloud instance
      user directory. Read-only.
    vault_path: windows/domain/service-accounts/svc-nextcloud-mig
  - name: svc-pve-ldap
    display_name: Proxmox VE Realm Bind
    description: Bind account for the Proxmox VE myrobertson AD realm. Read-only.
    vault_path: windows/domain/service-accounts/svc-pve-ldap
  - name: svc-pbs-ldap
    display_name: Proxmox Backup Server Realm Bind
    description: Bind account for the PBS myrobertson.net AD realm. Read-only.
    vault_path: windows/domain/service-accounts/svc-pbs-ldap
  # svc-authelia-ldap was REMOVED on 2026-08-03. Its own description said to
  # delete it once Authelia was decommissioned in favour of Keycloak, and that
  # happened the same day: Authelia is gone from both clusters, and every
  # ext_authz application now uses the Keycloak auth proxy.
  #
  # It was never actually used. Measured across all three DCs over 14 days:
  # zero 4624/4768/4769/4776 events, lastLogon 'none'. Authelia was still binding
  # as ldap@myrobertson.net right up to its removal, so this interim account was
  # provisioned and then never adopted.
  #
  # Removing the entry stops the provisioning playbook from re-creating and
  # re-enabling it. The AD object is being DISABLED rather than deleted, which is
  # reversible with Enable-ADAccount; delete it, and the Vault secret at
  # windows/domain/service-accounts/svc-authelia-ldap, after a soak. Keep the
  # Vault path until then so the credential can be restored if anything
  # unexpected surfaces.
  # The credential-age collector's directory bind. Until this account exists the
  # collector binds as `ldap` - a Domain Admin whose password is 2057 days old -
  # to do nothing but read user attributes. Enumerating accounts and reading
  # pwdLastSet/userAccountControl needs authenticated directory read and nothing
  # more, so this belongs in the bind tier like every other read-only consumer.
  # sAMAccountName is 16 chars, inside AD's 20-char cap.
  - name: svc-credage-ldap
    display_name: Credential Age Collector Bind
    description: >-
      Bind account for the credential-age metrics collector on the Proxmox
      nodes. Reads user attributes to compute password ages. Read-only.
    vault_path: windows/domain/service-accounts/svc-credage-ldap

# Write-capable or otherwise elevated automation identities. These are NOT in the
# bind tier and are NOT reachable by the bind-tier Vault manager.
sai_automation_accounts:
  - name: svc-vault-ldapmgr
    display_name: Vault LDAP Secrets Manager (bind tier)
    description: >-
      Vault LDAP secrets engine manager. Resets passwords of accounts in
      OU=Bind only.
    vault_path: windows/domain/service-accounts/svc-vault-ldapmgr
  - name: svc-tf-adcs
    display_name: Terraform AD CS Enrolment
    description: >-
      Terraform microsoftadcs provider. Enrol rights on named certificate
      templates only; no directory write.
    vault_path: windows/domain/service-accounts/svc-tf-adcs
  - name: svc-tf-dnsupdate
    display_name: Terraform DNS Dynamic Update
    description: >-
      Terraform dns provider (GSSAPI). Write access to delegated DNS zones
      only. Explicitly NOT a member of DnsAdmins.
    vault_path: windows/domain/service-accounts/svc-tf-dnsupdate
  - name: svc-ansible-ad
    display_name: Ansible AD Object Provisioning
    description: >-
      Creates and maintains objects under OU=Family and OU=Service Accounts.
      Not a Domain Admin.
    vault_path: windows/domain/service-accounts/svc-ansible-ad

# The WinRM automation identity is deliberately declared apart from the others.
# Configuring a domain controller's operating system is a Tier-0 action and
# cannot be reduced below it; see the runbook.
sai_winrm_account:
  name: svc-ansible-win
  display_name: Ansible Windows Host Automation (Tier-0)
  description: >-
    WinRM automation for dc1, rhonda, dns01 and janice. Tier-0 identity.
    Restricted by denied interactive logon rights.
  vault_path: windows/domain/service-accounts/svc-ansible-win
  # userWorkstations is DELIBERATELY EMPTY, and this is a correction rather than
  # a relaxation of something that was working.
  #
  # It previously listed DC1,RHONDA,DNS01,JANICE - the automation TARGETS. But
  # userWorkstations restricts the machine an account may authenticate FROM, not
  # the machines it may reach. The Ansible control node is a non-domain-joined
  # Mac, which sends an empty workstation name in NTLM, and an empty name can
  # never match a non-empty allow-list. The account was therefore unusable for
  # its only purpose: every logon failed 4625 with SubStatus 0xc0000070
  # (INVALID_WORKSTATION) while the password itself validated fine.
  #
  # Net exposure is unchanged versus the account this replaces: ldap@ carries no
  # workstation restriction either. The controls that remain real are membership
  # of GG-Deny-Interactive-Logon and the Tier-0 scoping below.
  #
  # To make a source restriction meaningful again, move the control node onto a
  # domain-joined host and set this to THAT host's name.
  workstations: ""
  # WinRM automation on the domain controllers installs features, edits HKLM,
  # manages services, registers scheduled tasks, creates and links GPOs,
  # authorises DHCP in AD and writes OU ACLs. The retirement runbook states this
  # genuinely requires Tier-0 and cannot be reduced. Stated here so the grant is
  # explicit in the source of truth rather than applied by hand.
  groups:
    - Domain Admins
