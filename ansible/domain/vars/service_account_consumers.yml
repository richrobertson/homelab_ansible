---
# Who actually consumes each service-account credential, and how that consumer
# is updated when the password changes.
#
# This file exists because generating a password is the easy 10% of rotation.
# The 90% that causes outages is: every system that binds with the old password
# must be updated in the same window, or authentication breaks estate-wide the
# moment the credential changes. 6344161 chose to de-privilege svc-syno-repl
# rather than rotate it for exactly this reason ("de-privilege, no rotation"),
# and its commit body says clearing DONT_EXPIRE_PASSWORD would expire a password
# older than maxPwdAge "the moment the flag is removed - an outage".
#
# Consumed by rotate_service_account_passwords.yml, which FAILS CLOSED: an
# account is only rotatable if every one of its consumers has an automatable
# `update` kind. Anything listed as `manual`, or any account absent from this
# file entirely, is refused rather than rotated blind. Adding an account here
# is therefore a deliberate statement that its blast radius is understood.
#
# update kinds:
#   vault_only  - the consumer reads the credential from Vault at runtime, so
#                 writing Vault + AD is sufficient. No third system to touch.
#   k8s_secret  - a Kubernetes Secret must be updated and the workload restarted.
#                 `namespace`/`secret`/`key` identify it; `rollout` is the
#                 workload to restart.
#   occ         - Nextcloud: `php occ ldap:set-config <cfg> ldapAgentPassword`.
#   manual      - no automation exists. Rotation is REFUSED for the account.
#                 Write down what a human has to do, so the gap is visible
#                 rather than implicit.
#
# verify: how to prove the new credential works BEFORE the old one is discarded.
#   ldap_bind   - authenticate as the account against the domain. Implemented on
#                 the DC via PrincipalContext.ValidateCredentials, which
#                 negotiates Kerberos/NTLM, so the password never crosses the
#                 network in cleartext and never appears in a command line. The
#                 key is still named ldap_bind because what it proves is
#                 unchanged: that a consumer binding with this credential will
#                 succeed, not merely that the AD write landed.
#   none        - no automated verification available (implies manual).

sac_domain: myrobertson.net

# ---------------------------------------------------------------------------
# Bind tier - the six read-only directory bind accounts from
# vars/service_account_identities.yml. All were created 2026-07-30 and are the
# ldap@ replacements.
#
# NOTE: NONE of the bind-tier accounts is `vault_only`. Every one of them has
# its credential configured inside the application that binds with it - Vault's
# own ldap/ auth config, Nextcloud occ, the PVE/PBS realms, Authelia - so
# rotating in Vault alone would leave that application authenticating with a
# password AD no longer accepts. They are `manual` (or `occ` with an
# unconfirmed config id, which the playbook also refuses) on purpose: better a
# refused rotation than a silent SSO outage.
#
# The `vault_only` accounts are all in the automation tier below.
# ---------------------------------------------------------------------------
sac_consumers:
  svc-vault-ldap:
    description: Vault ldap/ auth method bind.
    verify: ldap_bind
    consumers:
      - name: vault-ldap-auth
        update: manual
        detail: >-
          Vault's ldap/ auth method stores binddn/bindpass in its own config
          (`vault write auth/ldap/config bindpass=...`). Rotating this account
          without updating that config locks every Vault LDAP login out,
          including the path an operator would use to fix it. Confirm whether
          the cluster has a non-LDAP break-glass token before automating.

  svc-vault-ldapmgr:
    description: Vault LDAP secrets engine manager (resets OU=Bind passwords).
    verify: ldap_bind
    consumers:
      - name: vault-ldap-secrets-engine
        update: manual
        detail: >-
          Same shape as svc-vault-ldap but higher blast radius: this account is
          what Vault uses to reset OTHER accounts' passwords. Rotating it
          incorrectly disables the very mechanism that would rotate the rest.
          Do this one last, and by hand, until there is a tested rollback.

  svc-nextcloud-ldap:
    description: Nextcloud production user directory bind.
    verify: ldap_bind
    consumers:
      - name: nextcloud-prod
        update: occ
        namespace: default
        rollout: deploy/nextcloud
        occ_config_id: null            # MUST be filled in; see note below
        detail: >-
          `php occ ldap:set-config <cfg> ldapAgentPassword <new>`. occ_config_id
          is null because it was not verified against the running deployment -
          rotate_service_account_passwords.yml treats a null as unmapped and
          refuses. Read it from `occ ldap:show-config` before enabling.

  svc-nextcloud-stg:
    description: Nextcloud staging user directory bind.
    verify: ldap_bind
    consumers:
      - name: nextcloud-migration-ldap
        update: occ
        namespace: nextcloud
        rollout: deploy/nextcloud-migration-ldap
        occ_config_id: null
        detail: >-
          As above. Staging is the correct place to prove the occ update path
          before it is ever pointed at production.

  svc-pve-ldap:
    description: Proxmox VE myrobertson AD realm bind.
    verify: ldap_bind
    consumers:
      - name: pve-realm
        update: manual
        detail: >-
          `pveum realm modify <realm> --password` on a pve node. Not automated
          here because PVE realm config is not currently managed by this repo,
          so an Ansible-side rotation would immediately drift from whatever the
          cluster actually holds.

  svc-pbs-ldap:
    description: Proxmox Backup Server realm bind.
    verify: ldap_bind
    consumers:
      - name: pbs-realm
        update: manual
        detail: >-
          `proxmox-backup-manager ldap update <realm> --password`. Same reason
          as PVE. Note pbs is also the jump host used to reach the cluster when
          Tailscale is up - breaking its auth has an outsized recovery cost.

  svc-authelia-ldap:
    description: Authelia LDAP bind (interim; retire with Authelia).
    verify: ldap_bind
    consumers:
      - name: authelia
        update: manual
        detail: >-
          Authelia reads its bind password from a secret rendered into the
          release. Marked manual because the exact secret/key was not confirmed
          against the cluster. Authelia is slated for retirement in favour of
          Keycloak - retiring the account may be cheaper than automating it.

  # -------------------------------------------------------------------------
  # Automation tier. These are the genuinely easy ones: the consumer IS Vault -
  # Terraform and Ansible read the credential at runtime rather than holding a
  # copy - so writing AD + Vault completes the rotation with nothing else to
  # update. These are the right accounts to prove the machinery on.
  # -------------------------------------------------------------------------
  svc-tf-adcs:
    description: Terraform AD CS enrolment.
    verify: ldap_bind
    consumers:
      - name: terraform-adcs
        update: vault_only
        detail: Reads the credential from Vault at plan/apply time.

  svc-tf-dnsupdate:
    description: Terraform DNS dynamic update (GSSAPI).
    verify: ldap_bind
    consumers:
      - name: terraform-dns
        update: vault_only
        detail: Reads the credential from Vault at plan/apply time.

  svc-ansible-ad:
    description: Ansible AD object provisioning.
    verify: ldap_bind
    consumers:
      - name: ansible-ad
        update: vault_only
        detail: >-
          Read from Vault by the provisioning playbooks. Rotating this while a
          provisioning run is in flight will fail that run; it will not corrupt
          anything.

  svc-ansible-win:
    description: Ansible WinRM automation (Tier-0).
    verify: ldap_bind
    consumers:
      - name: ansible-winrm
        update: vault_only
        detail: >-
          Read from Vault. Tier-0: this account configures the DCs themselves.
          Automatable, but rotate it in a window where a failed WinRM path is
          recoverable by console.

  # -------------------------------------------------------------------------
  # Legacy accounts that are actually stale today. None is rotatable yet; they
  # are recorded here so the gap is explicit rather than forgotten, and so
  # `--check` reporting shows them as refused-with-reason.
  # -------------------------------------------------------------------------
  ldap:
    description: Legacy all-purpose bind account. 2056 days old, never_expires.
    verify: ldap_bind
    consumers:
      - name: estate-wide
        update: manual
        detail: >-
          The account PR #27 exists to retire. Bound by Authelia and Nextcloud
          user_ldap at minimum, and its true consumer list is not known. Do not
          rotate: retire it by cutting each consumer over to its svc-* account,
          then disable. Rotating in place is strictly worse than retiring.

  svc-syno-repl:
    description: Synology Snapshot Replication service account.
    verify: ldap_bind
    consumers:
      - name: synology-dsm
        update: manual
        detail: >-
          Consumed by DSM on kermit and scooter. Implicated in the replication
          outage that began 2026-07-30, immediately after 6344161 de-privileged
          it; that de-privileging was chosen *because* no rotation path existed.
          Do not rotate until that incident is closed - changing the credential
          mid-incident makes the failure unattributable.
