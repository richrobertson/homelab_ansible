---
# Who actually consumes each service-account credential, and how that consumer
# is updated when the password changes.
#
# This file exists because generating a password is the easy 10% of rotation.
# The 90% that causes outages is: every system that binds with the old password
# must be updated in the same window, or authentication breaks estate-wide the
# moment the credential changes. 6344161 chose to de-privilege svc-syno-repl
# rather than rotate it for exactly this reason ("de-privilege, no rotation"),
# and its commit body says clearing DONT_EXPIRE_PASSWORD would expire a password
# older than maxPwdAge "the moment the flag is removed - an outage".
#
# Consumed by rotate_service_account_passwords.yml, which FAILS CLOSED: an
# account is only rotatable if every one of its consumers has an automatable
# `update` kind. Anything listed as `manual`, or any account absent from this
# file entirely, is refused rather than rotated blind. Adding an account here
# is therefore a deliberate statement that its blast radius is understood.
#
# update kinds:
#   vault_only  - the consumer reads the credential from Vault at runtime, so
#                 writing Vault + AD is sufficient. No third system to touch.
#   k8s_secret  - a Kubernetes Secret must be updated and the workload restarted.
#                 `namespace`/`secret`/`key` identify it; `rollout` is the
#                 workload to restart.
#   occ         - Nextcloud: `php occ ldap:set-config <cfg> ldapAgentPassword`.
#   manual      - no automation exists. Rotation is REFUSED for the account.
#                 Write down what a human has to do, so the gap is visible
#                 rather than implicit.
#
# verify: how to prove the new credential works BEFORE the old one is discarded.
#   ldap_bind   - authenticate as the account against the domain. Implemented on
#                 the DC via PrincipalContext.ValidateCredentials, which
#                 negotiates Kerberos/NTLM, so the password never crosses the
#                 network in cleartext and never appears in a command line. The
#                 key is still named ldap_bind because what it proves is
#                 unchanged: that a consumer binding with this credential will
#                 succeed, not merely that the AD write landed.
#   none        - no automated verification available (implies manual).

sac_domain: myrobertson.net

# ---------------------------------------------------------------------------
# Bind tier - the six read-only directory bind accounts from
# vars/service_account_identities.yml. All were created 2026-07-30 and are the
# ldap@ replacements.
#
# NOTE: NONE of the bind-tier accounts is `vault_only`. Every one of them has
# its credential configured inside the application that binds with it - Vault's
# own ldap/ auth config, Nextcloud occ, the PVE/PBS realms, Authelia - so
# rotating in Vault alone would leave that application authenticating with a
# password AD no longer accepts. They are `manual` (or `occ` with an
# unconfirmed config id, which the playbook also refuses) on purpose: better a
# refused rotation than a silent SSO outage.
#
# The `vault_only` accounts are all in the automation tier below.
# ---------------------------------------------------------------------------
sac_consumers:
  svc-vault-ldap:
    description: Vault ldap/ auth method bind.
    verify: ldap_bind
    consumers:
      - name: vault-ldap-auth
        update: vault_ldap_auth
        detail: >-
          Vault's ldap/ auth method stores binddn/bindpass in its own config.
          Rotating this account without updating that config locks every Vault
          LDAP login out, which is why this was `manual` until 2026-08-04.

          It is not manual: Vault accepts the bindpass over its API, verified by
          hand on 2026-08-04 while moving this mount off cleartext ldap:// to
          ldaps:// with the AD CS root CA. rotate_service_account_passwords.yml
          now implements the `vault_ldap_auth` propagation step, which reads the
          existing config, writes it back whole with the new bindpass, and
          confirms the connection settings survived - a partial write would
          reset unspecified fields to defaults and silently return logins to
          cleartext.

          The propagation runs BEFORE the Vault KV write, so a failure rolls AD
          back to the password Vault still holds and leaves the KV entry
          untouched; LDAP logins keep working on the old credential.

          The break-glass precondition this entry used to ask for is satisfied:
          the cluster has five non-LDAP auth methods (approle, jwt, token,
          prod-kubernetes, staging-kubernetes), plus a root token at
          /root/.vault-token on the Vault host and console access to it. Losing
          LDAP auth would not lock an operator out.

  svc-vault-ldapmgr:
    description: Vault LDAP secrets engine manager (resets OU=Bind passwords).
    verify: ldap_bind
    consumers:
      - name: vault-ldap-secrets-engine
        update: manual
        detail: >-
          Same shape as svc-vault-ldap but higher blast radius: this account is
          what Vault uses to reset OTHER accounts' passwords. Rotating it
          incorrectly disables the very mechanism that would rotate the rest.
          Do this one last, and by hand, until there is a tested rollback.

  # =========================================================================
  # READ THIS BEFORE ADDING `occ` TO sac_automatable_updates. DO NOT.
  #
  # `occ ldap:set-config <cfg> ldapAgentPassword <new>` is a COMPLETE
  # propagation for exactly one of the three Nextcloud binds
  # (svc-nextcloud-mig). For the other two it is HALF of one, and the half that
  # silently reverts. Investigated 2026-08-04.
  #
  # 1. THE HOOK REVERTS IT. prod and staging-default mount a before-starting
  #    hook that unconditionally re-runs, on EVERY pod start:
  #        php occ ldap:set-config "${LDAP_CFG_ID}" ldapAgentPassword \
  #          "${LDAP_BIND_PASSWORD}"
  #    So an occ-only rotation is live until the next restart for ANY reason -
  #    node drain, image pull, chart upgrade, an unrelated VSO sync - and is
  #    then overwritten from the stale Secret. The break is separated from the
  #    change by days, which is the worst possible failure shape.
  #
  # 2. THE FIX TRIGGERS AN OUTAGE BY ITSELF. That Secret comes from a SECOND
  #    Vault path (secret/nextcloud/prod/ldap, secret/nextcloud/staging/ldap),
  #    NOT the service-account path this playbook writes. Those
  #    VaultStaticSecrets declare rolloutRestartTargets with refreshAfter 60s,
  #    and prod is strategy Recreate with 3 replicas. Writing that path IS an
  #    unattended full production Nextcloud outage, roughly 60s later. You do
  #    not get to choose whether prod restarts, only when you press the key.
  #    It must never happen from an unattended rotation run.
  #    The write must also be WHOLE-OBJECT: kv put replaces the version, so all
  #    ten keys must be re-supplied or LDAP_HOST/BASE_DN/TLS/filters are lost.
  #
  # 3. GETTING IT WRONG DOES NOT LOOK LIKE AN AUTH OUTAGE. user_ldap caches
  #    results in Redis for 600s, so a bad bind looks healthy for ~10 minutes.
  #    Then Connection::bind() treats LDAP error 49 as non-fatal, so
  #    userExistsOnLDAP() returns false and the CleanUp job marks every mapped
  #    user isDeleted=1 - users and their files vanish from the UI. The prod
  #    hook already carries a loop resetting `user_ldap isDeleted 0`, which is
  #    evidence this has happened here before.
  #
  # Correct order when this is eventually done, in a declared window:
  #   set AD -> ValidateCredentials -> occ ldap:set-config (instant, no restart)
  #   -> assert `occ ldap:test-config <cfg>` rc=0 -> whole-object write of the
  #   VSO source path (THIS is the restart) -> service-account KV write ->
  #   metadata stamp. Keeping both propagation steps before the service-account
  #   KV write preserves the rollback invariant: Vault still holds the password
  #   AD can be rolled back to.
  #
  # `occ ldap:test-config` is the right verifier: source-read on NC 33.0.3, it
  # performs a REAL bind with the stored credential and fails with "the bind
  # failed" on a wrong password - so it proves the credential without the
  # verifier ever knowing it.
  #
  # THIS ENTRY IS ALSO INCOMPLETE. It names only default/deploy-nextcloud. Prod
  # additionally runs the live 3-replica nextcloud/nextcloud-migration-ldap,
  # which is the deployment actually serving cloud.myrobertson.com, and which
  # this entry does not mention. Both are real consumers of this one account.
  # =========================================================================
  svc-nextcloud-ldap:
    description: Nextcloud production user directory bind.
    verify: ldap_bind
    consumers:
      - name: nextcloud-prod
        update: occ
        namespace: default
        rollout: deploy/nextcloud
        occ_config_id: s01             # verified 2026-08-04 via ldap:show-config
        detail: >-
          `php occ ldap:set-config s01 ldapAgentPassword <new>` is NOT
          sufficient on its own - see the block above. Config id s01 verified
          against the running deployment. This consumer list is incomplete: the
          live 3-replica nextcloud/nextcloud-migration-ldap deployment is also
          driven by this account and is not represented here.

  svc-nextcloud-stg:
    description: Nextcloud staging user directory bind.
    verify: ldap_bind
    consumers:
      - name: nextcloud-migration-ldap
        update: occ
        namespace: nextcloud
        rollout: deploy/nextcloud-migration-ldap
        occ_config_id: null
        detail: >-
          As above. Staging is the correct place to prove the occ update path
          before it is ever pointed at production.

  svc-pve-ldap:
    description: Proxmox VE myrobertson AD realm bind.
    verify: ldap_bind
    consumers:
      - name: pve-realm
        update: manual
        detail: >-
          `pveum realm modify <realm> --password` on a pve node. Not automated
          here because PVE realm config is not currently managed by this repo,
          so an Ansible-side rotation would immediately drift from whatever the
          cluster actually holds.

  svc-pbs-ldap:
    description: Proxmox Backup Server realm bind.
    verify: ldap_bind
    consumers:
      - name: pbs-realm
        update: manual
        detail: >-
          `proxmox-backup-manager ldap update <realm> --password`. Same reason
          as PVE. Note pbs is also the jump host used to reach the cluster when
          Tailscale is up - breaking its auth has an outsized recovery cost.

  svc-authelia-ldap:
    description: Authelia LDAP bind (interim; retire with Authelia).
    verify: ldap_bind
    consumers:
      - name: authelia
        update: manual
        detail: >-
          Authelia reads its bind password from a secret rendered into the
          release. Marked manual because the exact secret/key was not confirmed
          against the cluster. Authelia is slated for retirement in favour of
          Keycloak - retiring the account may be cheaper than automating it.

  # -------------------------------------------------------------------------
  # Automation tier. These are the genuinely easy ones: the consumer IS Vault -
  # Terraform and Ansible read the credential at runtime rather than holding a
  # copy - so writing AD + Vault completes the rotation with nothing else to
  # update. These are the right accounts to prove the machinery on.
  # -------------------------------------------------------------------------
  svc-tf-adcs:
    description: Terraform AD CS enrolment.
    verify: ldap_bind
    consumers:
      - name: terraform-adcs
        update: vault_only
        detail: Reads the credential from Vault at plan/apply time.

  svc-tf-dnsupdate:
    description: Terraform DNS dynamic update (GSSAPI).
    verify: ldap_bind
    consumers:
      - name: terraform-dns
        update: vault_only
        detail: Reads the credential from Vault at plan/apply time.

  # Unlike the other bind-tier accounts, this one IS vault_only. The collector
  # holds no configured copy of the credential: each run authenticates to Vault
  # with its AppRole, reads the bind password, uses it, and revokes the token.
  # Nothing on the Proxmox nodes persists the password, so writing Vault + AD is
  # genuinely sufficient and there is no application config to fall out of sync.
  svc-credage-ldap:
    description: Credential-age metrics collector directory bind.
    verify: ldap_bind
    consumers:
      - name: credential-age-ad-metrics
        update: vault_only
        detail: >-
          Read from Vault at run time by credential-age-ad-metrics.service on
          each Proxmox node, on a 15-minute timer. A rotation mid-run fails that
          single scrape; the next one picks up the new credential. Failure is
          visible as credential_ad_collector_success going to 0, not silent.

  svc-ansible-ad:
    description: Ansible AD object provisioning.
    verify: ldap_bind
    consumers:
      - name: ansible-ad
        update: vault_only
        detail: >-
          Read from Vault by the provisioning playbooks. Rotating this while a
          provisioning run is in flight will fail that run; it will not corrupt
          anything.

  svc-ansible-win:
    description: Ansible WinRM automation (Tier-0).
    verify: ldap_bind
    consumers:
      - name: ansible-winrm
        update: vault_only
        detail: >-
          Read from Vault. Tier-0: this account configures the DCs themselves.
          Automatable, but rotate it in a window where a failed WinRM path is
          recoverable by console.

  # -------------------------------------------------------------------------
  # Legacy accounts that are actually stale today. None is rotatable yet; they
  # are recorded here so the gap is explicit rather than forgotten, and so
  # `--check` reporting shows them as refused-with-reason.
  # -------------------------------------------------------------------------
  ldap:
    description: Legacy all-purpose bind account. 2056 days old, never_expires.
    verify: ldap_bind
    consumers:
      - name: estate-wide
        update: manual
        detail: >-
          The account PR #27 exists to retire. Bound by Authelia and Nextcloud
          user_ldap at minimum, and its true consumer list is not known. Do not
          rotate: retire it by cutting each consumer over to its svc-* account,
          then disable. Rotating in place is strictly worse than retiring.

  svc-syno-repl:
    description: Synology Snapshot Replication service account.
    verify: ldap_bind
    consumers:
      - name: synology-dsm
        update: manual
        detail: >-
          Consumed by DSM on kermit and scooter. Implicated in the replication
          outage that began 2026-07-30, immediately after 6344161 de-privileged
          it; that de-privileging was chosen *because* no rotation path existed.
          Do not rotate until that incident is closed - changing the credential
          mid-incident makes the failure unattributable.
