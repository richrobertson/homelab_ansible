---
# Generate a strong password for each least-privilege service identity and store
# it in Vault (KV v2, mount `secret`), idempotently — only for accounts that do
# not already have one; existing passwords are never overwritten (rotation is a
# separate, deliberate action). Run this BEFORE
# provision_service_account_identities.yml, which reads these passwords to create
# the AD accounts. See runbooks/security/ldap-account-retirement.md.
#
# Requires VAULT_ADDR + VAULT_TOKEN in the environment (VAULT_CACERT too if Vault
# presents the internal CA). Passwords are generated on the controller and written
# to Vault over stdin, so none appears on a command line, in this repo, or in
# playbook output (every task that touches a secret is no_log).
- name: Seed Vault with passwords for the LPU service identities
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/service_account_identities.yml
  vars:
    sai_vault_mount: secret
    sai_all_accounts: "{{ sai_bind_accounts + sai_automation_accounts + [sai_winrm_account] }}"
    # UPN suffix for the username field written alongside each password. Matches
    # the UPN provision_service_account_identities.yml sets on the AD object, so
    # the value in Vault is the one that will actually bind.
    sai_domain: myrobertson.net
    # Rotation metadata stamped on each newly generated secret so the security
    # collector does not count it as an ageless, never-rotated credential.
    sai_rotated_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
    sai_rotation_interval_days: 90
  tasks:
    - name: Require the Vault environment
      ansible.builtin.assert:
        that:
          - lookup('env', 'VAULT_ADDR') | length > 0
          - lookup('env', 'VAULT_TOKEN') | length > 0
        fail_msg: >-
          Set VAULT_ADDR and VAULT_TOKEN (and VAULT_CACERT if Vault uses the
          internal CA) before running.
      run_once: true

    - name: Check whether each account already has a Vault password
      ansible.builtin.command:
        cmd: "vault kv get -mount={{ sai_vault_mount }} -field=password {{ item.vault_path }}"
      loop: "{{ sai_all_accounts }}"
      loop_control:
        label: "{{ item.name }}"
      register: sai_pw_check
      changed_when: false
      failed_when: false
      no_log: true

    # Two properties this write must have, both raised in review:
    #
    # 1. AD complexity. Sampling ascii_letters+digits does not guarantee the
    #    three character categories AD's default policy requires: a 32-char draw
    #    has roughly a 0.36% chance of containing no digit, so across 11 accounts
    #    there is about a 4% chance at least one gets a password AD will later
    #    reject. Worse, it is stored in Vault first and only rejected when
    #    provision_service_account_identities.yml tries to use it, leaving Vault
    #    and AD disagreeing. Composed deterministically instead: one upper, one
    #    lower, one digit, then 29 from the full alphabet.
    #
    # 2. Create-only. The rc check above and this write are not atomic, so two
    #    overlapping runs can both observe a missing path and both put, the
    #    second silently creating a new version with a different password and
    #    breaking the never-overwrite invariant this play is built on. -cas=0
    #    makes Vault itself enforce "only if absent": the write fails rather than
    #    creating v2. Combined with the rc precheck, a losing race is now a loud
    #    failure instead of a silent desync.
    #
    # 3. `username` is written next to the password on purpose. A consumer that
    #    reads its bind identity from Vault - the credential-age collector does,
    #    via `vault kv get -field=username` - gets an empty string if the field
    #    is absent, and an LDAP bind with an empty DN fails. The original
    #    secret/windows/domain/ldap carried a username; the bind tier did not,
    #    so the first consumer repointed off ldap broke on exactly that gap. The
    #    value is the account's UPN, matching what
    #    provision_service_account_identities.yml sets on the AD object.
    #
    #    -cas=0 means this only affects NEWLY seeded secrets. Existing bind-tier
    #    secrets are deliberately left alone: their consumers hold the bind DN in
    #    their own application config and never read it from Vault, so
    #    backfilling them would add an unread field. Add it per-account if and
    #    when a consumer starts reading it.
    - name: Generate and store a 32-char password for accounts that lack one
      ansible.builtin.command:
        cmd: >-
          vault kv put -cas=0 -mount={{ sai_vault_mount }} {{ item.0.vault_path }}
          password=- username={{ item.0.name }}@{{ sai_domain }}
          managed_by=seed_service_account_passwords.yml
          purpose=ldap-account-retirement
        stdin: >-
          {{ lookup('ansible.builtin.password', '/dev/null', length=1, chars='ascii_uppercase')
             ~ lookup('ansible.builtin.password', '/dev/null', length=1, chars='ascii_lowercase')
             ~ lookup('ansible.builtin.password', '/dev/null', length=1, chars='digits')
             ~ lookup('ansible.builtin.password', '/dev/null', length=29,
                      chars='ascii_letters,digits') }}
        stdin_add_newline: false
      loop: "{{ sai_all_accounts | zip(sai_pw_check.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"
      when: (item.1.rc | default(1)) != 0 or (item.1.stdout | default('') | trim | length) == 0
      no_log: true
      register: sai_pw_seed

    - name: Stamp rotation metadata on the newly seeded secrets
      ansible.builtin.command:
        cmd: >-
          vault kv metadata put -mount={{ sai_vault_mount }}
          -custom-metadata=rotated_at={{ sai_rotated_at }}
          -custom-metadata=rotation_interval_days={{ sai_rotation_interval_days }}
          {{ item.0.vault_path }}
      loop: "{{ sai_all_accounts | zip(sai_pw_seed.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"
      when: not (item.1.skipped | default(false))
      changed_when: true

    - name: Summary (no secrets)
      ansible.builtin.debug:
        msg: >-
          {{ sai_all_accounts | length }} accounts total;
          {{ sai_pw_seed.results | selectattr('skipped', 'undefined') | list | length }}
          newly seeded,
          {{ sai_pw_seed.results | selectattr('skipped', 'defined') | list | length }}
          already had a password (left untouched).
