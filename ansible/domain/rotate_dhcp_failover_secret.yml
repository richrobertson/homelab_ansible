---
# =============================================================================
# rotate_dhcp_failover_secret.yml - Rotate the DHCP failover shared secret
# =============================================================================
# Addresses: windows/domain/dhcp_failover, 162 days old against a declared
# 90-day interval on 2026-09-15, with no way to rotate it.
#
# WHY THIS EXISTS
#   configure_windows_dhcp_ha.yml is CREATE-ONLY. Its failover task runs
#   Get-DhcpServerv4Failover and exits 'Present' the moment the relationship
#   exists, so re-running it with a new dhcp_failover_shared_secret silently
#   changes nothing and lets the Vault copy drift from the live value. The
#   secret was therefore unrotatable, and the honest stopgap on 2026-09-15 was
#   to widen its declared interval to 365 days and write down why. This
#   playbook is the real fix, so that interval can go back to something short.
#
#   This is the PSK that authenticates failover messages between the two DHCP
#   partners. It is not an account password: there is no AD object, no
#   pwdLastSet, and nothing expires it. Only the declared interval says when it
#   is due.
#
# WHAT A ROTATION ACTUALLY INVOLVES
#   The relationship exists independently on BOTH partners and each holds its
#   own copy of the secret. Set-DhcpServerv4Failover updates only the server it
#   runs against and does NOT propagate, so both must be set. Between the two
#   writes the partners disagree and failover messages fail to authenticate -
#   the relationship drops to COMMUNICATION-INTERRUPTED. DHCP keeps serving
#   leases throughout; what stops is partner synchronisation. The window is one
#   task long, and the verification below waits for NORMAL to come back.
#
#   The current secret CANNOT be read back: Get-DhcpServerv4Failover does not
#   return it in any form. So there is no "has it changed?" check and no
#   comparing against Vault - rotation is unconditional and opt-in, never
#   idempotent-by-detection. That is also why this is a separate playbook
#   rather than a branch inside the configure one: a create-only task that
#   quietly becomes a rewrite is exactly how the live value and Vault drifted
#   apart in the first place.
#
# SAFETY
#   * Inert by default. Rotating requires -e dhcp_rotate_confirm=true.
#   * The old secret is unreadable, so there is NO ROLLBACK. Recovery from a
#     half-applied rotation is to re-run this playbook, which sets both
#     partners to the same new value again.
#   * Vault is written only AFTER both partners are set and the relationship is
#     confirmed NORMAL, so a failure part-way leaves Vault holding the OLD
#     value and the operator with an accurate "this did not complete" signal.
#
#   export VAULT_ADDR=https://vault.myrobertson.net:8200
#   export VAULT_TOKEN="$(cat ~/.config/vault/token.env | cut -d= -f2)"
#   # report only - prints the plan and changes nothing
#   ansible-playbook -i inventory/environments/production.ini \
#     ansible/domain/rotate_dhcp_failover_secret.yml
#   # rotate
#   ansible-playbook -i inventory/environments/production.ini \
#     ansible/domain/rotate_dhcp_failover_secret.yml -e dhcp_rotate_confirm=true
# =============================================================================
- name: Rotate the DHCP failover shared secret
  hosts: dhcp_servers_windows
  gather_facts: false
  # The two partners must be written in a defined order, and the verification
  # must see both. Serial would split them into separate plays; ordering by task
  # with explicit host conditions keeps it one play and one run_once summary.
  order: inventory

  vars:
    dhcp_rotate_confirm: false
    # DISCOVERED, not assumed. Left empty the playbook enumerates the
    # relationships and uses the one that exists, requiring exactly one.
    #
    # Do not copy the `dhcp-ha` default from configure_windows_dhcp_ha.yml. The
    # live relationship on 2026-09-15 is named
    # `rhonda.myrobertson.net-dns01.myrobertson.net` - the Windows console's
    # automatic <primary>-<partner> naming - so it was created through the GUI
    # and `dhcp-ha` has never existed. A rotation playbook that hardcoded that
    # name would report "not present" against a perfectly healthy relationship,
    # which is exactly what the first run of this one did.
    dhcp_failover_name: ""
    dhcp_secret_length: 32
    dhcp_vault_path: secret/windows/domain/dhcp_failover
    dhcp_vault_field: shared_secret
    # 90 days is the cadence this secret was always meant to have; the 365 it
    # carries today was a stopgap for being unrotatable. Rotating with this
    # playbook is what earns the shorter interval back.
    dhcp_rotation_interval_days: 90
    dhcp_rotated_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
    dhcp_state_retries: 12
    dhcp_state_delay: 10

  pre_tasks:
    - name: Validate DHCP inventory groups
      ansible.builtin.assert:
        that:
          - groups['dhcp_primary_windows'] | default([]) | length == 1
          - groups['dhcp_partner_windows'] | default([]) | length == 1
          - groups['dhcp_primary_windows'][0] != groups['dhcp_partner_windows'][0]
        fail_msg: >-
          Define exactly one host in each of dhcp_primary_windows and
          dhcp_partner_windows, and do not reuse the same host in both groups.
      run_once: true
      delegate_to: localhost

    - name: Resolve the partner names
      ansible.builtin.set_fact:
        dhcp_primary_server: "{{ groups['dhcp_primary_windows'][0] }}"
        dhcp_partner_server: "{{ groups['dhcp_partner_windows'][0] }}"

    - name: Require the Vault environment when rotating
      ansible.builtin.assert:
        that:
          - lookup('env', 'VAULT_ADDR') | length > 0
          - lookup('env', 'VAULT_TOKEN') | length > 0
        fail_msg: Set VAULT_ADDR and VAULT_TOKEN before rotating.
      when: dhcp_rotate_confirm | bool
      run_once: true
      delegate_to: localhost

  tasks:
    - name: Discover the failover relationship
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $wanted = {{ dhcp_failover_name | to_json }}
          $all = @(Get-DhcpServerv4Failover -ErrorAction SilentlyContinue)
          if ($wanted) { $all = @($all | Where-Object { $_.Name -eq $wanted }) }
          @{
            count = $all.Count
            names = @($all | ForEach-Object { $_.Name })
            state = if ($all.Count -eq 1) { $all[0].State.ToString() } else { $null }
            partner = if ($all.Count -eq 1) { $all[0].PartnerServer } else { $null }
            scopes = if ($all.Count -eq 1) { $all[0].ScopeId.Count } else { 0 }
          } | ConvertTo-Json -Compress
      register: dhcp_discovered
      changed_when: false

    - name: Require exactly one failover relationship on each partner
      ansible.builtin.assert:
        that:
          - (dhcp_discovered.output[0] | from_json).count | int == 1
        fail_msg: >-
          Expected exactly one DHCP failover relationship on
          {{ inventory_hostname }}, found
          {{ (dhcp_discovered.output[0] | from_json).count }}:
          {{ (dhcp_discovered.output[0] | from_json).names }}. Pass
          -e dhcp_failover_name=<name> to choose one. Rotating the secret of the
          wrong relationship would break a working partnership.
      when: dhcp_rotate_confirm | bool

    - name: Adopt the discovered name
      ansible.builtin.set_fact:
        dhcp_failover_name: "{{ (dhcp_discovered.output[0] | from_json).names[0] }}"
      when: (dhcp_discovered.output[0] | from_json).count | int == 1

    - name: Report the current relationship state
      ansible.builtin.set_fact:
        dhcp_state_before:
          output:
            - "{{ dhcp_discovered.output[0] }}"

    - name: Show the plan
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ dhcp_state_before.output[0] }}
          {{ '- REPORT ONLY, nothing will change. Re-run with -e dhcp_rotate_confirm=true to rotate.'
             if not (dhcp_rotate_confirm | bool) else '- CONFIRMED, rotating.' }}

    - name: Require the relationship to be healthy before rotating
      ansible.builtin.assert:
        that:
          - "'NORMAL' in ((dhcp_discovered.output[0] | from_json).state | default('') | upper)"
        fail_msg: >-
          Failover relationship {{ dhcp_failover_name }} on
          {{ inventory_hostname }} is in state
          {{ (dhcp_discovered.output[0] | from_json).state }}, not NORMAL.
          Rotating the shared secret of an already-degraded partnership makes
          the fault harder to diagnose, and the post-rotation NORMAL check would
          have nothing to distinguish a new break from the existing one. Fix the
          relationship first.
      when: dhcp_rotate_confirm | bool

    - name: Stop here unless rotation was explicitly confirmed
      ansible.builtin.meta: end_play
      when: not (dhcp_rotate_confirm | bool)

    - name: Generate the new shared secret
      ansible.builtin.set_fact:
        dhcp_new_secret: >-
          {{ lookup('ansible.builtin.password', '/dev/null', length=1, chars='ascii_uppercase')
             ~ lookup('ansible.builtin.password', '/dev/null', length=1, chars='ascii_lowercase')
             ~ lookup('ansible.builtin.password', '/dev/null', length=1, chars='digits')
             ~ lookup('ansible.builtin.password', '/dev/null',
                      length=(dhcp_secret_length | int) - 3,
                      chars='ascii_letters,digits') }}
      no_log: true
      run_once: true
      delegate_to: localhost

    - name: Sanity-check the generated secret
      ansible.builtin.assert:
        that:
          - dhcp_new_secret | length == (dhcp_secret_length | int)
        fail_msg: Generated secret is the wrong length. Nothing has changed; rerun.
      run_once: true
      delegate_to: localhost

    # Primary first, then partner. Between these two tasks the partners hold
    # different secrets and the relationship will report
    # COMMUNICATION-INTERRUPTED; leases continue to be served.
    - name: Set the new shared secret on the primary
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Set-DhcpServerv4Failover -Name {{ dhcp_failover_name | to_json }} `
            -SharedSecret {{ dhcp_new_secret | to_json }} -Force
          Write-Output 'set'
      no_log: true
      when: inventory_hostname == dhcp_primary_server

    - name: Set the new shared secret on the partner
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Set-DhcpServerv4Failover -Name {{ dhcp_failover_name | to_json }} `
            -SharedSecret {{ dhcp_new_secret | to_json }} -Force
          Write-Output 'set'
      no_log: true
      when: inventory_hostname == dhcp_partner_server

    # NORMAL is the only state that proves both partners agree on the secret.
    # Anything else means they cannot authenticate to each other, which is
    # exactly the half-applied case worth catching before Vault is told the
    # rotation succeeded.
    - name: Wait for the relationship to return to NORMAL on both partners
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $f = Get-DhcpServerv4Failover -Name {{ dhcp_failover_name | to_json }}
          $f.State.ToString()
      register: dhcp_state_after
      until: "'NORMAL' in (dhcp_state_after.output[0] | default('') | string | upper)"
      retries: "{{ dhcp_state_retries | int }}"
      delay: "{{ dhcp_state_delay | int }}"
      changed_when: false

    - name: Report the recovered state
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: failover state {{ dhcp_state_after.output[0] }}"

    # Only now is Vault told. A failure above leaves Vault holding the OLD
    # secret, which is the truthful record that the rotation did not complete.
    - name: Store the new secret in Vault
      ansible.builtin.command:
        cmd: vault kv patch {{ dhcp_vault_path }} {{ dhcp_vault_field }}=-
        stdin: "{{ dhcp_new_secret }}"
        stdin_add_newline: false
      delegate_to: localhost
      run_once: true
      no_log: true
      register: dhcp_vault_write
      changed_when: dhcp_vault_write.rc == 0

    - name: Stamp rotation metadata
      ansible.builtin.command:
        cmd: >-
          vault kv metadata patch
          -custom-metadata=rotated_at={{ dhcp_rotated_at }}
          -custom-metadata=rotation_interval_days={{ dhcp_rotation_interval_days }}
          -custom-metadata=rotation_note={{ ('Rotated by ansible/domain/rotate_dhcp_failover_secret.yml, which sets the PSK on BOTH partners and waits for the relationship to return to NORMAL. configure_windows_dhcp_ha.yml remains create-only and will not rotate this.') | quote }}
          {{ dhcp_vault_path }}
      delegate_to: localhost
      run_once: true
      changed_when: true

    - name: Result
      ansible.builtin.debug:
        msg: >-
          Rotated the {{ dhcp_failover_name }} shared secret on
          {{ dhcp_primary_server }} and {{ dhcp_partner_server }}, confirmed the
          relationship returned to NORMAL on both, stored it at
          {{ dhcp_vault_path }} field {{ dhcp_vault_field }}, and stamped
          {{ dhcp_rotated_at }} with a {{ dhcp_rotation_interval_days }}-day
          interval.
      run_once: true
