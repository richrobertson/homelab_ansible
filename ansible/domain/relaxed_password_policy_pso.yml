---
# Fine-Grained Password Policy (PSO) that RELAXES password length and age for a
# set of accounts, overriding the hardened Default Domain Password Policy (see
# harden_default_domain_password_policy.yml) for those accounts only.
#
# Why this exists: harden_default_domain_password_policy.yml raised the DOMAIN
# default to MinPasswordLength=14 / MaxPasswordAge=42d. A PSO is the correct AD
# mechanism to carve out a different policy for specific principals without
# weakening the domain-wide default.
#
# PRIVACY: this repo is public, so the accounts the relaxation applies to are
# intentionally NOT named here. Supply `relaxed_pso_subjects` from your private
# (git-ignored) inventory group_vars, or on the command line — e.g. a
# group_vars/domain_controllers_windows entry, or:
#   -e '{"relaxed_pso_subjects": ["<samaccountname>", "..."]}'
# The playbook refuses to run with an empty subject list.
#
# SECURITY NOTE: relaxing length/age is a deliberate relaxation. Where the
# subjects are privileged accounts, the stronger posture is a long passphrase +
# membership of Protected Users; prefer that where the workflow allows. Only
# length and age are loosened here — complexity and history are kept.
#
# A PSO takes precedence over the Default Domain Password Policy for its subjects
# (lowest msDS-PasswordSettingsPrecedence wins among multiple PSOs). Verified
# per-account with Get-ADUserResultantPasswordPolicy.
#
# Idempotent: creates the PSO if absent else updates it in place, and only adds
# subjects that are not already applied. A second run makes no change.
#
# Run (with sign-off; subjects supplied privately):
#   export WINPW="$(...vault kv get -field=password secret/windows/domain/ldap...)"
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES .venv/bin/ansible-playbook -f 1 \
#     -i inventory/environments/production.ini \
#     ansible/domain/relaxed_password_policy_pso.yml \
#     -e @"$SP/winpw.extravars.yml"    # + subjects from private group_vars
#
# To REMOVE the relaxation (restore subjects to the hardened default), delete the
# PSO on a writable DC:
#   Set-ADFineGrainedPasswordPolicy -Identity <relaxed_pso_name> \
#     -ProtectedFromAccidentalDeletion $false
#   Remove-ADFineGrainedPasswordPolicy  -Identity <relaxed_pso_name>
#
- name: Relaxed Fine-Grained Password Policy for supplied accounts
  hosts: "{{ relaxed_pso_hosts | default('domain_controllers_windows[0]') }}"
  gather_facts: false

  vars:
    relaxed_pso_name: Relaxed-Admin-Password-Policy
    # Subjects are supplied privately (see header). Empty here on purpose.
    relaxed_pso_subjects: []
    # Precedence: lower wins among multiple PSOs; the Default Domain Policy always
    # loses to any PSO on the subject.
    relaxed_pso_precedence: 10
    # The relaxations (vs the hardened default of 14 / 42d / 1d). Overridable.
    relaxed_pso_min_length: 8
    relaxed_pso_min_age_days: 0
    relaxed_pso_max_age_days: 365
    # Kept in line with the hardened default (NOT loosened).
    relaxed_pso_complexity: true
    relaxed_pso_history_count: 24
    relaxed_pso_lockout_threshold: 10
    relaxed_pso_lockout_minutes: 15

  tasks:
    - name: Require an explicit, non-empty subject list
      ansible.builtin.assert:
        that:
          - relaxed_pso_subjects | length > 0
        fail_msg: >-
          relaxed_pso_subjects is empty. Supply the accounts from your private
          inventory group_vars or with
          -e '{"relaxed_pso_subjects": ["<samaccountname>", ...]}'.

    - name: Create/update the PSO and apply it to the supplied accounts
      vars:
        subjects_json: "{{ relaxed_pso_subjects | to_json }}"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          $name = '{{ relaxed_pso_name }}'
          [string[]]$subjects = '{{ subjects_json }}' | ConvertFrom-Json

          $common = @{
            Precedence                  = [int]'{{ relaxed_pso_precedence }}'
            MinPasswordLength           = [int]'{{ relaxed_pso_min_length }}'
            ComplexityEnabled           = ('{{ relaxed_pso_complexity | to_json }}' -eq 'true')
            PasswordHistoryCount        = [int]'{{ relaxed_pso_history_count }}'
            MinPasswordAge              = [TimeSpan]::FromDays([int]'{{ relaxed_pso_min_age_days }}')
            MaxPasswordAge              = [TimeSpan]::FromDays([int]'{{ relaxed_pso_max_age_days }}')
            LockoutThreshold            = [int]'{{ relaxed_pso_lockout_threshold }}'
            LockoutDuration             = [TimeSpan]::FromMinutes([int]'{{ relaxed_pso_lockout_minutes }}')
            LockoutObservationWindow    = [TimeSpan]::FromMinutes([int]'{{ relaxed_pso_lockout_minutes }}')
            ReversibleEncryptionEnabled = $false
          }

          if (Get-ADFineGrainedPasswordPolicy -Filter "Name -eq '$name'" -ErrorAction SilentlyContinue) {
            Set-ADFineGrainedPasswordPolicy -Identity $name @common
            Write-Output "UPDATED PSO $name"
          } else {
            New-ADFineGrainedPasswordPolicy -Name $name -ProtectedFromAccidentalDeletion $true @common
            Write-Output "CREATED PSO $name"
          }

          $current = @()
          try {
            $current = @((Get-ADFineGrainedPasswordPolicy -Identity $name -Properties 'msDS-PSOAppliesTo').'msDS-PSOAppliesTo' |
              ForEach-Object { (Get-ADObject $_).Name })
          } catch {}
          foreach ($s in $subjects) {
            if ($current -notcontains $s) {
              Add-ADFineGrainedPasswordPolicySubject -Identity $name -Subjects $s
              Write-Output "APPLIED PSO to a subject"
            } else { Write-Output "NOOP subject already applied" }
          }

          # Verify the resultant (effective) policy per account, without echoing
          # the account names to logs.
          $pso = Get-ADFineGrainedPasswordPolicy -Identity $name
          Write-Output ("PSO: MinLen={0} MinAge={1} MaxAge={2} Complexity={3} Precedence={4}" -f `
            $pso.MinPasswordLength, $pso.MinPasswordAge, $pso.MaxPasswordAge, $pso.ComplexityEnabled, $pso.Precedence)
          $eff = 0
          foreach ($s in $subjects) {
            $r = Get-ADUserResultantPasswordPolicy -Identity $s
            if ($r -and $r.Name -eq $name) { $eff++ }
          }
          Write-Output ("resultant PSO effective on {0}/{1} supplied subjects" -f $eff, $subjects.Count)
      register: relaxed_pso_result
      changed_when: >-
        relaxed_pso_result.output | select('search', '^(CREATED|UPDATED|APPLIED)') | list | length > 0

    - name: Show result
      ansible.builtin.debug:
        var: relaxed_pso_result.output
