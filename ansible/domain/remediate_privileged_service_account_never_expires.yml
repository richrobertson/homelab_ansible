---
# Clears the firing critical `ADPrivilegedAccountPasswordNeverExpires` for the
# three SERVICE accounts among the six it fires for, by removing privilege the
# accounts do not need — NOT by touching their passwords.
#
# Why de-privilege rather than rotate or clear the flag:
#   The alert (homelab_flux/infrastructure/configs/credential-age-alerts.yaml)
#   fires on the label combination enabled="true" AND never_expires="true" AND
#   privileged="true". Removing ANY one leg clears it. The collector
#   (ansible/proxmox/templates/credential-age-ad-metrics.sh.j2) sets
#   privileged="true" from adminCount OR *direct* membership of a privileged
#   group. Clearing DONT_EXPIRE_PASSWORD instead would expire a password that is
#   already far older than maxPwdAge (42d) the moment the flag is removed — an
#   auth outage. Rotating requires a consumer-in-lockstep update that is not yet
#   automatable for these consumers (Synology DSM appliance; Windows DHCP
#   dnscredentials). Both are Workstream 3 follow-ons, deliberately GATED below.
#
#   De-privileging is reversible in seconds (re-add the group membership), does
#   not change any password, and is exactly the least-privilege action the
#   retirement runbook already prescribes for these accounts:
#   runbooks/security/ldap-account-retirement.md §4 "Existing accounts in scope".
#
# SAFETY: this playbook is REPORT-ONLY by default. It makes no change unless
# `sacpne_execute=true` is passed, and disabling synbackup additionally requires
# `sacpne_disable_synbackup=true` plus a live re-proof that it is unused. It
# never reads, writes, prints or rotates a password. Nothing here is a secret,
# so no task needs no_log.
#
# NOTE ON POWERSHELL VALUE INJECTION: Ansible list/bool vars are passed into the
# win_powershell script as JSON. JSON array syntax (["a","b"]) and JSON bools
# (true/false) are NOT valid PowerShell literals, so every list is parsed with
# `@('...' | ConvertFrom-Json)` (the @() forces array context even for a single
# element under Windows PowerShell 5.1) and every bool as `('...' -eq 'true')`.
#
# Run (report only):
#   ansible-playbook -i inventory/environments/production.ini \
#     ansible/domain/remediate_privileged_service_account_never_expires.yml
# Apply the group-membership remediation (netsvc, svc-syno-repl):
#   ... -e sacpne_execute=true
# Additionally disable the dead synbackup account:
#   ... -e sacpne_execute=true -e sacpne_disable_synbackup=true
- name: Clear ADPrivilegedAccountPasswordNeverExpires for service accounts (de-privilege, no rotation)
  hosts: domain_controllers_windows[0]
  gather_facts: false

  vars:
    # Master gate. False = report the planned change and current state only.
    sacpne_execute: false
    # Second, independent gate for the one destructive-ish action (disable).
    sacpne_disable_synbackup: false
    # An account whose most-recent lastLogon across all DCs is older than this is
    # treated as dead for the purpose of the synbackup safety re-check.
    sacpne_unused_days_threshold: 180

    sacpne_base_dn: DC=myrobertson,DC=net

    # The eight groups the collector treats as privileged. Kept in lockstep with
    # ansible/proxmox/vars/credential_age_metrics.yml:credential_age_ad_privileged_groups.
    sacpne_privileged_groups:
      - Domain Admins
      - Enterprise Admins
      - Schema Admins
      - Administrators
      - Account Operators
      - Backup Operators
      - Server Operators
      - DnsAdmins

    # All six accounts the alert fires for, for the read-only state report only.
    sacpne_report_accounts: [ldap, synbackup, roy, rich, netsvc, svc-syno-repl]

    # Direct privileged-group memberships to strip from each service account.
    # The account KEEPS every other group, so its consumer is unaffected.
    sacpne_deprivilege_accounts:
      - name: netsvc
        # netsvc is privileged ONLY through direct DnsAdmins and has adminCount=0,
        # so removing DnsAdmins flips privileged->false immediately (no SDProp
        # wait). It already holds DnsUpdateProxy, the correct and sufficient group
        # for DHCP dynamic-DNS registration, so DHCP is unaffected.
        remove_from_groups: [DnsAdmins]
        must_retain_groups: [DnsUpdateProxy]
      - name: svc-syno-repl
        # Privileged through direct Backup Operators AND (nested) Domain Admins via
        # GG-Synology-Snapshot-Replication. Both paths are stripped: Backup
        # Operators here, and the group's Domain Admins membership below.
        #
        # CORRECTION, 2026-08-02. This entry used to claim "Snapshot replication
        # only needs the account to authenticate; DSM enforces the share ACLs,
        # so no privilege is required and the consumer is unaffected." That was
        # wrong and it caused a three-day outage: at the 00:00 run ninety
        # seconds after this played on 07-29, 14 replication plans began failing
        # "no remote permission" and did not recover.
        #
        # DSM's Snapshot Replication partner API requires privilege, not merely
        # a valid identity - it returns 402 "denied permission" for this account,
        # not 400 "wrong password", and the account is still in DSM's local
        # administrators group and domain user cache. Re-adding Backup Operators
        # alone was tested and did NOT restore it, so the load-bearing grant was
        # the Domain Admins nesting removed below.
        #
        # The de-privileging itself is CORRECT and stays. What was wrong was the
        # assumption that it had no consumer. The consumer has since been moved
        # off this account entirely: the replication plans now authenticate as a
        # local DSM account (ansible/synology/repoint_snapshot_replication_credentials.yml),
        # which is not subject to AD group evaluation at all. So this account no
        # longer has a replication consumer to break - but do not restore that
        # reasoning if a future account is added here. Verify the consumer, do
        # not assume it.
        remove_from_groups: [Backup Operators]
        must_retain_groups: [GG-Synology-Snapshot-Replication]

    # Nested removals: take a GROUP out of a privileged parent group, leaving the
    # service account a member of the (now unprivileged) group so its DSM-side
    # identity/share access is preserved.
    sacpne_nested_group_removals:
      - member_group: GG-Synology-Snapshot-Replication
        parent_group: Domain Admins
        # Guard: only remove if the member group's own membership is exactly this
        # set, so we never silently de-privilege an account we did not inspect.
        expected_members: [svc-syno-repl]

  pre_tasks:
    - name: Ensure the ActiveDirectory PowerShell module is available
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name ActiveDirectory)) {
            throw 'ActiveDirectory PowerShell module is not available on this host.'
          }
          Write-Output 'ActiveDirectory module available'
      changed_when: false
      tags: [preflight]

    - name: Report current alert state for all six firing accounts (read-only)
      vars:
        sacpne_privileged_json: "{{ sacpne_privileged_groups | to_json }}"
        sacpne_accounts_json: "{{ sacpne_report_accounts | to_json }}"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          [string[]]$privileged = '{{ sacpne_privileged_json }}' | ConvertFrom-Json
          [string[]]$names = '{{ sacpne_accounts_json }}' | ConvertFrom-Json
          $rows = foreach ($n in $names) {
            $u = Get-ADUser -LDAPFilter "(sAMAccountName=$n)" -Properties `
              adminCount, userAccountControl, memberOf, servicePrincipalName
            if (-not $u) { continue }
            $uac = [int]$u.userAccountControl
            $groups = @($u.memberOf | ForEach-Object { (Get-ADGroup $_).Name })
            $directPriv = @($groups | Where-Object { $privileged -contains $_ })
            $isPriv = ([int]$u.adminCount -eq 1) -or ($directPriv.Count -gt 0)
            [pscustomobject]@{
              account       = $u.SamAccountName
              enabled       = -not ($uac -band 0x2)
              never_expires = [bool]($uac -band 0x10000)
              adminCount    = [int]$u.adminCount
              directPriv    = ($directPriv -join ',')
              privileged    = $isPriv
              alertFires    = ((-not ($uac -band 0x2)) -and ($uac -band 0x10000) -and $isPriv)
            }
          }
          $rows | Format-Table -AutoSize | Out-String
      register: sacpne_state_before
      changed_when: false
      tags: [preflight, verify]

    - name: Show current alert state
      ansible.builtin.debug:
        var: sacpne_state_before.output
      tags: [preflight, verify]

  tasks:
    - name: "De-privilege: strip unneeded privileged group memberships from service accounts"
      loop: "{{ sacpne_deprivilege_accounts }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        sacpne_apply: "{{ sacpne_execute | bool }}"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $username     = {{ item.name | to_json }}
          [string[]]$removeGroups = '{{ item.remove_from_groups | to_json }}' | ConvertFrom-Json
          [string[]]$mustRetain   = '{{ (item.must_retain_groups | default([])) | to_json }}' | ConvertFrom-Json
          $apply        = ('{{ sacpne_apply | to_json }}' -eq 'true')

          $user = Get-ADUser -Identity $username -Properties memberOf
          $current = @($user.memberOf | ForEach-Object { (Get-ADGroup $_).Name })

          # Refuse to proceed if a group the consumer relies on is missing: that
          # would mean our model of the account is wrong.
          foreach ($g in $mustRetain) {
            if ($current -notcontains $g) {
              throw "$username is not a member of required group '$g'; aborting rather than guessing."
            }
          }

          $changed = $false
          foreach ($g in $removeGroups) {
            if ($current -contains $g) {
              if ($apply) {
                Remove-ADGroupMember -Identity $g -Members $user -Confirm:$false
                Write-Output "REMOVED $username from '$g'"
              } else {
                Write-Output "WOULD REMOVE $username from '$g' (report-only; pass sacpne_execute=true)"
              }
              $changed = $true
            } else {
              Write-Output "NOOP $username already not in '$g'"
            }
          }
          # Reassert retained groups for the record.
          foreach ($g in $mustRetain) { Write-Output "RETAINED $username in '$g'" }
          Write-Output ("Changed=" + ($changed -and $apply))
      register: sacpne_deprivilege_result
      changed_when: "'Changed=True' in sacpne_deprivilege_result.output"
      tags: [deprivilege]

    - name: "De-privilege: remove privileged parent membership from delegation groups (nested path)"
      loop: "{{ sacpne_nested_group_removals }}"
      loop_control:
        label: "{{ item.member_group }} -> {{ item.parent_group }}"
      vars:
        sacpne_apply: "{{ sacpne_execute | bool }}"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $memberGroup = {{ item.member_group | to_json }}
          $parentGroup = {{ item.parent_group | to_json }}
          [string[]]$expected = '{{ item.expected_members | to_json }}' | ConvertFrom-Json
          $apply       = ('{{ sacpne_apply | to_json }}' -eq 'true')

          $mg = Get-ADGroup -Identity $memberGroup -Properties memberOf
          # Guard: the member group's own direct members must match what we
          # inspected, so we never de-privilege an account we have not accounted for.
          $actual = @(Get-ADGroupMember -Identity $mg | ForEach-Object { $_.SamAccountName } | Sort-Object)
          $exp = @($expected | Sort-Object)
          if (($actual -join ',') -ne ($exp -join ',')) {
            throw ("Refusing to modify '$memberGroup': its members are [" + ($actual -join ',') +
                   "] but expected [" + ($exp -join ',') + "]. Re-inspect before running.")
          }

          $parentDns = @($mg.memberOf | ForEach-Object { (Get-ADGroup $_).Name })
          $changed = $false
          if ($parentDns -contains $parentGroup) {
            if ($apply) {
              Remove-ADGroupMember -Identity $parentGroup -Members $mg -Confirm:$false
              Write-Output "REMOVED group '$memberGroup' from '$parentGroup'"
            } else {
              Write-Output "WOULD REMOVE group '$memberGroup' from '$parentGroup' (report-only)"
            }
            $changed = $true
          } else {
            Write-Output "NOOP '$memberGroup' already not in '$parentGroup'"
          }
          Write-Output ("Changed=" + ($changed -and $apply))
      register: sacpne_nested_result
      changed_when: "'Changed=True' in sacpne_nested_result.output"
      tags: [deprivilege]

    - name: "synbackup: re-prove unused across every DC, then disable (double-gated)"
      when: sacpne_disable_synbackup | bool
      vars:
        sacpne_apply: "{{ sacpne_execute | bool }}"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory

          $username  = 'synbackup'
          $threshold = {{ sacpne_unused_days_threshold | int }}
          $apply     = ('{{ sacpne_apply | to_json }}' -eq 'true')

          $user = Get-ADUser -Identity $username -Properties Enabled, lastLogon, lastLogonTimestamp
          # Non-replicated lastLogon is the authoritative "recently used?" signal,
          # but reading it from every DC needs a direct -Server query, and this
          # NTLM WinRM session cannot double-hop to a remote DC (it fails with
          # ADServerDownException). So build the freshness estimate from what IS
          # readable without a hop — this DC's own lastLogon plus the replicated
          # lastLogonTimestamp (accurate to ~14 days, far inside the 180-day
          # threshold) — and fold in any remote DC we happen to be able to reach
          # on a best-effort basis. A DC we cannot reach is skipped, never fatal.
          $candidates = @()
          if ($user.lastLogon) { $candidates += [int64]$user.lastLogon }
          if ($user.lastLogonTimestamp) { $candidates += [int64]$user.lastLogonTimestamp }
          $reached = 0
          foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
            try {
              $ll = (Get-ADUser -Identity $username -Server $dc -Properties lastLogon -ErrorAction Stop).lastLogon
              $reached++
              if ($ll) { $candidates += [int64]$ll }
            } catch {
              Write-Output "WARN: $dc unreachable for lastLogon (double-hop); skipping"
            }
          }
          $maxLast = if ($candidates.Count) { ($candidates | Measure-Object -Maximum).Maximum } else { 0 }
          $lastDate = if ($maxLast -gt 0) { [datetime]::FromFileTime($maxLast) } else { $null }
          $ageDays  = if ($lastDate) { [int]((Get-Date) - $lastDate).TotalDays } else { 99999 }
          Write-Output ("synbackup lastLogon(local+replicated, $reached remote DC(s) reached)=" +
            $(if ($lastDate) { $lastDate.ToString('u') } else { 'never' }) + " ageDays=$ageDays")

          if ($ageDays -lt $threshold) {
            throw "synbackup last authenticated $ageDays days ago (< $threshold); NOT disabling. Investigate the live consumer first."
          }

          $changed = $false
          if ($user.Enabled) {
            if ($apply) {
              Disable-ADAccount -Identity $username
              Write-Output "DISABLED synbackup (reversible: Enable-ADAccount -Identity synbackup)"
            } else {
              Write-Output "WOULD DISABLE synbackup (report-only; pass sacpne_execute=true)"
            }
            $changed = $true
          } else {
            Write-Output "NOOP synbackup already disabled"
          }
          Write-Output ("Changed=" + ($changed -and $apply))
      register: sacpne_synbackup_result
      changed_when: "'Changed=True' in sacpne_synbackup_result.output"
      tags: [synbackup]

    - name: Show remediation actions
      ansible.builtin.debug:
        msg: >-
          {{ (sacpne_deprivilege_result.results | map(attribute='output') | list)
             + (sacpne_nested_result.results | map(attribute='output') | list)
             + ([sacpne_synbackup_result.output] if sacpne_synbackup_result.output is defined else []) }}
      tags: [deprivilege, synbackup]

  post_tasks:
    # adminCount only clears after AdminSDHolder/SDProp runs (~hourly) once the
    # account is no longer in any protected group, directly or nested. netsvc
    # clears immediately (adminCount was already 0); svc-syno-repl clears on the
    # next SDProp pass. Re-run with --tags verify after an hour to confirm.
    - name: Re-report alert state after remediation
      when: sacpne_execute | bool
      vars:
        sacpne_privileged_json: "{{ sacpne_privileged_groups | to_json }}"
        sacpne_accounts_json: "{{ sacpne_report_accounts | to_json }}"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          [string[]]$privileged = '{{ sacpne_privileged_json }}' | ConvertFrom-Json
          [string[]]$names = '{{ sacpne_accounts_json }}' | ConvertFrom-Json
          $rows = foreach ($n in $names) {
            $u = Get-ADUser -LDAPFilter "(sAMAccountName=$n)" -Properties `
              adminCount, userAccountControl, memberOf
            if (-not $u) { continue }
            $uac = [int]$u.userAccountControl
            $groups = @($u.memberOf | ForEach-Object { (Get-ADGroup $_).Name })
            $directPriv = @($groups | Where-Object { $privileged -contains $_ })
            $isPriv = ([int]$u.adminCount -eq 1) -or ($directPriv.Count -gt 0)
            [pscustomobject]@{
              account = $u.SamAccountName
              enabled = -not ($uac -band 0x2)
              never_expires = [bool]($uac -band 0x10000)
              adminCount = [int]$u.adminCount
              directPriv = ($directPriv -join ',')
              privileged = $isPriv
              alertFires = ((-not ($uac -band 0x2)) -and ($uac -band 0x10000) -and $isPriv)
            }
          }
          $rows | Format-Table -AutoSize | Out-String
      register: sacpne_state_after
      changed_when: false
      tags: [verify]

    - name: Show post-remediation state
      when: sacpne_execute | bool
      ansible.builtin.debug:
        var: sacpne_state_after.output
      tags: [verify]

    - name: Note the deliberately un-cleared accounts and the gated rotation follow-on
      ansible.builtin.debug:
        msg:
          - "ldap: NOT touched here. It is an actively-used Domain Admin being retired; clearing"
          - "  its flag would expire a 2000+ day password (9-way outage). Fix = the phased"
          - "  retirement in runbooks/security/ldap-account-retirement.md, not this playbook."
          - "roy, rich: human Domain Admins. Cannot be de-privileged (they are legitimate admins)"
          - "  and must not be rotated autonomously. Operator action: interactive password reset"
          - "  (resets pwdLastSet), THEN clear DONT_EXPIRE_PASSWORD, then consider Protected Users."
          - "ROTATION follow-on (Workstream 3, GATED, NOT done here): to also drop DONT_EXPIRE_PASSWORD"
          - "  on netsvc/svc-syno-repl the password must be rotated in lockstep with its consumer —"
          - "  netsvc via 'netsh dhcp server set dnscredentials' on the DHCP servers; svc-syno-repl"
          - "  via the DSM Snapshot Replication plan (secret/synology/snapshot-replication/"
          - "  ad-service-account). Seed the new password to Vault first, following"
          - "  ansible/domain/seed_service_account_passwords.yml."
      tags: [deprivilege]
