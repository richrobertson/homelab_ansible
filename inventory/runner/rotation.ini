# Inventory for the UNATTENDED AD rotation runner (scripts/rotate_due_service_accounts.py,
# run by the prod CronJob in homelab_flux apps/*/ad-rotation). Committed on purpose:
# it holds only hostnames and connection settings - the WinRM password is looked up
# from Vault at run time (group_vars/rdp_servers_windows.yml), never stored here.
#
# Keep this to what rotate_service_account_passwords.yml needs. Do not grow it into a
# second production inventory; inventory/environments/production.ini stays the
# operator's (gitignored) source of truth.

[domain_controllers_windows]
dc1.myrobertson.net ansible_host=192.168.1.3
rhonda.myrobertson.net ansible_host=192.168.1.245

[rdp_servers_windows:children]
domain_controllers_windows

[rdp_servers_windows:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_scheme=http
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
