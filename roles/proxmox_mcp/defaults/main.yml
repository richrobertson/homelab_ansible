---
# --- Upstream MCP server -----------------------------------------------------
# gilby125/mcp-proxmox is a stdio MCP server (MIT). It is pinned by commit
# because the project publishes no tags and is not on the npm registry.
proxmox_mcp_repo_url: https://github.com/gilby125/mcp-proxmox.git
proxmox_mcp_repo_version: 6186c715b5ff393adc9fdf597a791c35bc2f90c7
proxmox_mcp_install_dir: /opt/proxmox-mcp
proxmox_mcp_entrypoint: index.js

# --- stdio -> Streamable HTTP bridge ----------------------------------------
# The MCP server itself only speaks stdio, so supergateway fronts it with an
# HTTP listener that remote clients can reach.
proxmox_mcp_bridge_package: supergateway
proxmox_mcp_bridge_version: 3.4.3
# supergateway exposes no bind-address flag; it always listens on all
# interfaces. proxmox_mcp_allowed_client_cidrs below is what actually
# constrains who can reach the port.
proxmox_mcp_port: 8096
proxmox_mcp_http_path: /mcp
proxmox_mcp_health_path: /healthz
proxmox_mcp_log_level: info
proxmox_mcp_session_timeout_ms: 600000

# --- Node runtime ------------------------------------------------------------
proxmox_mcp_nodejs_major: 22
proxmox_mcp_manage_nodesource_repo: true

# --- Service identity --------------------------------------------------------
proxmox_mcp_service_name: proxmox-mcp
proxmox_mcp_user: proxmox-mcp
proxmox_mcp_group: proxmox-mcp
proxmox_mcp_config_dir: /etc/proxmox-mcp
proxmox_mcp_env_file: /etc/proxmox-mcp/proxmox-mcp.env

# --- Proxmox connection ------------------------------------------------------
proxmox_mcp_proxmox_host: pve3.myrobertson.net
proxmox_mcp_proxmox_port: 8006
proxmox_mcp_verify_tls: true

# Read-only by default. Setting this to true exposes destructive tooling
# (VM/LXC lifecycle, config edits) to any client that can reach the endpoint,
# and also requires widening proxmox_mcp_token_privileges on the Proxmox side.
proxmox_mcp_allow_elevated: false

# Optional blast-radius limits passed straight through to the MCP server.
# Empty means unrestricted.
proxmox_mcp_node_allowlist: []
proxmox_mcp_vmid_allowlist: []

# --- Vault source for the API token -----------------------------------------
proxmox_mcp_vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
proxmox_mcp_vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
proxmox_mcp_vault_mount: secret
proxmox_mcp_vault_path: proxmox/cl0/mcp

# --- Network exposure --------------------------------------------------------
# supergateway has no inbound authentication, so the listener is firewalled to
# known client networks. Setting this to an empty list disables the nftables
# rules entirely and leaves the port open to the whole L2 segment.
proxmox_mcp_manage_firewall: true
proxmox_mcp_allowed_client_cidrs:
  - 192.168.1.0/24
