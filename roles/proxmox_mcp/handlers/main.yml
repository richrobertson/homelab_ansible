---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart proxmox-mcp
  ansible.builtin.systemd_service:
    name: "{{ proxmox_mcp_service_name }}"
    state: restarted

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
